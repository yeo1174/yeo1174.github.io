ragraph (1), “MS IEC” means the latest published edition of the Malaysian\nStandard which is identical to the International Electrotechnical Commission Standard.\n[Amendment 2012]"},{"id":"bylaw-39","kind":"bylaw","num":"39","title":"Natural lighting and ventilation.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":["2012","2021"],"content":"(1) Every room designed, adapted or used for residential, business or other purposes except hospitals\nand schools shall be provided with natural lighting and natural ventilation by means of one or\nmore windows having a total area of not less than 10 percent of the clear floor area of such room\nand not less than half out of this 10 percent floor area shall have openings capable of allowing\na free uninterrupted passage of air.\n[Amendment 2012]\n[Amendment 2021]\n(2) Every room used for the accommodation of patients in a hospital shall be provided with natural\nlighting and natural ventilation by means of one or more windows having a total area of not less\nthan 15 percent of clear floor area of such room and not less than two third out of this 15 percent\nfloor area shall have openings capable of allowing a free uninterrupted passage of air.\n[Amendment 2012]\n[Amendment 2021]\n(3) Every room used for the purpose of conducting classes in a school shall be provided with natural\nlighting and natural ventilation by means of one or more windows having a total area of not less\nthan 20 percent of clear floor area of such room and not less than half out of this 20 percent\nfloor area shall have openings capable of allowing a free uninterrupted passage of air.\n[Amendment 2012]\n[Amendment 2021]\n(4) Every water closet, latrine, urinal or bathroom shall be provided with natural lighting and natural\nventilation by means of one or more openings having a total area of not less than 0.2 square metre\nper water closet, urinal, latrine or bathroom and such openings shall be capable of allowing a free\nuninterrupted passage of air."},{"id":"bylaw-40","kind":"bylaw","num":"40","title":"Air wells.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"(1) (a) The minimum size of each air well where provided in all buildings shall be as follows:\n(i) for buildings up to 2 storeys in height, 7 square metres;\n(ii) for buildings up to 4 storeys in height, 9 square metres;\n(iii) for buildings up to 6 storeys in height, 11 square metres;\n(iv) for buildings up to 8 storeys in height, 13 square metres;\n(v) for buildings more than 8 storeys in height, 15 square metres.\n(b) The minimum width of such air wells in any direction shall be 2.5 metres.\n(2) (a) The minimum size of each air well for lavatories, water closets and bathrooms shall be as\nfollows:\n(i) for buildings up to 2 storeys in height, 3.5 square metres;\n(ii) for buildings up to 4 storeys in height, 4 square metres;\n(iii) for buildings up to 6 storeys in height, 4.5 square metres;\n(iv) for buildings up to 8 storeys in height, 5 square metres;\n(v) for buildings more than 8 storeys in height, 5.5 square metres.\n(b) The minimum width of such air wells in any direction shall be 2 metres."},{"id":"bylaw-41","kind":"bylaw","num":"41","title":"Mechanical ventilation and air conditioning.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":["2012","2021"],"content":"(1) Where permanent mechanical ventilation or air conditioning is intended, the relevant building\nby-laws relating to natural ventilation, natural lighting and heights of rooms shall not apply.\n[Amendment 2012]\n(2) A permanent air conditioning system shall be provided with alternate means of ventilating the\nair conditioned enclosure, such that within half an hour of the air conditioning system failing,\nnot less than the stipulated volume of fresh air specified hereinafter shall be introduced into the\nenclosure during the period when the air conditioning system is not functioning.\n[Amendment 2012]\n[Amendment 2021]\n(3) The provisions of the Third Schedule to these By-laws shall apply to buildings which are\nmechanically ventilated or air conditioned.\n(4) Where permanent mechanical ventilation in respect of lavatories, water closets, bathrooms or\ncorridors is provided for and maintained in accordance with the requirements of the Third Schedule\nto these By-laws, the provisions of these By-laws relating to natural ventilation and natural lighting\nshall not apply to such lavatories, water closets, bathrooms or corridors."},{"id":"bylaw-42","kind":"bylaw","num":"42","title":"Minimum areas of rooms in residential buildings.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"(1) The area of the first habitable room in a residential building shall be not less than 11 square\nmetres, the second habitable room be not less than 9.3 square metres and all other rooms be not\nless than 6.5 square metres in area.\n(2) The width of every habitable room in a residential building shall be not less than 2 metres.\n(3) The area and width of a kitchen in a residential building shall be not less than 4.5 square metres\nand 1.5 metres respectively."},{"id":"bylaw-43","kind":"bylaw","num":"43","title":"Minimum dimensions of latrines, water closets and bathrooms.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"In all buildings, the sizes of latrines, water closets and bathrooms shall be --\n(a) in the case of latrines or water closets with pedestal-type closet fittings, not less than 1.5\nmetres by 0.75 metre;\n(b) in the case of water closets with fittings other than pedestal-type closet fittings, not less than\n1.25 metres by 0.75 metre;\n(c) in the case of bathrooms, not less than 1.5 square metres with a width of not less than 0.75\nmetre; and\n(d) in the case of bathrooms with closet fittings, not less than 2 square metres with a width of\nnot less than 0.75 metre.\nBy-Law 44. Height of rooms in residential buildings, shophouses, schools, etc.\n(1) The height of rooms in residential buildings other than shophouses shall be --\n(a) for living rooms and bedrooms, not less than 2.5 metres;\n(b) for kitchens, not less than 2.25 metres;\n(c) for bathrooms, water closets, latrines, porches, balconies, verandahs, garages and like, not\nless than 2 metres.\n(2) The average height of rooms with sloping ceilings in residential buildings other than shophouses\nshall be --\n(a) for living rooms and bedrooms, not less than 2.5 metres;\n(b) for kitchens, not less than 2.25 metres;\n(c) for bathrooms, water closets, latrines, porches, balconies, verandahs, garages and the like,\nnot less than 2 metres.\nProvided that no part of any room shall be less than 2 metres in height.\n(3) In shophouses the height of ground floor rooms shall be not less than 3 metres and the height of\nupper floor rooms shall be not less than 2.5 metres. Where the depth of such shophouse at any\nupper floor level is greater than 10.5 metres the height of rooms on every such upper floor shall\nbe not less than 2.55 metres.\n(4) In schools, the height of rooms used for the dissemination of knowledge shall be not less than 3\nmetres headroom.\n(5) In hospitals, the height of rooms used for the accommodation of patients shall be not less than 3\nmetres.\n(6) The height of any room in a factory in which any person works shall be not less than 3 metres\nheadroom."},{"id":"bylaw-45","kind":"bylaw","num":"45","title":"Height of rooms in places of public resorts.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"(1) The height of rooms, other than water closets, lavatories, cloakrooms, corridors and rooms to which\nthe public do not have access in places of public resort shall be not less than 3.5 metres. Where\na balcony is provided for in places of public resort, the heights between the level of the topmost\ntier of the balcony and the ceiling over such topmost tier, and between the floor immediately\nunder the balcony and the underside of the balcony, shall be not less than 3 metres in each case.\n(2) In places of public resorts, the provisions of paragraphs (1) of by-law 46 shall apply to water\nclosets, lavatories, cloakrooms, corridors and rooms to which the public do not have access."},{"id":"bylaw-46","kind":"bylaw","num":"46","title":"Height of rooms in other buildings.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"(1) In buildings other than those specified in the preceding provisions of by-laws 44 and 45 the height\nof rooms on the ground floor shall not be less than 3 metres and on any floor above the ground\nfloor shall not be less than 2.75 metres.\n(2) The height of any basement shall be not less than 2.5 metres.\n(3) Where the greater part of the ground floors is left open for use as car park or covered garden or\nsimilar purpose, the height of such ground floor shall be not less than 2.5 metres.\n(4) The minimum headroom of any habitable room or space inside any building shall be 2 metres.\n(5) The height of any verandah-way shall be not less than 3 metres."},{"id":"bylaw-47","kind":"bylaw","num":"47","title":"Projections over a verandah-way.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"Projections in the nature of --\n(a) beams;\n(b) stairways and landings;\n(c) screens;\n(d) blinds; and\n(e) signboards or advertisements:\nwhich are not less than 2.5 metres above the verandah-way paving may be permitted."},{"id":"bylaw-48","kind":"bylaw","num":"48","title":"Commencement of building operation.","part":"IV","partTitle":"TEMPORARY WORKS IN CONNECTION WITH BUILDING OPERATIONS","amendments":["2007"],"content":"(1) When any building operation is commenced, the person responsible for the erection shall display\na board giving the names, addresses and telephone numbers of the principal submitting person,\nsubmitting person and building contractor.\n[Amendment 2007]\n(2) Construction of any building shall not commence unless a protective hoarding to the requirements\nof the local authority is erected to separate the building from the public street or footway.\n(3) Where a protective hoarding is required, a temporary permit shall be obtained in accordance with\nby-law 19 and the protective hoarding shall be constructed according to the approved protective\nhoarding plan and shall during the demolition or erection of any building be maintained in good\ncondition to the satisfaction of the local authority."},{"id":"bylaw-49","kind":"bylaw","num":"49","title":"Responsibility of person granted temporary permits.","part":"IV","partTitle":"TEMPORARY WORKS IN CONNECTION WITH BUILDING OPERATIONS","amendments":[],"content":"The person to whom the temporary permit is granted shall be responsible for --\n(a) taking such measures as are necessary to keep the roadside drain clear of obstruction and to\nthe satisfaction of the local authority;\n(b) adjustments to existing cables, pipes and other service or utility or equipment and for their\nreinstatement on completion of the works in accordance with the requirements of the relevant\nauthorities;\n(c) painting the ends of the hoardings white and for having the ends of hoardings and railings\nsuitably marked by red warning lights throughout the night;\n(d) any accident and damage to property or persons, directly attributable to the hoardings or\nrailings;\n(e) ensuring that hydrant points and any other existing utility service installations are not obstructed\nby such hoardings or materials;\n(f) providing suitable openings with hand-rails at the ends of the hoarding to permit easy means\nof access and egress over the roadside drain, to and from the adjoining verandah-ways;\n(g) the maintenance of the hoarding to the satisfaction of the local authority;\n(h) exercising due care not to damage any existing service mains by overloading the ground or\nby any temporary construction;\n(i) removing the hoarding together with all materials and debris on completion of the works; and\n(j) to reinstate any damage to roads, drains, footways and verandah-ways and leaving the site and\ndrains in a clean and tidy condition."},{"id":"bylaw-50","kind":"bylaw","num":"50","title":"Cancellation of temporary permit.","part":"IV","partTitle":"TEMPORARY WORKS IN CONNECTION WITH BUILDING OPERATIONS","amendments":[],"content":"The local authority shall have the right to cancel the temporary permit for breach of any of the foregoing\nconditions or for any reason it thinks fit and the applicant shall within one week of receipt of such notice\nhave the hoardings, railings and all other materials connected therewith removed from the public road."},{"id":"bylaw-51","kind":"bylaw","num":"51","title":"Vehicular access to site.","part":"IV","partTitle":"TEMPORARY WORKS IN CONNECTION WITH BUILDING OPERATIONS","amendments":[],"content":"Vehicular access to the site may be restricted to specified hours to avoid obstructing the flow of traffic\nif found to be necessary."},{"id":"bylaw-52","kind":"bylaw","num":"52","title":"Rising mains to be installed progressively.","part":"IV","partTitle":"TEMPORARY WORKS IN CONNECTION WITH BUILDING OPERATIONS","amendments":[],"content":"In buildings which are designed to exceed 18.3 metres in height to the top most full floor, rising mains\nin accordance with by-law 232 shall be installed as soon as the building exceeds that height to provide\nfire fighting facilities during the various stages of construction."},{"id":"bylaw-53","kind":"bylaw","num":"53","title":"Building materials.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":[],"content":"(1) Any materials used-\n(a) in the erection of a building;\n(b) in the structural alteration or extension of a building;\n(c) in the execution of works or the installation of fittings, being works or fittings to which any\nprovision of these By-laws applies; or\n(d) for the backfilling of any excavations on a site in connection with any building or works or\nfittings to which any provision of these By-laws applies, shall be -\n(aa) of a suitable nature and quality in relation to the purposes for and conditions in which\nthey are used;\n(ab) adequately mixed or prepared; and\n(ac) applied, used or fixed so as to adequately perform the functions for which they are\ndesigned.\n(2) The use of any material or any method of mixing or preparing materials or of applying, using or\nfixing materials, which conforms with a Standard Specification or Code of Practice prescribing the\nquality of material or standards of workmanship shall be deemed to be sufficient compliance with\nthe requirements of paragraph (1) of by-law 53 if the use of the material or method is appropriate\nfor the purpose and conditions in which it used."},{"id":"bylaw-54","kind":"bylaw","num":"54","title":"General requirements of loading.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"(1) In determining, for the purposes of these By-laws, the loads to which any building will be subjected,\nthe permanent and imposed loads and wind loads shall be calculated in accordance with this Part:\n[Amendment 2012]\nProvided that in the case where -\n(a) an actual imposed load to which a building will be subjected will exceed the imposed load\ncalculated in accordance with this Part, such actual load shall be substituted for the load so\ncalculated; and\n(b) plant, machinery or equipment will produce exceptional dynamic effects, there shall be\nsubstituted for the imposed load calculated in accordance with this Part such greater amount\nwhich would, as a static load, produce stresses of a magnitude and kind approximating to\nthat induced dynamically.\n(2) In determining, for the purposes of this Part, the loads to which a building will be subjected --\n(a) permanent loads shall be calculated in accordance with MS EN 1991-1-1 or as provided\nhereinafter;\n[Amendment 2012]\n(b) imposed loads shall be calculated in accordance with MS EN 1991-1-1 or as provided\nhereinafter:\n[Amendment 2012]\nProvided that, if any actual imposed load will exceed or is likely to exceed the load so\ncalculated, that actual load shall be substituted for the load so calculated; and\n(c) wind loads shall be calculated in accordance with MS 1553.\n[Amendment 2012]\n(3) Deleted\n[Amendment 2012]"},{"id":"bylaw-55","kind":"bylaw","num":"55","title":"Permanent and imposed loads.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]\n(1) The provisions of this Part relating to permanent and imposed loads shall apply to --\n(a) new buildings and new structures;\n[Amendment 2012]\n(b) structural alterations and additions to existing buildings and existing structures; and\n(c) existing construction on change of use:\nbut shall not apply to the maintenance of, or the replacement of parts of, existing buildings and\nstructures where there is no change of use.\n(2) The permanent and imposed loads provided hereinafter shall be in addition to and not in substitution\nof provision relating to --\n[Amendment 2012]\n(a) loads on road bridges;\n(b) loads on rail bridges;\n(c) loads due to wind;\n(d) loads due to seismic forces;\n(e) loads due to explosions;\n(f) loads on structures subject to internal pressure from their contents such as bunkers, silos\nand water tanks;\n(g) loads incidental to construction;\n(h) loads due to lifts and escalators;\n(i) loads due to machinery vibration (except those due to some gantry cranes);\n(j) loads due to thermal effects; and\n(k) test loads."},{"id":"bylaw-56","kind":"bylaw","num":"56","title":"Permanent loads calculated from weights of materials used.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]\n(1) Permanent loads shall be calculated from unit weight given in accordance with MS EN 1991-1-1\nor from the actual known weights of the materials used.\n[Amendment 2012]\n(2) Typical values for commonly used materials are laid out in MS EN 1991-1-1.\n[Amendment 2012]"},{"id":"bylaw-57","kind":"bylaw","num":"57","title":"Weight of partitions.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"Where partitions are shown in the plans, their actual weights shall be included in the permanent load.\nTo provide for partitions where their positions are not shown on the plans, the beams and the floor\nslabs where these are capable of effective lateral distribution of the load, shall be designed to carry,\nin addition to other loads, a uniformly distributed load per square metre of not less than one third of\nthe weight per metre run of the finished partitions, but not less than 1kN/m2 if the floor is used for\noffice purposes.\n[Amendment 2012]"},{"id":"bylaw-58","kind":"bylaw","num":"58","title":"Contents of tanks and other receptacles.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"The weight of tanks and other receptacles, and of their contents shall be treated as permanent loads;\naccount shall be taken of the load conditions when a tank or receptacle is full and when it is empty.\n[Amendment 2012]"},{"id":"bylaw-59","kind":"bylaw","num":"59","title":"Imposed floor loads.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"All imposed floor loads shall be calculated in accordance with MS EN 1991-1-1.\n[Amendment 2012]"},{"id":"bylaw-60","kind":"bylaw","num":"60","title":"Mechanical stacking.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"Where there is the possibility of the use of mechanical stacking machines, such as fork lift trucks,\nspecial provision shall be made in the design of the floors in accordance with MS EN 1991-1-1.\n[Amendment 2012]"},{"id":"bylaw-61","kind":"bylaw","num":"61","title":"Imposed loads on ceilings, skylights and similar structures.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"(1) The support of ceilings (other than false ceilings), ribs of skylights, frames and covering (other\nthan glazing) of access hatches and similar structures shall be designed in accordance with MS\nEN 1991-1-1.\n[Amendment 2012]\n(2) Deleted.\n[Amendment 2012]\n(3) For the purpose of this by-law, false ceiling means a ceiling which is built with a space between\nit and the structure above and which satisfies at least one of the following conditions relating to\naccess to that space:\n(a) the space is inaccessible; or\n(b) the ceiling is demountable for access; or\n(c) the space is provided with catwalks supported independently.\n[Amendment 2021]"},{"id":"bylaw-62","kind":"bylaw","num":"62","title":"Reductions in total imposed floor loads.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"The reduction in assumed total imposed floor loads given in MS EN 1991-1-1 shall be taken in designing\ncolumns, piers, walls, their supports and foundations.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-63","kind":"bylaw","num":"63","title":"Imposed roof loads.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"For the purpose of this by-law, imposed roof loads shall be designed in accordance with MS EN 1991-1-1.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-64","kind":"bylaw","num":"64","title":"Curved roofs.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"The imposed load on a curved roof shall be calculated in accordance with MS EN 1991-1-1.\n[Amendment 2012]"},{"id":"bylaw-65","kind":"bylaw","num":"65","title":"Roof coverings.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"To provide for loads incidental to maintenance, all roof coverings, other than glazing, shall be in\naccordance with MS EN 1991-1-1.\n[Amendment 2012]"},{"id":"bylaw-66","kind":"bylaw","num":"66","title":"Internal suspended loads on primary structural members.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":[],"content":"Due allowance shall be made in the design of roof trusses or other primary structural members supporting\nroofs, for the weight of heating, lighting and ventilating equipment, service trunking, piping for liquids\nor gases, mechanical handling or production equipment and overhead walkways for inspection and\nmaintenance, as applicable."},{"id":"bylaw-67","kind":"bylaw","num":"67","title":"Amount of suspended load.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"Any panel point of the lower chord of such roof trusses or any point of such other primary structural\nmembers supporting roofs over garages, manufacturing or storage floors shall be designed in accordance\nwith MS EN 1991-1-1.\n[Amendment 2012]"},{"id":"bylaw-68","kind":"bylaw","num":"68","title":"Dynamic loading.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Where loads arising from machinery, runways, cranes and other plant producing dynamic effects\nare supported by or communicated to the framework, allowance shall be made for these dynamic\neffects, including impact, by increasing the dead weight values by an adequate amount.\n(2) In order to ensure due economy in design, the appropriate dynamic increase for all members\naffected shall be ascertained as accurately as possible.\n(3) In the absence of sufficient data for such calculations, the increase in the imposed loads shall be\nin accordance with MS EN 1991-1-1.\n[Amendment 2012]\n[Amendment 2021]\n(4) Concentrated imposed loads including impact and vibrating effects which may arise due to\ninstalled machinery shall be considered and provided for in the design. In any event the increase\nin imposed loads shall not be less than 20 percent or the minimum standard as specified in the\nMS EN 1991-1-1, whichever is the higher.\n[Amendment 2012]\n[Amendment 2021]\n(5) Provisions shall also be made for carrying any concentrated equipment loads while the equipment\nis being installed or moved for servicing and repairing."},{"id":"bylaw-69","kind":"bylaw","num":"69","title":"Crane gantry girders.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"In respect of crane gantry girders, all forces set up by vibrations, shocks from slipping of slings, kinetic\naction of acceleration and retardation and the impact of wheel loads shall be designed in accordance\nwith MS EN 1991-1-1.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-70","kind":"bylaw","num":"70","title":"Parapets and balustrades.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"Parapets, balustrades and lower panels of cladding or curtain walls shall be designed for the minimum\nloads in accordance with MS EN 1991-1-1.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-71","kind":"bylaw","num":"71","title":"Vehicle barriers for car parks.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"All vehicle barriers including enclosing parapets and balustrades shall be designed to withstand the\nimpact force of vehicles in accordance with MS EN 1991-1-1.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-72","kind":"bylaw","num":"72","title":"Basement walls and floors.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"(1) In the design of basement walls and similar underground structures, provision shall be made for\nthe lateral pressure of adjacent soil, due allowance being made for possible surcharge from fixed\nor moving loads.\n(2) When a portion, or the whole, of the adjacent soil is below a free water surface, computations\nshall be based on the weight of the soil diminished by buoyancy plus full hydrostatic pressure.\n(3) In the design of basement floors and similar structures underground, the upward pressure of water,\nif any, shall be taken as the full hydrostatic pressure applied including any artesian pressure over\nthe entire area.\n[Amendment 2012]\n(4) The hydrostatic head shall be measured from the underside of the construction."},{"id":"bylaw-73","kind":"bylaw","num":"73","title":"Foundations.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Deleted.\n[Amendment 2012]\n[Amendment 2021]\n(1) The foundations of a building shall---\n[Amendment 2012]\n[Amendment 2021]\n(a) safely sustain and transmit to the ground the combined permanent load, imposed load and\nwind load in such a manner as not to cause any settlement beyond the limits designed for\nor other movement which would impair the stability of, or cause damage to, the whole or\nany part of the building or of any adjoining building or works;\n[Amendment 2012]\n(b) be taken down to such a depth, or be so constructed, as to safeguard the building against\ndamage by soil settlement and movement; and\n[Amendment 2012]\n(c) be capable of adequately resisting any attack by sulphates or any other deleterious matter\npresent in the subsoil.\n(1A) The earthworks, the underground building works and the foundations for the building shall be\ndesigned based on the field and laboratory tests of proper site investigation and the tests shall\nbe initiated and supervised by a professional engineer with the relevant geotechnical experience.\n[Amendment 2021]\n(2) The requirements of paragraph (1) shall be deemed to be satisfied if the foundations of a building\nare designed and constructed in accordance with MS EN 1997.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-74","kind":"bylaw","num":"74","title":"Foundations of buildings not exceeding four storeys. Deleted.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-75","kind":"bylaw","num":"75","title":"Reinforced concrete foundations.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"Reinforced concrete foundations shall be designed and constructed in accordance with MS EN 1990,\nMS EN 1991 and MS EN 1992.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-76","kind":"bylaw","num":"76","title":"Strip foundations. Deleted.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-76A","kind":"bylaw","num":"76A","title":"Buildings on hill slopes.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]\nEvery building to be constructed on hill slopes shall comply with any planning requirement as the local\nauthority may determine.\n[Amendment 2012]"},{"id":"bylaw-77","kind":"bylaw","num":"77","title":"Brick footings. Deleted.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2007","2012"],"content":"[Amendment 2007]\n[Amendment 2012]"},{"id":"bylaw-78","kind":"bylaw","num":"78","title":"Foundations below invert of drains.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"Within a distance not less than the depth of a drain measured from the closer edge of the drain, no\npart of a building shall be erected with its substructure foundation level higher than 450 millimetres\nbelow the drain invert level, unless the whole of such a building is carried on piles other than\ntimber piles.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-79","kind":"bylaw","num":"79","title":"Foundations under external and party walls.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012"],"content":"Where an external wall is built against another external wall or against a party wall of an adjacent\nbuilding lot, the extent of concrete foundations shall not extend beyond its own lot boundary.\n[Amendment 2012]"},{"id":"bylaw-80","kind":"bylaw","num":"80","title":"Structure above foundations.","part":"V","partTitle":"STRUCTURAL REQUIREMENTS","amendments":["2012","2021"],"content":"(1) The structure of a building above the foundations shall be designed and constructed to safely\nsustain and transmit to the foundations the combined permanent and imposed loads and wind\nloads without such deflection or deformation as will impair the stability of, or cause damage to,\nthe whole or any part of the building.\n[Amendment 2012]\n(2) The requirements of paragraph (1) shall be deemed to be satisfied if the design and construction\nof the structure or part of the structure complies with the following standards:\nMS EN 1990 – Basis of structural design;\nMS EN 1991 – Actions on structures;\nMS EN 1992 – Design of concrete structures;\nMS EN 1993 – Design of steel structures;\nMS EN 1994 – Design of composite steel and concrete structures;\nBS EN 1995 – Design of timber structures or\nMS 544 – Code of practice for structural use of timber;\nMS EN 1996 – Design of masonry structures;\nMS EN 1998 – Design of structures for earthquake resistance; and\nMS EN 1999 – Design of aluminium structures.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-81","kind":"bylaw","num":"81","title":"Building site.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"(1) No building shall be erected on any site which has been filled up with any matter impregnated\nwith faecal, animal or vegetable matter, until the whole ground surface or site of such building\nhas been properly treated based on geotechnical techniques conforming to MS 1754 and MS 1756.\n[Amendment 2012]\n(2) The ground to be built upon by any building shall be effectively cleared of turf and other vegetable\nmatter."},{"id":"bylaw-82","kind":"bylaw","num":"82","title":"Drainage of subsoil.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) Wherever the dampness or position of the site of a building renders it necessary, the subsoil of\nthe site shall be effectively drained or such other steps shall be taken as will effectively protect\nthe building against damage from moisture.\n(2) Where, during the making of an excavation for a building, existing subsoil drains are discovered,\nsuch drains shall either be diverted or replaced by pipes of approved material to ensure the continual\npassage of subsoil water through such drains in such a manner as to ensure that no subsoil water\nentering such drains causes dampness to the site of the building."},{"id":"bylaw-83","kind":"bylaw","num":"83","title":"Protection against soil erosion, etc.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"(1) All slopes in and around buildings shall be suitably protected against soil erosion and slope failures\nand shall be monitored and maintained regularly.\n[Amendment 2012]\n(2) All ground under raised buildings shall be suitably finished and graded to prevent the accumulation\nof water or the growth of unwanted vegetation or for the breeding of vermin."},{"id":"bylaw-84","kind":"bylaw","num":"84","title":"Prevention of dampness.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"(1) Suitable measures shall be taken to prevent the penetration of dampness and moisture into a\nbuilding.\n(2) Damp proof courses where provided shall comply with BS 743 (materials for Horizontal D.P.C.)\n(3) Every wall of a building founded on foundation shall be provided with a damp proof course which\nshall be --\n[Amendment 2012]\n(a) at a height of not less than 150 millimetres above the surface of the ground adjoining the\nwall; and\n(b) beneath the level of the underside of the lowest portion of the ground floor resting on the\nwall, or where the ground floor is a solid floor, not higher than the level of the upper surface\nof the concrete or other similar solid material forming the structure of the floor.\n[Amendment 2012]\n(4) Where any part of a floor of the lowest or only storey of a building is below the surface of the\nadjoining ground and a wall or part of a wall of the storey is in contact with the ground --\n(a) the wall or part of the wall shall be constructed or provided with a vertical damp proof\ncourse so as to be impervious to moisture from its base to a height of not less than 150\nmillimetres above the surface of the ground; and\n(b) an additional damp proof course shall be inserted in the wall or part of the wall at its base.\n(5) Where the floor or any part of the walls of a building is subject to water pressure, that portion\nof the floor or wall below ground level shall be waterproof."},{"id":"bylaw-85","kind":"bylaw","num":"85","title":"Nominal thickness of walls.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"For the purposes of this Part wherever references are made to the thickness of any brick wall, the\nmaximum or minimum thickness of such wall shall not exceed the nominal thickness plus or minus\nthe maximum tolerance permissible under any standard specification."},{"id":"bylaw-86","kind":"bylaw","num":"86","title":"Party walls.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2021"],"content":"(1) All party walls shall generally be of not less than 200 millimetres total thickness of solid masonry\nor constructed of other materials of various thickness if they comply with Parts V, VI and VII of\nthese By-Laws and have an acoustic performance of not less than STC 50 of sound transmission\nloss attenuation (STC rating).\n(2) Such a party wall shall be made up of two separate skins, each of the skins shall not be less than\n100 millimetres thickness if constructed at different time.\n(3) Multi-storeyed residential buildings of reinforced concrete or other framed construction shall be\nconstructed to the requirements of these By-Laws, and the party wall thereof shall not be less\nthan 100 millimetres total thickness at any point on the wall.\n(4) No combustible material shall be built into the thickness of any party wall unless not less than\n100 millimetres of masonry or a fire stop with an equivalent fire resistance period is provided\nbetween such materials.\n(5) Openings may be made or left in a party wall provided that the written consent of owners of the\nproperties concerned are obtained and in accordance with these By-Laws.\n(6) Every opening in a party wall shall be reinstated to its original state and properly bonded therewith\nwhen the use of such an opening has been discontinued.\n[Amendment 2021]"},{"id":"bylaw-87","kind":"bylaw","num":"87","title":"Openings in party walls. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-88","kind":"bylaw","num":"88","title":"Recess.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"Where a recess is made in an external wall --\n[Amendment 2012]\n(a) the wall at the back of the recess shall be not less than 100 millimetres thick in an external\nwall;\n[Amendment 2012]\n(b) a sufficient arch or lintel of incombustible material shall be built in every storey over the\nrecess;\n(c) in each storey the total area of recesses causing the wall at the back of the recesses to be of\nless thickness than that prescribed by these By-laws shall not exceed one-half of the superficial\narea of the wall; and\n(d) the side of the recess nearest to the inner face of a return external wall, shall be not less than\n300 millimetres therefrom."},{"id":"bylaw-89","kind":"bylaw","num":"89","title":"Chases. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-90","kind":"bylaw","num":"90","title":"Underpinning.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"If underpinning is required the owner or his agent shall --\n(a) give written notice to the local authority informing of the fact and stating the method of\nunderpinning proposed to be used;\n(b) obtain the written sanction of the local authority thereof before proceeding with the work; and\n(c) comply with the requirements as set out in these By-laws."},{"id":"bylaw-91","kind":"bylaw","num":"91","title":"Coping, etc., to be impervious.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) Every coping, cornice or other like projection shall be of brick, tile, stone concrete, cement render\nor other impervious material.\n(2) Every parapet wall, free-standing wall or boundary wall shall be finished on top with an impervious\nmaterial."},{"id":"bylaw-92","kind":"bylaw","num":"92","title":"Projections in brickwork. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-93","kind":"bylaw","num":"93","title":"Measurement of the length of a wall.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012","2021"],"content":"For the purposes of these By-laws-\n(a) walls shall be deemed to be divided into distinct lengths by return walls when bonded to each\nother;\n(b) the length of a wall shall be measured from centre to centre of --\n(i) cross walls bonded to it; or\n(ii) a column therein having a dimension measured parallel to the length of the wall of not\nless than twice the thickness of the wall and a dimension measured at right angles to the\nwall of not less than three times the thickness of the wall.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-94","kind":"bylaw","num":"94","title":"Use of 100 millimetres brickwork and concrete blocks in load-bearing walls.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"Deleted.\n[Amendment 2012]"},{"id":"bylaw-95","kind":"bylaw","num":"95","title":"External panel walls.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2021"],"content":"In all cases where masonry or other materials and components are used for external panel walls, such\nwalls shall be properly secured to the structural framework in accordance with Part V of these By-Laws.\n[Amendment 2021]"},{"id":"bylaw-96","kind":"bylaw","num":"96","title":"Non load-bearing partition.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"Every non load-bearing partition shall be adequately restrained or buttressed."},{"id":"bylaw-97","kind":"bylaw","num":"97","title":"Timber built into party walls. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-98","kind":"bylaw","num":"98","title":"Fences and boundary walls.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"Fences or walls to the boundaries of detached properties other than the boundary which abuts the street\nor backlane shall be constructed to a maximum height of 1.8 metres in the case of solid fences or walls\nand to a maximum height of 2.75 metres in the case of fences which are so constructed as to permit\nthe passage of light and air."},{"id":"bylaw-99","kind":"bylaw","num":"99","title":"Cooking facilities in residential buildings.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Every residential building and every floor of a residential building which may be separately let\nfor dwelling purposes shall be provided with a kitchen.\n[Amendment 2012]\n[Amendment 2021]\n(2) Where a common vertical kitchen exhaust riser is provided, the riser shall be continued up to a\nmechanical floor or roof for discharge to the open and shall be constructed with fire resisting\nmaterial of at least 2 hours rating in accordance with BS 476: Part 3.\n[Amendment 2012]\n[Amendment 2021]\n(3) Deleted.\n[Amendment 2012]"},{"id":"bylaw-100","kind":"bylaw","num":"100","title":"Cooking facilities in quarters. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-101","kind":"bylaw","num":"101","title":"Boilers, fireplaces, forges and incinerators in factories.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"Boilers, fireplaces, furnaces, forges, incinerators and other similar heat generating appliances used in\nbuildings other than residential buildings shall be provided with adequate means for conveying the heat\nand fumes generated by such appliances so as to discharge into the open by means of properly constructed\nflues or ducts of fire resisting material of at least two hours rating in accordance with BS 476: Part 3."},{"id":"bylaw-102","kind":"bylaw","num":"102","title":"Combustible materials adjoining smoke flues.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"Combustible materials used in the construction of the building shall be at least 80 millimetres clear of\nany casing to any flue required for the conveyance of smoke or other products of combustion."},{"id":"bylaw-103","kind":"bylaw","num":"103","title":"Timber floors. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-104","kind":"bylaw","num":"104","title":"Bearing for joists. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-105","kind":"bylaw","num":"105","title":"Space below floors to be ventilated.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"Where the ground floor of any building is constructed with timber joists and flooring boards, the space\nbelow the floor shall be adequately ventilated."},{"id":"bylaw-106","kind":"bylaw","num":"106","title":"Dimensions of staircases.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2021"],"content":"(1) In any staircase, the rise of any staircase shall be not more than 180 millimetres and the tread\nshall be not less than 275 millimetres and the dimensions of the rise and the tread of the staircase\nso chosen shall be uniform and consistent throughout.\n[Amendment 2021]\n(2) The widths of staircases shall be in accordance with by-law 168.\n(3) The depths of landings shall be not less than the width of the staircases."},{"id":"bylaw-107","kind":"bylaw","num":"107","title":"Handrails.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"(1) Except for staircases of less than 4 risers, all staircases shall be provided with at least one handrail.\n(2) Staircases exceeding 2200 millimetres in width shall be provided with intermediate handrail for\neach 2200 millimetres of required width spaced approximately equally.\n[Amendment 2012]\n(3) In buildings other than residential buildings, a handrail shall be provided on each side of the\nstaircase when the width of the staircase is 1100 millimetres or more.\n(4) All handrails shall project not more than 100 millimetres from the face of the finished wall\nsurface and shall be located not less than 825 millimetres and not more than 900 millimetres\nmeasured from the nosing of the treads provided that handrails to landings shall not be less than\n900 millimetres from the level of the landing."},{"id":"bylaw-108","kind":"bylaw","num":"108","title":"Maximum flights.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) In residential buildings, a landing of not less than 1.80 metres in depth shall be provided in\nstaircases at vertical intervals of not more than 4.25 metres and in staircases in all other buildings\nthere shall be not more than sixteen risers between each such landing.\n(2) No part in any flight of any staircase shall have less than two risers."},{"id":"bylaw-109","kind":"bylaw","num":"109","title":"Winders.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Deleted.\n[Amendment 2012]\nWinding and spiral staircase shall not form part of an exit route.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-110","kind":"bylaw","num":"110","title":"No obstruction in staircases.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) There shall be no obstruction in any staircase between the topmost landing thereof and the exit\ndischarge on the ground floor\n(2) There shall be no projection, other than handrails in staircases, in any corridor, passage or staircase\nat a level lower than 2 metres above the floor or above any stair."},{"id":"bylaw-111","kind":"bylaw","num":"111","title":"Lighting and ventilation of staircases.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012","2021"],"content":"All staircases shall be properly lighted at the average illuminance level of not less than 100 lux and\nventilated according to the requirements as stipulated under by-laws 198 to 200 of Part VII.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-112","kind":"bylaw","num":"112","title":"Enclosure of staircases in a shop.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2021"],"content":"(1) In a shop, the flight of stairs which has access direct from the street shall be enclosed with walls\nin incombustible material.\n[Amendment 2021]\n(2) The use of other materials as walls shall be subjected to approval from the Director General.\n[Amendment 2021]"},{"id":"bylaw-113","kind":"bylaw","num":"113","title":"Use of timber staircases.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) Timber staircases may be permitted for the following types of buildings which are not more than\nthree storeys in height:\n(a) detached residential buildings;\n(b) semi-detached residential buildings;\n(c) terrace houses;\n(d) in the upper floors of shophouses other than from the ground floor to the first floor provided\nthat it is located within the protected area for its full height; and\n(e) other similar types of buildings of limited fire risk at the discretion of the local authority.\n(2) All other staircases shall have a fire-resistance rating of not less than two hours."},{"id":"bylaw-114","kind":"bylaw","num":"114","title":"Timber roofs. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-115","kind":"bylaw","num":"115","title":"Roof coverings and drainage with a rainwater harvesting and utilisation system (SPAH).","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2011","2021"],"content":"[Amendment 2011]\n(1) All roofs of buildings shall be so constructed as to drain effectually to suitable and sufficient\nchannels, gutters, chutes or troughs which shall be provided in accordance with the requirements\nof these By-Laws for receiving and conveying all water which may fall on and from the roof.\n[Amendment 2011]\n(2) For buildings required to install SPAH, the design and construction of SPAH shall conform to the\nfollowing requirements:\n(a) rainwater shall not flow into the public water tank;\n(b) water from the public water tank may flow into the rainwater tank provided that it is equipped\nwith a one-way non-return valve or the overflow pipe in the rainwater tank shall be located\nat least 225 millimetres lower from the inlet pipe to the rainwater tank;\n(c) the SPAH outlet and rainwater tank shall be clearly marked with “Not For Drinking Or\nBathing”.\n(d) gutters used shall have sufficient slope to prevent stagnant water; and\n(e) rainwater pipes shall be green in colour.\n[Amendment 2011]\n[Amendment 2021]"},{"id":"bylaw-116","kind":"bylaw","num":"116","title":"Accessible flat roofs, balconies, etc.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"Every flat roof, balcony or other elevated areas 1.8 metres or more above the adjacent area where\nnormal access is provided shall be protected along the edges with suitable railings, parapets or similar\ndevices not less than 1 metre in height or other suitable means."},{"id":"bylaw-117","kind":"bylaw","num":"117","title":"Access to roof space.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"Where the space beneath a roof is enclosed by a ceiling, access to such space shall be provided by\nmeans of a trap door at least 600 millimetres in any direction.\n[Amendment 2012]\n(2) Deleted.\n[Amendment 2012]"},{"id":"bylaw-118","kind":"bylaw","num":"118","title":"Refuse chutes and alternate means for disposal of refuse.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"Deleted.\n[Amendment 2012]"},{"id":"bylaw-119","kind":"bylaw","num":"119","title":"Change of use of building.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) When the use of a building is changed from non-residential to residential, refuse chutes or other\nalternate means for the disposal of refuse shall be provided to the satisfaction of the local authority.\n(2) Where the use of a building is changed from residential to non-residential, the openings into\nexisting refuse chute serving the converted floors shall be sealed up."},{"id":"bylaw-120","kind":"bylaw","num":"120","title":"Design and construction of refuse chutes. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-121","kind":"bylaw","num":"121","title":"Requirements for refuse receptacle chambers. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-122","kind":"bylaw","num":"122","title":"Access to refuse receptacle chambers. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-123","kind":"bylaw","num":"123","title":"Pipes and service ducts. Deleted.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2012"],"content":"[Amendment 2012]"},{"id":"bylaw-124","kind":"bylaw","num":"124","title":"Lifts.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"For all non-residential buildings exceeding 4 storeys above or below the main access level at least one\nlift shall be provided."},{"id":"bylaw-125","kind":"bylaw","num":"125","title":"Swimming pools.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) The floor and wall surfaces of swimming pools shall be smooth and free from cracks.\n(2) Swimming pools shall be completely surrounded by an overflow channel constructed so that --\n(a) the overflow and any matter floating therein cannot return directly to the swimming pool;\n(b) the arms or legs of swimmers cannot be trapped by the overflow channel; and\n(c) swimmers can take hold of the edge of the overflow channel but so that the depth of the\noverflow channel does not enable the bottom of the overflow channel to be touched with\nthe fingers."},{"id":"bylaw-126","kind":"bylaw","num":"126","title":"Steps and footway.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) Steps shall be situated at the side walls near the ends of the swimming pool and shall be so\narranged that they are not higher than the internal facing of the walls of the swimming pool,\nsuch steps being constructed of non-ferrous materials with a non-slip surface and provided with\na handrail.\n(2) A footway with a non-slip surface shall be provided round every swimming pool."},{"id":"bylaw-127","kind":"bylaw","num":"127","title":"Openings into swimming pool.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"The openings by which the water enters a swimming pool shall be distributed in such a manner that\ncirculation of the water in the swimming pool is uniform and dead points of stagnant place avoided."},{"id":"bylaw-128","kind":"bylaw","num":"128","title":"Depth of water.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) Swimming pools shall have lines marked on the side walls of a swimming pool to indicate --\n(a) the depth of the water at the shallow and deep ends of the swimming pool;\n(b) the part of the swimming pool where the depth of the water is between 1.3 metres and 1.8\nmetres; and\n(c) the depth of the water shown in figures over the lines marked on the side of the swimming\npool above the overflow channel of the swimming pool.\n(2) The water in swimming pools with diving boards or platforms shall have the following minimum\ndepths as measured at any point within the swimming pool 1.53 metres from the free end of the\ndiving boards or platforms:\n(a) for diving boards up to 3 metres above the level of the water, such minimum depth shall\nbe 3.3 metres; and\n(b) for platforms up to 9.7 metres above the level of the water, such minimum depth shall be\n4.5 metres."},{"id":"bylaw-129","kind":"bylaw","num":"129","title":"Location of diving boards.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"Diving boards, platforms and water chutes in the swimming pool shall be situated not less than 1.8\nmetres from the sides of the swimming pool or from any other diving board, platform or water chute\nin the swimming pool."},{"id":"bylaw-130","kind":"bylaw","num":"130","title":"Changing rooms.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"(1) Swimming pools shall have separate changing rooms for each sex.\n(2) The flooring of such changing rooms shall be of a non-slip impermeable material, easy to clean,\nand graded to drainage outlets sufficient to enable water used therein for cleaning purposes to be\nrapidly drained.\n(3) The walls of such changing rooms shall be smooth, impermeable, and easy to clean up to a height\nof 1.8 metres."},{"id":"bylaw-131","kind":"bylaw","num":"131","title":"Footbaths and shower.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":[],"content":"There shall be provided around the swimming pool sufficient numbers of footbaths of not less than\n0.9 metre each in any dimension with a shower situated over the entrance thereto and such foot-bath\nshall be provided with running water."},{"id":"bylaw-132","kind":"bylaw","num":"132","title":"Private, residential swimming pools.","part":"VI","partTitle":"CONSTRUCTIONAL REQUIREMENTS","amendments":["2021"],"content":"By-laws 125 to 131 shall apply to public and commercial swimming pools and not to private, residential\nor special purpose swimming pools, the approval of which shall be at the discretion of the local authority.\n[Amendment 2021]"},{"id":"bylaw-133","kind":"bylaw","num":"133","title":"Interpretation.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"In this Part and Part VIII unless the context otherwise requires --\n“automatic” means a device or system providing an emergency function without the necessity of human\nintervention;\n“balcony approach” means a balcony being an external approach to a common staircase serving one\nor more occupancies;\n“boundary” in relation to a building, means the boundary of the land belonging to the building (such\nland being deemed to include any abutting part of a street, canal or river but only up to the centre\nline thereof); and boundary of the premises shall be construed so as to include any such part to the\nsame extent;\n“circulation space” means any space which is solely or predominantly used as a means of access\nbetween a room and a protected shaft or between either a room or a protected shaft and exit from the\nbuilding or compartment;\n“compartment” means any part of a building which is separated from all other parts by one or more\ncompartment walls or compartment floors or by both such walls and floors; and for the purposes of\nthe Part, if any part of the top storey of a building is within a compartment, the compartment shall\nalso include any room space above such part of the top storey;\n“compartment wall” and “compartment floor” mean respectively a wall and a floor which comply with\nby-law 148, and which are provided as such for the purposes of by-law 136 to divide a building into\ncompartments for any purpose in connection with by-law 213 or 147;\n“D.G.F.S.” means the Director General of Fire Services, Malaysia or the relevant Fire Authority;\n Deleted.\n[Amendment 2012]\n“dead-end” means an area from which escape is possible in one direction only and in an open plan\nincludes any point from which the direct routes to alternative exists subtend an angle of less than 45o;\n“designated floor” means the floor level at which the fire brigade has access to the fire lifts and will\nnormally be the floor level closest to the fire appliance access level;\n“direct distance” means the shortest distance from any point within the floor area measured within the\nexternal enclosures of the building to the relevant exit disregarding walls, partitions of fittings other\nthan the enclosing walls or partitions to exit staircases;\n[Amendment 2021]\n“Director General” means the Director General of Fire and Rescue;\n[Amendment 2012]\n[Amendment 2021]\n“door” includes any shutter, cover or other form of protection to an opening in any wall or floor of\na building, or in the structure surrounding a protected shaft, whether the doors is constructed of one\nor more leaves;\n“dry rising system” Deleted.\n[Amendment 2012]\n“element of structure” means –\n(a) any member forming part of the structural frame of a building or any other beam or column\n(not being a member forming part of a roof structure only);\n(b) a floor, including a compartment floor, other than the lowest floor of a building;\n(c) an external wall;\n(d) a separating wall;\n(e) a compartment wall;\n(f) structure enclosing a protected shaft;\n(g) a load-bearing wall or load-bearing part of a wall; and\n(h) a gallery;\n“emergency lighting” means the illumination obtained through either an independent or secondary\nsource of electricity supply such as trickle charged accumulators or separate generators to the normal\nor duplicate lighting;\n“exit discharge” means a door from a storey, flat, or room which door gives access from such storey,\nflat or room on to an exit route;\n“exit door” means a door from a storey, flat, or room which door gives access from such storey, flat\nor room on to an exit route;\n“exit route” means a route by which persons in any storey of a building may reach a place of safety\noutside the building and may include a room, doorway, corridor, stairway or other means of passage\nnot being a revolving door, lift or escalator;\n“exit staircase” means a staircase separated from the building it serves by partitions having an FRP of\nnot less than half hour and which has all openings in such partitions fitted with fixed lights and self\u0002closing doors each having an FRP of not less than half hour;\n[Amendment 2021]\n“externally non-combustible” means externally faces with, or otherwise externally consisting of non\u0002combustible material;\n“external staircase” means a staircase which is completely open to the external air on at least two sides\nfrom the level of the top of the balustrade to the underside of the flight of stairs immediately above;\n“final exit” means a point of discharge for the escape route from a building providing direct access to\nthe street, passage-way or open steps sited to enable the evacuation of persons from the vicinity of a\nbuilding so that they are safe from fire or smoke;\n“fire alarm installation” Deleted.\n[Amendment 2012]\n“Fire Authority” means the officer in charge of the relevant Fire and Rescue Department or any officer\nauthorized by him in writing;\n[Amendment 2012]\n[Amendment 2021]\n“fire appliance access level” means the level at which fire appliances can approach the building for\npurposes of fire fighting or evacuation of occupants;\n“fire fighting access level” means the highest level that a fire appliance ladder may be brought against\na building for purposes of fire fighting and evacuation;\n“fire fighting access lobby” means a lobby separated from the storey it serves by construction of a FRP\nof at least half hour, directly accessible from a fire fighting staircase and a fire lift and containing a\ndry or wet riser;\n“fire fighting shaft” means a protected enclosure that contains a fire fighting staircase and a fire fighting\naccess lobby with or without a fire lift;\n[Amendment 2021]\n“fire fighting staircase” means a staircase designated as a recognised means of access into the building\nfor firemen in the event of a fire;\n“fire hydrant” Deleted.\n[Amendment 2012]\n“fire lifts” means lifts capable of being commandeered for exclusive use of firemen in emergency;\n“firemen’s switch” means a switch located adjacent to the fire lift by the designated floor to enable\nthe fire brigade to gain control of the fire lifts;\n“fire resistance” has the meaning ascribed to it in by-law 221;\n“fire resistance period” means the period for which an element will meet the requirements in respect\nof transmission of heat or resistance to collapse with passage of flame when tested in accordance with\nBS 476;\n[Amendment 2012]\n[Amendment 2021]\n“fire resisting” means the construction so designated, including doors, has a minimum standard of fire\u0002resistance of not less than half hour in accordance with the relevant Schedules of these By-laws or which\nachieves such standard when tested in accordance with BS 476 except that, in the case of the doors –\n[Amendment 2012]\n(a) the rabbets to the door frame or the door stops whichever may be are not less than 18\nmillimetres deep; and\n(b) the door is hung on metal hinges having a melting point of not less than 8000C; and\n(c) the door is rendered self-closing;\n“fire stop” means a barrier or seal which would prevent or retard the passage of smoke or flame within\na cavity or around a pipe or duct where it passes through a wall or floor or at a junction between\nelements of structure;\n“F.O.C.” Deleted.\n[Amendment 2012]\n“FRP” means fire resistance period;\n“height of a building” has the meaning ascribed to it in by-law 135;\n“horizontal exit” is a means of egress from a compartment or building to an adjacent compartment or\nbuilding on approximately the same level and thence to an exit staircase or final exit either direct or\nvia a protected corridor;\n[Amendment 2021]\n“hose reel installation” Deleted.\n[Amendment 2012]\n“interior finish” means the exposed interior surface of buildings including, but not limited to fixed or\nmovable walls, partitions, columns and ceilings;\n“internal staircase” means a staircase enclosed on all sides by partitions of walls and which has all\nopenings in the external walls glazed or otherwise protected from the weather;\n“non-combustible” shall apply to materials as specified under BS 476;\n[Amendment 2012]\n“open corridor” means a corridor that has wall openings open to the atmosphere primarily for the\nadequate dissipation of smoke;\n[Amendment 2012]\n“open structure” means a structure that, at each level, has wall openings opening open to the atmosphere;\n[Amendment 2012]\n[Amendment 2021]\n“permitted limit of unprotected areas” means the maximum aggregate area of unprotected areas in any\nside or external wall of a building or compartment, which complies with the requirements as set out\nin the Sixth Schedule to these By-laws for such building or compartment;\n“protected corridor” means a corridor separated from the building it serves by partitions having FRP\nof not less than half hour and which partitions have all openings therein fitted with fixed lights and\nself-closing doors each having a FRP of not less than half hour;\n“protected lobby” means a lobby enclosed throughout by partitions having an FRP of not less than\nhalf hour and has all openings therein fitted with fixed lights and self-closing doors having an FRP of\nnot less than half hour;\n“protected shaft” means a stairway, lift, escalator, chute, duct or other shaft which enables persons, things\nor air to pass between different compartments; and which complies with the requirements of by-law 150;\n“protected staircase” Deleted.\n[Amendment 2021]\n“protecting structure” means any wall or floor or other structure which encloses a protected shaft other\nthan --\n(a) a wall which also forms part of an external wall, separating wall or compartment wall; or\n(b) a floor which is also a compartment floor or a floor laid directly on the ground; or\n(c) a roof;\n“relevant boundary” in relation to a side or external wall of a building or compartment, means that\npart of the boundary of the premises or the notional boundary as prescribed in by-law 146 which is\nadjacent to that side or wall and either coincides with, is parallel to or is at an angle of not more than\n800 with that side or wall;\n“separating wall” means a wall or part of a wall which is common to two adjoining buildings;\n“smoke lobby” means a protected lobby being the approach to a staircase and which acts as a fire and\nsmoke check between a storey and the staircase;\n“smoke stop door” Deleted.\n[Amendment 2012]\n [Amendment 2021]\n“sprinkler installation” Deleted.\n[Amendment 2012]\n“storey exit” means a fire rated door to a protected staircase or a corridor protected with a fire resisting\nstructure in accordance with the Ninth Schedule to these By-laws and in the case of ground floor\naccommodation storey exit means a door leading direct to a place of safety outside the building;\n“travel distance” means the distance required to be traversed from any point in a storey of a building\nto either --\n(a) the fire-resisting door in the staircase enclosure; or\n(b) if there is no such door, the first stair tread of the staircase;\n“unprotected area” in relation to an external wall or side of a building, means --\n(a) a window, door or other opening;\n(b) any part of the external wall which has fire resistance less than that specified by this Part for\nthe wall; and\n(c) any part of the external wall which has combustible material more than 1.5 millimetres thick\nattached or applied to its external face, whether for cladding or any other purpose;\n“wet rising system” Deleted.\n[Amendment 2012]"},{"id":"bylaw-134","kind":"bylaw","num":"134","title":"Designation of purpose groups.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"For the purpose of this Part every building or compartment shall be regarded according to its use or\nintended use as falling within one of the purpose groups set out in the Fifth Schedule to these By-laws\nand, where a building is divided into compartments, used or intended to be used for different purposes,\nthe purpose group of each compartment shall be determined separately:\nProvided that where the whole or part of a building or compartment, as the case may be, is used\nor intended to be used for more than one purpose, only the main purpose of use of that building or\ncompartment shall be taken into account in determining into which purpose group it falls."},{"id":"bylaw-135","kind":"bylaw","num":"135","title":"Rules of measurement.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"In this Part-\n(a) the height of a building, or of such of a building as described in by-law 215 means the height\nof such building or part, measured from the mean level of the ground adjoining the outside\nof the external walls of the building to the level of half the vertical height of the roof of the\nbuilding or part, or to the top of the walls of the parapet (if any), whichever is the higher;\n(b) the area of --\n(i) any storey of a building or compartment shall be taken to be the total area in that storey\nbounded by the finished inner surfaces of the enclosing walls or, of any side where there\nis no enclosing wall, by the outermost edge of the floor on that side;\n(ii) any room or garage shall be taken to be the total area of its floor bounded by the inner\nfinished surfaces of the walls forming the room or garage;\n(iii) any part of a roof shall be taken to be the actual visible area of such part measured on\na plane parallel to the pitch of the roof;\n(c) the cubic capacity of a building or compartment shall be ascertained by measuring the volume\nof space contained within-\n(i) the finished inner surfaces of the enclosing walls or, on any side where there is no\nenclosing wall, a plane extending vertically above the outermost edge of the floor on\nthat side;\n(ii) the upper surface of its lowest floor; and\n(iii) in the case of a building or of a compartment which extends to a roof, the under surface\nof the roof or, in the case of any other compartments, the under surface of the ceiling\nof the highest storey within the compartment, including the space occupied by any other\nwalls, or any shafts, ducts or structure within the space to be so measured."},{"id":"bylaw-136","kind":"bylaw","num":"136","title":"Provisions of compartment walls and compartment floors.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"Any building, other than a single storey building, of a purpose group specified in the Fifth Schedule\nto these By-laws and which has --\n(a) any storey the floor area of which exceeds that specified as relevant to a building of that\npurpose group and height; or\n(b) a cubic capacity which exceeds that specified as so relevant shall be so divided into compartments,\nby means of compartment walls or compartment floors or both, that --\n(i) no such compartment has any storey the floor area of which exceeds the area specified\nas relevant to that building; and\n(ii) no such compartment has a cubic capacity which exceeds that specified as so relevant\nto that building:\nProvided that if any building is provided with an automatic sprinkler installation which complies with\nMS 1910, this by-law has effect in relation to that building as if the limits of dimensions specified are\ndoubled except for a patient accommodation ward which is in accordance with by-law 224A.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-136A","kind":"bylaw","num":"136A","title":"Use of fire shutters.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) A fire shutter may be permitted to be used as a compartment wall, except for the fire compartmentation\nof Fire Command Centre (FCC) or means of escape including an exit staircase, fire fighting access\nlobby, smoke lobby or internal exit passageway.\n(2) A shutter, may be used to protect an opening in the compartment wall or floor and the shutter\nshall have the necessary fire resistance including a thermal insulation, which shall not be less\nthan the fire resistance of the compartment wall or floor.\n(3) However, the fire shutter, which may be installed to any area without any intended fire load such\nas the edge of atria or voids such as escalators voids areas, car park driveways and between the\nfloors or door-ways, may not have the thermal insulation.\n(4) The commonly used shutters such as vertical fire shutters, horizontal fire shutters and lateral fire\nshutters shall comply with MS 1073: Part 3 or BS 476: Part 22 and the following requirements:\n(a) for a vertical fire shutter operated by gravity during a fire, upon activation by a fire alarm\nsystem or fusible link, the operating mechanism of a curtain or leaf of the vertical fire\nshutter shall be released; and the curtain or leaf shall descend under gravity at a controlled\nrate; and\n(b) for an electrically operated vertical fire shutter, lateral fire shutter or horizontal fire shutter\n(a fusible link is not required), upon activation by fire alarm system, the electrical motor\nshall drive the curtain or leaf to descend and shall be backed up by an emergency power\nsupply; and the power and signal cables shall be fire-rated.\n(5) The mode of activation for fire shutters at different locations shall be as follows:\n(a) where the fire shutter is used as a separating wall between two buildings—\n(i) if two buildings are separated by a common fire shutter, both gravity-operated and\nelectrically-operated fire shutters shall be linked to the fire alarm systems of both\nbuildings and shall be activated by the fire alarm system of either building, and the\nactivation solely by a fusible link shall not be permitted; and\n(ii) if two buildings are separated by two separate fire shutters, both gravity-operated\nand electrically operated fire shutters shall be activated by the fire alarm system of\nits own building and the activation solely by a fusible link shall not be permitted;\n(b) where the fire shutter is used as a compartment wall or floor for limiting a compartment\narea and cubical extent, as compartmentation between different purpose groups and as\ncompartmentation of a passenger lift lobby or goods lift lobby which is situated at the\nbasement:\n(i) for gravity-operated vertical fire shutter, the activation by a fusible link is acceptable;\nand\n(ii) for an electrically operated fire shutter, the activation shall be by local smoke detector\nor other fire alarm;\n(c) where the fire shutter is used as a compartmentation at atria or voids or between floors (being\npart of the engineered smoke control design), only an electrically-operated fire shutter shall\nbe permitted, and the signal to operate the respective fire shutter shall be from a dedicated\nsmoke detector installed at the respective smoke zone.\n(6) An exit directional signage marks with an arrow and the word “KELUAR” shall be prominently\npainted or pasted on a fire shutter or smoke curtain to redirect the building occupants to the\nnearest exits if the activated shutter visually obscure the building exit or directional sign.\n(7) The signage shall be reflective and the letter in the signage shall be at least 100 millimetres in\nheight.\n[Amendment 2021]"},{"id":"bylaw-137","kind":"bylaw","num":"137","title":"Compartmentation by height.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\n(1) In any building of not exceeding 30 metres in height, any floor which is more than 9 metres\nabove the ground floor level which separates one storey from another storey, other than a floor\nwhich is either within a maisonette or a mezzanine floor, shall be constructed as a compartment\nfloor.\n[Amendment 2012]\n[Amendment 2021]\n(2) In any building of exceeding 30 metres in height, all floors shall be constructed as compartment\nfloors other than compartments which are within the residential maisonettes which may comprise\nof two storey levels.\n[Amendment 2012]\n[Amendment 2021]\n(3) An atrium shall comply with the requirements of by-law 252A.\n[Amendment 2012]"},{"id":"bylaw-138","kind":"bylaw","num":"138","title":"Other walls and floors to be constructed as compartment walls or compartment floors.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"The following walls and floors in buildings shall be constructed as compartment walls or compartment\nfloors:\n(a) any floor in a building of Purpose Group II (Institutional);\n(b) any wall or floor separating a flat or maisonette from any other part of the same building;\n(c) any wall or floor separating part of a building from any other part of the same building\nwhich is used or intended to be used mainly for a purpose falling within a different purpose\ngroup as set out in the Fifth Schedule to these By-laws; and\n(d) any floor immediately over a basement storey if such basement storey has an area exceeding\n100 square metres."},{"id":"bylaw-138A","kind":"bylaw","num":"138A","title":"Partition.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"Every partition in a building shall comply with the Ninth Schedule – Part IX and the material for a\nsurface finish of the partition shall not be treated as part of the wall and shall comply with the relevant\nprovision of by-law 206.\n [Amendment 2021]"},{"id":"bylaw-139","kind":"bylaw","num":"139","title":"Separation of fire risk areas.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) The following area or use shall be separated from the other areas of the occupancy in which it\nis located by a fire resisting construction of an element of structure of a fire resistance period\naccording to the Ninth Schedule based on the degree of a fire risk:\n(a) a boiler room or associated fuel storage area;\n(b) a repair shop involving hazardous process or material;\n(c) a storage area of materials in quantities deemed hazardous;\n(d) a liquified petroleum gas storage area;\n(e) a transformer room or substation;\n(f) a flammable liquid store;\n(g) a shaft for an electrical riser excluding the shaft for an extra low voltage system; or\n(h) a cold room.\n[Amendment 2012]\n[Amendment 2021]\n(2) For a hospital or nursing home of Purpose Group II (Institutional), a laboratory or kitchen shall\nnot have sleeping accommodation above them and shall form a separate compartment from in\u0002patient treatment area, public area, staircase or lift discharge area.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-140","kind":"bylaw","num":"140","title":"Fire appliances access.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Fire appliance access shall be provided within the site of a building to enable a fire appliance to\ngain access to the building.\n[Amendment 2012]\n[Amendment
