 and EN ISO 11925-2 Class 1 BS 476: Part 7\nClass C EN 13823 and EN ISO 11925-2 Class 2 BS 476: Part 7\nClass D EN 13823 and EN ISO 11925-2 Class 3 BS 476: Part 7\nClass F EN ISO 11925-2 Class 4 BS 476: Part 7\n[Amendment 2021]"},{"id":"schedule-TENTH","kind":"schedule","key":"TENTH","ordinal":10,"ordinalWord":"Tenth","title":"Table of requirement for the fire alarm system and fire extinguishment system","amendments":["2012","2021"],"content":"TABLE OF REQUIREMENT FOR THE FIRE ALARM SYSTEM AND FIRE\nEXTINGUISHMENT SYSTEM\n[By-law 225 (1), 226A, 227, 228, 237, 238, 239]\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\nI. Small residential\n(i) Private dwelling up to 2 storeys.\n(a) Terrace type.\n(b) Semi-detached.\n(c) Detached.\n(ii) Private dwelling of more than 2 storeys.\n-\n-\n-\n-\n-\n-\n-\nII. Institutional\n1. Education occupancy.\n(a) Building used for the instructional purpose\nonly.\n(i) Open corridor design.\n(aa) Two storeys and below. - -\n(ab) Three to five storeys. G 2\n(ac) Six storeys and above. G 1 & 2\n(ii) Other designs.\n(aa) Less than 500 square metres per\nfloor. - -\n(ab) 500 to 1,000 square metres per\nfloor. G 2\n(ac) 1,001 to 2,000 square metres per\nfloor or 18 metres to 30 metres in\nheight.\nG 1 & 2\n(ad) Exceeding 2,000 square metres per\nfloor or above 30 metres in height.\nA & G 2, 4, 5 & 6\n(b) Canteen detached or kitchen detached. - -\n(c) Laboratory or workshop (total floor area per\nblock).\n(i) Less than 1,000 square metres. - -\n(ii) 1,000 to 2,000 square metres. G 1 & 2\n(iii) Exceeding 2,000 square metres. A & G 2, 5 & 6\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\n(d) Library (total floor area).\n(i) Less than 500 square metres. - -\n(ii) 500 to 1,000 square metres. G 2\n(iii) 1,001 to 2,000 square metres. G 1 & 2\n(iv) Exceeding 2,000 square metres. A & G 2, 4, 5 & 6\n(e) Detached multi-purpose hall (total floor area).\n(i) Single storey and less than 2,000 square\nmetres. - -\n(ii) Two storeys and above or exceeding\n2,000 square metres.\nG 2\n(iii) Central air conditioning (total floor area)\nof exceeding 2,000 square metres. A & G 2 & 6\n(f) Educational institution in a commercial\ncomplex.\nTo be considered as part of an\noverall risk within the complex.\n2. Hospital or nursing home (total floor area).\n(a) Clinic – day care.\n(i) Less than 750 square metres. - -\n(ii) 751 to 1,000 square metres. G 2\n(iii) 1,001 to 2,000 square metres. G 1 & 2\n(iv) Exceeding 2,000 square metres. A & G 2 & 6\n(b) Patient accommodation.\n(i) Part of a commercial complex. To be considered as part of an overall\nrisk with a special requirement for\nthe emergency lighting, stretcher lift\nand so forth.\n(ii) Single storey.\n(aa) Less than 750 square metres.\n(ab) 751 to 1,000 square metres.\n(ac) Exceeding 1,000 square metres.\nG\nG\nA & G\n1 & 3\n2, 3, 4, 5 & 6\n(iii) Two storeys and above (total floor area).\n(aa) Less than 750 square metres.\n(ab) 751 to 1,000 square metres.\n(ac) Exceeding 1,000 square metres.\nG\nG\nA & G\n1 & 3\n2, 3, 4, 5 & 6\nNotes for the hospital:\nAll fire alarm systems within the wards shall be of the signal indicator type.\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\nIII. Other residential\n1. Hotel.\n(a) An open corridor design with an open staircase\nwith an extended lobby or tower staircase.\n(i) Two to three storeys.\n(aa) 50 rooms or less per block. - 1 & 2\n(ab) Exceeding 50 rooms per block. G 1 & 2\n(ii) Four storeys and above.\n(aa) 100 rooms or less per block. G 1 & 2\n(ab) Exceeding 100 rooms per block. A & G 2, 4, 5 & 6\n(b) Other designs.\n(i) Two to three storeys.\n(aa) Less than 20 rooms per block. - 1 & 2\n(ab) 20 to 100 rooms per block.\n(ac) Exceeding 100 rooms per block.\nG\nA & G\n1 & 2\n2, 4, 5 & 6\n(ii) Four storeys and above.\n(aa) Less than 50 rooms per block.\n(ab) 50 rooms and over per block.\nG\nA & G\n1 & 2\n2, 4, 5 & 6\n(c) Hotel above shop occupancy or hotel above\noffice occupancy.\nTo provide not less than that required\nfor an overall occupancy risk or refer\nNote 3 - 1 & 2.\n2. Hostel or dormitory.\n(i) Two storeys and below. - -\n(ii) Open corridor design.\n(aa) Three to five storeys.\n(ab) Six to ten storeys and its total floor area\nwhich is not exceeding 5,000 square\nmetres.\n(ac) Above ten storeys or a total floor area of\nexceeding 5,000 square metres.\nG\nG\nA & G\n1 & 2\n 2, 4, 5 & 6\n(iii) Other designs.\n(aa) Three to five storeys and its total floor\narea which is not exceeding 3,000 square\nmetres.\nG 1 & 2\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\n(ab) Above five storeys or a total floor area\nof exceeding 3,000 square metres. A & G 2, 4, 5 & 6\nNote:\nIf the hotel is situated at a location that may not be reached within the reasonable time or\ninaccessible to required types and number of fire appliances, a higher safety requirement shall\nbe provided and as required by the Director General.\n3. Apartment or flat.\n(a) Five storeys and below. - 7\n(b) Open corridor design.\n(i) Six to forty storeys or less than 120\nmetres in height.\nG 2, 5 & 7\n(ii) Above forty storeys or of exceeding 120\nmetres in height. A & G 2, 5 & 6\n(c) Internal staircase or a core design.\n(i) Six to ten storeys or less than 30 metres\nin height.\nG 2 & 7\n(ii) Eleven to forty storeys or less than 120\nmetres in height.\nG 2, 5 & 7\n(iii) Above forty storeys and of exceeding 120\nmetres in height.\nA & G 2, 5 & 6\nNote:\nFor the purpose of group 3(b) or (c) in this Schedule, an automatic fire detection system when\nrequired shall be confined to the common area only.\n4. Service apartment.\n(i) Ten storeys and below per block or less than\n30 metres in height.\nG 2, 5 & 7\n(ii) Above ten storeys or of exceeding 30 metres\nin height.\nA & G 2, 4, 5 & 6\nNote:\nAny purpose group in mixed development (such as combinations of residential and office\nor shop) to be considered as part of an overall risk within a complex unless any part of the\nbuilding shall be separated completely throughout its height both above and below the ground\nfrom all other parts by one compartment wall or more in the same continuous vertical plane.\nIV. Office\nTotal gross floor area.\n1. Four storeys and below or less than 1,000 square\nmetres.\n- -\n2. Five storeys and above or of exceeding 1,000\nsquare metres.\nG 2\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\n3. Exceeding 18 metres in height and less than\n10,000 square metres.\nG 1 & 2\n4. 30 metres and above in height or of exceeding\n10,000 square metres.\nA & G 2, 4, 5 & 6\nV. Shop\n1. Floor area which is not exceeding 250 square\nmetres per floor that is built as a separate\ncompartment for -\n(a) a building less than 4½ storeys or 18 metres\nin height; or\n- -\n(b) a building less than 4½ storeys or 18 metres in\nheight with the combination of a ground floor\nshop, and residential on upper floor or office\non upper floor.\n- -\n2. Single storey\n(a) Less than 1,000 square metres. - -\n(b) 1,000 to 2,000 square metres. G 1 & 2\n(c) Exceeding 2,000 square metres. A & G 2, 4, 5 & 6\n3. Two storeys and above (total floor area).\n(a) Less than 750 square metres. - -\n(b) 750 to 1,000 square metres. G 2\n(c) 1,001 to 3,000 square metres. G 1 & 2\n(d) Exceeding 3,000 square metres. A & G 2, 4, 5 & 6\n4. Hawker centre, food court, wet market or dry market.\n(a) Detached building less than 2,000 square\nmetres with an open structure design and\nnaturally ventilated.\n- -\n(b) Exceeding 2,000 square metres. G 2\n5. Combination of shop occupancy, and hotel\noccupancy or office occupancy.\nGross area calculated against the\nhighest risk requirement.\nVI. Factory\n1. Single storey detached unit, semi-detached unit or\nterrace unit.\n(a) Less than 750 square metres. - -\n(b) 750 to 1,000 square metres. G 2\n(c) 1,001 to 2,000 square metres. G 1 & 2\n(d) Exceeding 2,000 square metres. A & G 2, 4 & 6\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\n2. Open structure design.\n(a) Steel fabrication work or metal fabrication\nwork, engineering work or metal work or\nsimilar low fire risk establishment.\n- -\n(b) Sawmill. G & H 2\n(c) Steel mill. G & H 2\n3. Two storeys and above and in the types of\ndetached unit, semi-detached unit or terrace unit.\nEach floor is built as a separate compartment.\n(a) Less than 500 square metres per floor. - 2\n(b) 500 to 1,000 square metres per floor. G 1 & 2\n(c) Exceeding 1,000 square metres per floor. A & G 2, 5 & 6\n4. Flatted factory block (two storeys and above).\n(a) Less than 500 square metres per floor. - 2\n(b) 500 to 1,000 square metres per floor. G 2\n(c) Exceeding 1,000 square metres per floor or of\nexceeding 7,000 cubic metres per compartment.\nA & G 2, 5 & 6\n5. Vehicle assembly or a similar plant.\n(a) Less than 1,000 square metres total floor area. - -\n(b) 1,000 to 2,000 square metres total floor area. - 2\n(c) 2,001 to 5,000 square metres total floor area. G & H 1 & 2\n(d) Exceeding 5,000 square metres total floor area. A, G & H 2, 5 & 6\n6. Special structure.\n(a) Factory complex such as palm oil mill\ncomplexes, palm oil refineries, sugar mills, or\ncement work.\nG & H 2\n(b) Wet process. G 2\n(c) Hazardous process. A, B, C, D,\nF, G, & H\n(See Note 2)\n1, 2, 3, 4, 5 & 6\n(See Note 2)\nNote:\n1. Factory in operation after an hour of darkness shall be required to provide emergency\nlighting as required by the Director General.\n2. A special risk or hazardous process or hazardous storage shall be required to provide fire\nfighting equipment or fire safety installation as required by the Director General.\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\nVII. Place of assembly\n1. Place of assembly below the level of exit\ndischarge of exceeding 1,000 square metres (total\nfloor area).\nA & G 2 & 6\n2. Convention centre, community centre, private club,\nexhibition centre, museum or art gallery (total\nfloor area).\n(a) Not exceeding 1,000 square metres. - -\n(b) 1,001 to 2,000 square metres. G 1 & 2\n(c) Exceeding 2,000 square metres. A & G 2, 4, 5 & 6\n3. Theatre, cinema, concert hall or auditorium (total\nfloor area).\n(a) Not exceeding 1,000 square metres. - -\n(b) 1,000 to 2,000 square metres. G 1 & 2\n(c) Exceeding 2,000 square metres. A & G 2, 4, 5 & 6\n4. Amusement centre (total floor area).\n(a) Not exceeding 1,000 square metres. - -\n(b) 1,000 to 2,000 square metres. G 1 & 2\n(c) Exceeding 2,000 square metres. A & G 2, 4, 5 & 6\n5. Bus terminal, ferry terminal, train station or airport\n(total floor area).\n(a) Not exceeding 1,000 square metres. - 2\n(b) 1,000 to 2,000 square metres. G 1 & 2\n(c) Exceeding 2,000 square metres. A & G 2, 4, 5 & 6\n6. Place of worship.\nPlace of assembly used purely for a religious\npurpose.\n- -\nVIII. Storage and general\n1. Car park.\n(a) Open structure car park above the ground.\n- - (i) Single storey or less than 750 square\nmetres.\n(ii) Two storeys and above or of exceeding\n750 square metres per floor.\nG 2\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\n(b) Enclosed car park or underground car park.\n(i) Less than 2,000 square metres (total floor\narea).\nG 2\n(ii) Exceeding 2,000 square metres (total\nfloor area).\nA & G 2, 4, 5 & 6\n(c) Automated multilevel car park. A & G 2, 5 & 6\n2. Warehouse of non-combustible product or storage\nof non-combustible product such as clay or\nbleaching earth.\n(a) Single storey.\n(i) Less than 2,000 square metres. - -\n(ii) Exceeding 2,000 square metres. G 2\n(b) Two storeys and above. G 2\n3. Warehouse of combustible product or storage of\ncombustible product.\n(a) Single storey (total floor area).\n(i) Open sided of exceeding 1,000 square\nmetres.\nG 2\n(ii) Less than 250 square metres. - -\n(iii) 250 to 500 square metres. - 2\n(iv) 501 to 1,000 square metres and less than\n7,000 cubic metres.\nG 1 & 2\n(v) 1,001 square metres to 10,000 square\nmetres and 7,001 cubic metres to 70,000\ncubic metres.\nA & G 2 & 6\n(vi) Exceeding 10,000 square metres or of\nexceeding 70,000 cubic metres.\nA, G & H 2 & 6\n(b) Two storeys and over (total floor area).\n(i) Less than 1,000 square metres or less\nthan 7,000 cubic metres.\nG 1 & 2\n(ii) Exceeding 1,000 square metres or of\nexceeding 7,000 cubic metres.\nA & G 2 & 6\nOccupancy hazard\nExtinguishing\nsystem\nNote 2\nFire alarm system\nNote 3\nOpen Structure.\n(1) A total surface area of an opening shall not be less than 40 percent of the total perimeter\nwall area enclosing a floor or compartment.\n(2) The opening shall be shaped and located in such a way that the total length in a\nplan of the opening shall not be less than 50 percent of the perimeter of the floor or\ncompartment.\nOpen Corridor.\n(1) A total surface area of an opening shall not be less than 25 percent of the total perimeter\nwall area enclosing a balcony.\n(2) The opening shall be shaped and located in such a way that total length in a plan of the\nopening shall not be less than 50 percent of the perimeter of the balcony.\nOpen Sided.\n(1) All sides shall be opened.\n“Opening” shall be opened to outside, unenclosed space or permitted air well. Any\nindividual opening consists of a surface area less than 600 square millimetres or area\nwidth of an opening less than 25 millimetres shall not be regarded as the opening for\nthis purpose.\nNOTE 1:\nThe hazardous area or process area within any building referred to in Group VI or VIII are\nthe following areas:\n(a) boiler room or associated fuel storage space.\n(b) repair shop.\n(c) room or space used for storage of material in quantity deemed hazardous.\n(d) transformer room or electrical switch room.\n(e) plant room.\n(f) flammable liquid processing or refining operation.\n(g) indoor storage of a flammable liquid.\n(h) chemical plant, solvent extraction plant, distillation plant or refinery.\n(i) process equipment, pump room, open tank, dip-tank or mixing tank.\nNOTE 2:\nThe letter in the second column of this Schedule refer to the type of a fixed extinguishing\nsystem, as follows:\nA – automatic sprinkler system.\nB – water spray system.\nC – foam system.\nD – gaseous system.\nE – Deleted.\nF – other automatic extinguishing systems.\nG – hose reel system.\nH – pressurised hydrant system.\nNOTE 3:\nThe figure in the third column of this Schedule refer to the type of a fire alarm system as\nfollows:\n1. automatic fire detection system.\n2. manual electric fire alarm system.\n3. signal indicator alarm system.\n4. public address system.\n5. fireman intercom system and fire command centre.\n6. automatic fire monitoring system.\n7. self-contained smoke detector.\nNOTE 4:\nType of emergency illumination–\n(i) signal point unit.\n(ii) central battery.\n(iii) generator.\nIn all cases, the duration of emergency illumination in the event of failure of a normal supply\nshall not be less than 3 hours.\nNOTE 5:\nFor the purpose of this Schedule, the measurement of height shall be taken from the level of\nthe highest point of fire appliance access to the highest occupied floor level.\n[Amendment 2012]\n[Amendment 2021]\nWATER STORAGE CAPACITY\n[By-law 247(1)]\n1. MINIMUM QUANTITY OF WATER STORAGE REQUIRED FOR HOSE REEL AND\nFIRE HYDRANT INSTALLATIONS IN BUILDINGS\nFloor Area of the largest floor Water storage\nrequired\nNot exceeding 232.25 sq. m 9100 litre\nOver 232.25 sq. m but not exceeding 464.5 sq. m 18200 litre\nOver 464.5 sq. m but not exceeding 929 sq. m 27300 litre\nOver 929 sq. m 36400 litre\n2. MINIMUM QUANTITY OF WATER STORAGE REQUIRED FOR HOSE REEL SYSTEM\nONLY\nMinimum storage required for the first hose reel 2275 litre\nFor each additional hose reel 1137.5 litre up to a\nmaximum of 9100\nlitre\n3. MINIMUM QUANTITY OF WATER STORAGE REQUIRED FOR WET RISER AND\nHYDRANT INSTALLATIONS\n(a) Break tank capacity 11375 litre\n(b) Main tank capacity:\nFor 455 litre per min in-coming automatic supply 45500 litre\nFor 1 365 litre per min in-coming automatic supply 11375 litre\n[Amendment 2021]\nFORM A\nAPPLICATION AND CERTIFICATION FORM FOR AUTOMATIC SPRINKLER\nINSTALLATION\n[By-law 245(3)]\nDeleted.\n[Amendment 2012]\nFORM B\nAPPLICATION AND CERTIFICATION FORM FOR FIXED INSTALLATIONS AND FIRE\nALARM SYSTEMS\n[By-law 245(3), 246]\nDeleted.\n [Amendment 2012]\nDELETED"},{"id":"schedule-ELEVENTH","kind":"schedule","key":"ELEVENTH","ordinal":11,"ordinalWord":"Eleventh","title":"Staircase landing width or depth","amendments":["2021"],"content":"STAIRCASE LANDING WIDTH OR DEPTH\n [By-law 224A(8)(b)]\nB\nStaircases\nwidth\nA\nMinimum\nlanding width\nC\nMinimum landing depth\n(m) (m) (m)\n1.2 2.8 1.9 Allows bed evacuation or stretcher evacuation; and no\npedestrian passing\n1.2 2.8 1.9 Allows bed evacuation or stretcher evacuation; and\nrestricts ambulant passing 1.5 3.2 1.55\n1.75 3.6 1.35* Allows bed evacuation, stretcher evacuation or ambulant\npassing 2 4 1.25*\nNote:\n* Clear landing depth, instead of the clear stairs width, shall be taken for the purpose of calculating\nthe exit capacity of a staircase.\n[Amendment 2021]"}],"forms":[{"id":"form-G1","kind":"form","formNo":"G1","title":"Form G1","amendments":["2007","2021"],"content":"EARTHWORKS CERTIFICATION\n[By-law 25 or 27]\nProject Title: ……………………………………………………………………………………\n*1. We certify that we have supervised and/or carried out the construction and completion of the\nearthworks and that to the best of our knowledge and belief such works are in accordance with the\napproved earthwork plans ref. no.: …………………………………………………… and that we accept\nfull responsibility for the same.\nName (Individual) Registration No. Signature\n(a) Contractor ………………… …………………………… ……………………\n(Construction project (CIDB) (Date: )\nmanager)\n(b) ~Site supervisory ………… …………………………… ……………………\nstaff (BEM) (Date: )\n(c) Submitting ………………… …………………………… ……………………\nperson (BEM) (Date: )\n OR\n*2. I certify that this form is not nfrastructure and cabling works.\n~ When more than one site supervisory staff is involved, attach an annexure sheet.\nNOTE: BEM Board of Engineers Malaysia\n EC Energy Commission\n MCMC Malaysian Communications and Multimedia Commission\n CA Certifying Agency\n[Amendment 2007]\n [Amendment 2021]"},{"id":"form-G21","kind":"form","formNo":"G21","title":"Form G21","amendments":["2007","2021"],"content":"LANDSCAPE CERTIFICATION\n[By-law 25 or 27]\nProject Title: …………………………………………………………………………………………\n*1. We certify that we have supervised and/or carried out the construction and completion of the\nlandscape works and that to the best of our knowledge and belief such works are in accordance with\nthe approved plans ref. no.: …………………………………………………… and that we accept full\nresponsibility for the same.\nName (Individual) #Registration No. Signature\n(a) Trade ……………….............. ………………….............. …………………...\ncontractor + ( ) (Date: )\n(b) *Architect/………............... ………………….............. …………………...\nLandscape architect + ( ) (Date: )\n OR\n*2. I certify that this form is not applicable.\n……………………………………………………\n(Principal submitting person)\n*Delete whichever is not applicable.\n#Identification card no. if there is no relevant body in respect of registration.\n+Relevant regulatory body.\n[Amendment 2007]\n [Amendment 2021]"}]}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('ubbl-data').textContent);
  var bylaws = DATA.bylaws, parts = DATA.parts, schedules = DATA.schedules, forms = DATA.forms;

  var byId = {};
  bylaws.forEach(function(b){ byId[b.id] = b; });
  schedules.forEach(function(s){ byId[s.id] = s; });
  forms.forEach(function(f){ byId[f.id] = f; });

  var allEntries = bylaws.concat(schedules, forms);
  allEntries.forEach(function(e){
    e._searchTitle = (e.title||'').toLowerCase();
    e._searchBody = (e.content||'').toLowerCase();
  });

  // ---------------- Theme ----------------
  var themeKey = null;
  try{
    themeKey = localStorage.getItem('ubbl-theme');
    if(themeKey) document.documentElement.setAttribute('data-theme', themeKey);
  }catch(e){}
  function paintThemeIcon(){
    var dark = (document.documentElement.getAttribute('data-theme') === 'dark') ||
      (!document.documentElement.getAttribute('data-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('themeIcon').innerHTML = dark
      ? '<path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="10" r="3.6" fill="currentColor"/>'
      : '<path d="M10 2a8 8 0 100 16 6.5 6.5 0 010-16z" fill="currentColor"/>';
  }
  paintThemeIcon();
  document.getElementById('themeToggle').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next;
    if(!cur) next = sysDark ? 'light' : 'dark';
    else if(cur === 'dark') next = 'light';
    else next = 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('ubbl-theme', next); }catch(e){}
    paintThemeIcon();
  });

  // ---------------- Sidebar build ----------------
  var sidebar = document.getElementById('sidebar');
  var html = '';

  html += '<div class="sideSection"><div class="sideSectionTitle"><span>Parts I&ndash;IX</span></div></div>';
  parts.forEach(function(p, pi){
    html += '<div class="partGroup' + (pi===0?' open':'') + '" data-part="'+p.code+'">';
    html += '<button class="partHead" type="button"><span class="roman">'+p.code+'</span><span class="ptitle">'+escapeHtml(p.title||'')+'</span><span class="chev">&#9656;</span></button>';
    html += '<div class="partList">';
    p.bylawNums.forEach(function(num){
      var b = byId['bylaw-'+num];
      html += '<button class="clauseItem" type="button" data-id="'+b.id+'"><span class="n">'+num+'</span><span class="t">'+escapeHtml(b.title)+'</span></button>';
    });
    html += '</div></div>';
  });

  html += '<div class="sideSection"><div class="sideSectionTitle"><span>Schedules</span></div></div>';
  html += '<div class="partGroup" data-part="SCH"><button class="partHead" type="button"><span class="roman">&sect;</span><span class="ptitle">First&ndash;Eleventh</span><span class="chev">&#9656;</span></button><div class="partList">';
  schedules.forEach(function(s){
    html += '<button class="clauseItem" type="button" data-id="'+s.id+'"><span class="n">'+s.ordinalWord+'</span><span class="t">'+escapeHtml(s.title)+'</span></button>';
  });
  html += '</div></div>';

  html += '<div class="sideSection"><div class="sideSectionTitle"><span>Forms (2nd Schedule)</span></div></div>';
  html += '<div class="partGroup" data-part="FORM"><button class="partHead" type="button"><span class="roman">G</span><span class="ptitle">G1&ndash;G21</span><span class="chev">&#9656;</span></button><div class="partList">';
  forms.forEach(function(f){
    html += '<button class="clauseItem" type="button" data-id="'+f.id+'"><span class="n">'+f.formNo+'</span><span class="t">'+escapeHtml(f.title)+'</span></button>';
  });
  html += '</div></div>';

  sidebar.innerHTML = html;

  sidebar.addEventListener('click', function(ev){
    var head = ev.target.closest('.partHead');
    if(head){
      head.parentElement.classList.toggle('open');
      return;
    }
    var item = ev.target.closest('.clauseItem');
    if(item){
      openEntry(item.getAttribute('data-id'));
      closeMobileSidebar();
    }
  });

  // ---------------- Mobile sidebar ----------------
  var scrim = document.getElementById('scrim');
  function openMobileSidebar(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
  function closeMobileSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('menuBtn').addEventListener('click', openMobileSidebar);
  scrim.addEventListener('click', closeMobileSidebar);

  // ---------------- Helpers ----------------
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function contentToHtml(text, query){
    var paras = (text||'').split(/\n{1,}/).map(function(s){return s.trim();}).filter(Boolean);
    var re = query ? new RegExp('('+escapeRe(query)+')','ig') : null;
    return paras.map(function(p){
      var isAmend = /^\[Amendment\s+\d{4}\]$/.test(p);
      var esc = escapeHtml(p);
      if(re) esc = esc.replace(re, '<mark>$1</mark>');
      if(isAmend) return '<span class="amendTag">'+esc.replace(/[\[\]]/g,'')+'</span>';
      return '<p>'+esc+'</p>';
    }).join('');
  }

  function snippet(entry, query){
    var body = entry.content || '';
    var lower = entry._searchBody;
    var idx = query ? lower.indexOf(query.toLowerCase()) : -1;
    var start, raw;
    if(idx === -1){
      raw = body.slice(0, 170);
    } else {
      start = Math.max(0, idx - 60);
      raw = (start>0?'…':'') + body.slice(start, start+190);
    }
    raw = raw.replace(/\s+/g,' ').trim();
    var esc = escapeHtml(raw);
    if(query){
      var re = new RegExp('('+escapeRe(query)+')','ig');
      esc = esc.replace(re, '<mark>$1</mark>');
    }
    return esc + '…';
  }

  function partLabel(entry){
    if(entry.kind === 'bylaw') return 'Part ' + entry.part + ' — ' + entry.partTitle;
    if(entry.kind === 'schedule') return entry.ordinalWord + ' Schedule';
    if(entry.kind === 'form') return 'Second Schedule — Forms';
    return '';
  }
  function crumbLabel(entry){
    if(entry.kind === 'bylaw') return 'By-law ' + entry.num;
    if(entry.kind === 'schedule') return entry.ordinalWord + ' Schedule';
    if(entry.kind === 'form') return 'Form ' + entry.formNo;
    return '';
  }
  function badgeLabel(entry){
    if(entry.kind === 'bylaw') return 'By-law ' + entry.num;
    if(entry.kind === 'schedule') return entry.ordinalWord.slice(0,3).toUpperCase() + ' SCH.';
    if(entry.kind === 'form') return entry.formNo;
    return '';
  }

  // ---------------- Rendering ----------------
  var mainInner = document.getElementById('mainInner');
  var currentId = null;

  function markActiveSidebar(id){
    var prev = sidebar.querySelector('.clauseItem.active');
    if(prev) prev.classList.remove('active');
    var next = sidebar.querySelector('.clauseItem[data-id="'+id+'"]');
    if(next){
      next.classList.add('active');
      var group = next.closest('.partGroup');
      if(group) group.classList.add('open');
      next.scrollIntoView({block:'nearest'});
    }
  }

  function siblingNav(entry){
    if(entry.kind !== 'bylaw') return {prev:null, next:null};
    var part = parts.filter(function(p){return p.code === entry.part;})[0];
    if(!part) return {prev:null, next:null};
    var i = part.bylawNums.indexOf(entry.num);
    var prevNum = i>0 ? part.bylawNums[i-1] : null;
    var nextNum = i<part.bylawNums.length-1 ? part.bylawNums[i+1] : null;
    return {
      prev: prevNum ? byId['bylaw-'+prevNum] : null,
      next: nextNum ? byId['bylaw-'+nextNum] : null
    };
  }

  function openEntry(id, opts){
    opts = opts || {};
    var entry = byId[id];
    if(!entry) return;
    currentId = id;
    location.hash = id;
    markActiveSidebar(id);

    var crumb = '<a href="#" data-home>UBBL Navigator</a><span>/</span>';
    if(entry.kind === 'bylaw') crumb += '<span>Part '+entry.part+' &middot; '+escapeHtml(entry.partTitle)+'</span>';
    else if(entry.kind === 'form') crumb += '<a href="#" data-id="schedule-SECOND">Second Schedule</a>';
    else crumb += '<span>Schedules</span>';

    var badges = '<span class="pill">'+escapeHtml(partLabel(entry))+'</span>';
    (entry.amendments||[]).forEach(function(y){
      badges += '<span class="pill amend">Amendment '+y+'</span>';
    });

    var nav = siblingNav(entry);
    var navHtml = '<div class="navFoot">';
    navHtml += nav.prev
      ? '<button type="button" class="prevBtn" data-id="'+nav.prev.id+'"><span class="lbl">&larr; Previous</span><span class="val">'+nav.prev.num+'. '+escapeHtml(nav.prev.title)+'</span></button>'
      : '<span></span>';
    navHtml += nav.next
      ? '<button type="button" class="nextBtn next" data-id="'+nav.next.id+'"><span class="lbl">Next &rarr;</span><span class="val">'+nav.next.num+'. '+escapeHtml(nav.next.title)+'</span></button>'
      : '<span></span>';
    navHtml += '</div>';

    mainInner.innerHTML =
      '<div class="crumb">'+crumb+'</div>'+
      '<article>'+
        '<div class="clauseHead">'+
          '<span class="badge num">'+escapeHtml(badgeLabel(entry))+'</span>'+
          '<div style="flex:1;min-width:0;">'+
            '<h2>'+escapeHtml(entry.title)+'</h2>'+
            '<div class="clauseMeta">'+badges+
              '<button class="copyBtn" type="button" id="copyLinkBtn"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5a2.5 2.5 0 010-3.54l2-2a2.5 2.5 0 013.54 3.54l-1 1M9.5 6.5a2.5 2.5 0 010 3.54l-2 2a2.5 2.5 0 01-3.54-3.54l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Copy link</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="clauseBody">'+ contentToHtml(entry.content, opts.highlight) +'</div>'+
        navHtml+
      '</article>';

    document.getElementById('copyLinkBtn').addEventListener('click', function(){
      var url = location.href.split('#')[0] + '#' + id;
      try{
        navigator.clipboard.writeText(url);
        this.textContent = 'Copied';
        var self = this;
        setTimeout(function(){ self.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6.5 9.5a2.5 2.5 0 010-3.54l2-2a2.5 2.5 0 013.54 3.54l-1 1M9.5 6.5a2.5 2.5 0 010 3.54l-2 2a2.5 2.5 0 01-3.54-3.54l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Copy link'; }, 1400);
      }catch(e){}
    });
    mainInner.querySelectorAll('.prevBtn,.nextBtn').forEach(function(btn){
      btn.addEventListener('click', function(){ openEntry(btn.getAttribute('data-id')); mainInner.scrollTop = 0; });
    });
    mainInner.querySelectorAll('.crumb a[data-id]').forEach(function(a){
      a.addEventListener('click', function(ev){ ev.preventDefault(); openEntry(a.getAttribute('data-id')); });
    });
    var homeLink = mainInner.querySelector('.crumb a[data-home]');
    if(homeLink) homeLink.addEventListener('click', function(ev){ ev.preventDefault(); showWelcome(); });

    document.getElementById('main').scrollTop = 0;
  }

  // ---------------- Welcome screen ----------------
  var EXAMPLES = ['30', '34A', '86', '133', '243', 'First Schedule', 'Form G7'];

  function showWelcome(){
    currentId = null;
    if(history.replaceState) history.replaceState(null, '', location.pathname + location.search);
    var prevActive = sidebar.querySelector('.clauseItem.active');
    if(prevActive) prevActive.classList.remove('active');

    var chips = EXAMPLES.map(function(ex){ return '<button type="button" class="exampleChip" data-jump="'+escapeHtml(ex)+'">'+escapeHtml(ex)+'</button>'; }).join('');

    mainInner.innerHTML =
      '<div class="welcome">'+
        '<h2>Look up any by-law, schedule or form.</h2>'+
        '<p>Search the consolidated text by keyword, or type a by-law number, schedule name or form number into &ldquo;Go to clause&rdquo; above to open it directly &mdash; the way you&rsquo;d flip to a section in the printed gazette.</p>'+
        '<div class="statRow">'+
          '<div class="statCard"><div class="figure">'+bylaws.length+'</div><div class="cap">BY-LAWS, PARTS I&ndash;IX</div></div>'+
          '<div class="statCard"><div class="figure">'+schedules.length+'</div><div class="cap">SCHEDULES</div></div>'+
          '<div class="statCard"><div class="figure">'+forms.length+'</div><div class="cap">PRESCRIBED FORMS</div></div>'+
        '</div>'+
        '<p style="margin-bottom:8px;"><strong>Try a clause number:</strong></p>'+
        '<div class="exampleRow">'+chips+'</div>'+
      '</div>';

    mainInner.querySelectorAll('[data-jump]').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.getElementById('jumpInput').value = chip.getAttribute('data-jump');
        doJump();
      });
    });
  }

  // ---------------- Search ----------------
  var searchInput = document.getElementById('searchInput');
  var searchClear = document.getElementById('searchClear');
  var searchTimer = null;

  searchInput.addEventListener('input', function(){
    searchClear.style.display = searchInput.value ? 'flex' : 'none';
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
  });
  searchClear.addEventListener('click', function(){
    searchInput.value = '';
    searchClear.style.display = 'none';
    if(currentId) openEntry(currentId); else showWelcome();
    searchInput.focus();
  });

  function runSearch(){
    var q = searchInput.value.trim();
    if(!q){ if(currentId) openEntry(currentId); else showWelcome(); return; }
    var ql = q.toLowerCase();
    currentId = null;
    var prevActive = sidebar.querySelector('.clauseItem.active');
    if(prevActive) prevActive.classList.remove('active');

    var titleHits = [], bodyHits = [];
    allEntries.forEach(function(e){
      if(e._searchTitle.indexOf(ql) !== -1) titleHits.push(e);
      else if(e._searchBody.indexOf(ql) !== -1) bodyHits.push(e);
    });
    var results = titleHits.concat(bodyHits).slice(0, 60);

    var head = '<div class="resultsHead"><h2>Results for &ldquo;'+escapeHtml(q)+'&rdquo;</h2><span class="count">'+(titleHits.length+bodyHits.length)+' match'+((titleHits.length+bodyHits.length)===1?'':'es')+'</span></div>';
    var body;
    if(results.length === 0){
      body = '<div class="noResults">No by-law, schedule or form mentions &ldquo;'+escapeHtml(q)+'&rdquo;. Try a different term, or use &ldquo;Go to clause&rdquo; if you know the number.</div>';
    } else {
      body = results.map(function(e){
        return '<a class="resultCard" href="#" data-id="'+e.id+'">'+
          '<div class="rhead"><span class="rnum">'+escapeHtml(badgeLabel(e))+'</span><span class="rtitle">'+escapeHtml(e.title)+'</span><span class="rpart">'+escapeHtml(partLabel(e))+'</span></div>'+
          '<div class="rsnippet">'+snippet(e, q)+'</div>'+
        '</a>';
      }).join('');
    }
    mainInner.innerHTML = head + body;
    mainInner.querySelectorAll('.resultCard').forEach(function(card){
      card.addEventListener('click', function(ev){
        ev.preventDefault();
        openEntry(card.getAttribute('data-id'), {highlight:q});
      });
    });
    document.getElementById('main').scrollTop = 0;
  }

  // ---------------- Jump to clause ----------------
  var jumpForm = document.getElementById('jumpForm');
  var jumpInput = document.getElementById('jumpInput');

  var scheduleWordMap = {};
  schedules.forEach(function(s){
    scheduleWordMap[s.ordinalWord.toLowerCase()] = s.id;
    scheduleWordMap[s.key.toLowerCase()] = s.id;
    scheduleWordMap[String(s.ordinal)] = s.id;
  });

  function normalizeJump(raw){
    return raw.trim().toLowerCase()
      .replace(/^by[\s-]?law\s*/,'')
      .replace(/^(no\.?|clause|section|by-law|bylaw)\s*/,'')
      .replace(/\.$/,'')
      .replace(/\s+/g,' ')
      .trim();
  }

  function doJump(){
    var raw = jumpInput.value;
    if(!raw.trim()) return;
    var norm = normalizeJump(raw);

    // Form, e.g. "g7" / "form g7"
    var formMatch = norm.replace(/^form\s*/,'').match(/^g\s*-?\s*(\d+[a-z]?)$/i);
    if(formMatch){
      var fid = 'form-G'+formMatch[1].toUpperCase();
      if(byId[fid]){ searchInput.value=''; searchClear.style.display='none'; openEntry(fid); flashJump(true); return; }
    }

    // Schedule, e.g. "first schedule" / "first" / "schedule 1"
    var schedMatch = norm.match(/^(?:schedule\s*)?([a-z]+|\d+)(?:\s*schedule)?$/);
    if(schedMatch && scheduleWordMap[schedMatch[1]]){
      searchInput.value=''; searchClear.style.display='none';
      openEntry(scheduleWordMap[schedMatch[1]]); flashJump(true); return;
    }

    // By-law number, e.g. "30", "34a", "34-a"
    var byMatch = norm.replace(/\s+/g,'').match(/^(\d+)([a-z]?)$/i);
    if(byMatch){
      var num = byMatch[1] + byMatch[2].toUpperCase();
      var bid = 'bylaw-'+num;
      if(byId[bid]){ searchInput.value=''; searchClear.style.display='none'; openEntry(bid); flashJump(true); return; }
    }

    flashJump(false);
  }

  function flashJump(ok){
    jumpInput.style.borderColor = ok ? 'var(--line-strong)' : 'var(--danger)';
    jumpInput.style.color = ok ? '' : 'var(--danger)';
    if(!ok){
      jumpInput.setAttribute('title', 'No clause found for "'+jumpInput.value+'". Try a by-law number (34A), a schedule (First Schedule) or a form (G7).');
      jumpInput.placeholder = 'not found — try 34A, First Schedule, G7';
      var old = jumpInput.value;
      jumpInput.value='';
      setTimeout(function(){ jumpInput.placeholder='e.g. 34A'; jumpInput.style.borderColor=''; jumpInput.style.color=''; }, 2200);
    }
  }

  jumpForm.addEventListener('submit', function(ev){ ev.preventDefault(); doJump(); });

  // ---------------- Deep link / boot ----------------
  function boot(){
    var hash = location.hash.replace('#','');
    if(hash && byId[hash]){ openEntry(hash); }
    else { showWelcome(); }
  }
  window.addEventListener('hashchange', function(){
    var hash = location.hash.replace('#','');
    if(hash && byId[hash] && hash !== currentId) openEntry(hash);
  });
  boot();
})();
</script>
</body>
</html>
