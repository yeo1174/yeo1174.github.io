2021]\n(2) An access opening shall also be provided along the external wall of the building fronting the fire\nappliance access to provide access into the building for fire fighting and rescue operation.\n[Amendment 2021]\n(3) The requirements of the fire appliance access shall be as follows:\n(a) the fire appliance access shall have the minimum width of 6 metres throughout its entire\nlength and shall be able to accommodate the entry and manoeuvring of a fire appliance,\nextended ladder appliances, turntable and hydraulic platform;\n(b) the fire appliance access shall be metalled or paved or laid with strengthened perforated\nslabs to withstand the loading capacity of a stationary 30 tonnes fire appliance;\n(c) the fire appliance access shall be positioned so that the nearer edge shall not be less than\n2 metres or more than 10 metres from the centre position of the access opening, measured\nhorizontally;\n(d) the fire appliance access shall be laid on a level platform or if on an incline, the gradient\nshall not exceed 1:15, and an access road shall be laid on an incline of not exceeding a\ngradient of 1:9 ;\n(e) the dead-end of a fire appliance access road shall not exceed 46 metres in length or if it\nexceeds 46 metres, be provided with turning facilities;\n(f) the outer radius for a turning of the fire appliance access road shall comply with the\nrequirements of the Fire and Rescue Department;\n(g) the overhead clearance of the fire appliance access road shall be at least 4.5 metres for\npassage of a fire appliance;\n(h) a public road may serve as fire appliance access if the location of such a public road\ncomplies with the requirements of distance from the access opening as the Fire and Rescue\nDepartment may specify; and\n(i) the fire appliance access road shall be kept clear of obstruction, and any other part of\nthe building, plant, tree or any other fixture which obstructs the path between the fire\nappliance access and the access opening.\n[Amendment 2012]\n[Amendment 2021]\n(4) All corners of the fire appliance access shall be marked as follows:\n(a) the marking of a corner shall be in contrasting colour to the ground surface and finish;\n(b) the fire appliance access provided on a turfed area shall be marked with a contrasting\nobject (preferably reflective) that shall be visible at night and the markings shall be at\nan interval of not more than 3 metres apart and be provided on both sides of the fire\nappliance access; and\n(c) a signpost displaying the wordings “Akses Perkakas Bomba – Kosongkan” shall be\nprovided at the entrance of the fire appliance access and the size of wordings shall not\nbe less than 50 millimetres.\n[Amendment 2012]\n[Amendment 2021]\n(5) For the proportion of the building in excess of 7000 cubic metres, the fire appliance access fronting\nthe building shall be provided in accordance with the following scales:\nVolume of the building\nin cubic metre (m3)\nMinimum proportion of\na perimeter of the building\n7,001 to 28,000\n28,001 to 56,000\n56,001 to 84,000\n84,001 to 112,000\n112,001 and above\none-sixth\none-fourth\none-half\nthree-fourths\nisland site\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-141","kind":"bylaw","num":"141","title":"Separating walls.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Subject to the exceptions specified in paragraph (2) no openings shall be made in any separating\nwall which forms a complete vertical wall separating any buildings.\n(2) Nothing in this by-law shall prohibit-\n(a) the passage through a separating wall of a pipe, if the pipe --\n(i) is not a flue pipe;\n(ii) has a diameter not exceeding 25 millimetres if it is made of combustible material or\n150 millimetres, if it is made of non-combustible material; and\n(iii) is fire stopped where it passes through the wall; or\n(b) an opening in a separating wall which is necessary as a means of escape from fire, if the\nopening is fitted with a door which has in respect of separating walls FRP of not less than\nthat required in this Part.\n(3) Any separating wall which forms, a junction with a roof shall be carried above the upper surface\nof the roof to a distance of not less than 225 millimetres measured at right angles to such upper\nsurface.\n(4) Deleted.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-142","kind":"bylaw","num":"142","title":"External walls.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) If any external wall is carried across the end of a separating wall, such external wall and separating\nwall shall be bonded together or the junction of such walls shall be fire-stopped.\n(2) Subject to the provisions relating to small garages and open car parks, any side of a building\nshall comply with any relevant requirements relating to the permitted limits of unprotected areas\nspecified in the Sixth Schedule to these By-laws unless the building is so situated that such side\nmight consist entirely of any unprotected area.\n(3) Any external wall which constitutes, or is situated within a distance of 2 metres from any point\non the relevant boundary or is a wall of a building which exceeds 18 metres in height shall --\n[Amendment 2021]\n(a) be constructed wholly of non-combustible materials apart from any external cladding which\ncomplies with by-law 144; and\n[Amendment 2021]\n(b) be so constructed as to attain any FRP required by this Part without assistance from any\ncombustible material permitted by this Part:\nProvided that the requirements of this Part shall not apply to --\n(i) an external wall of a building which is within the limits of size indicated by the letter\n“x” in Part 1 of the Ninth Schedule to these By-laws or an external wall of a building\nwhich is not divided into compartments and is within the limits of size indicated by the\nletter “z” in Part 2 of the Ninth Schedule if, in either case, that building does not exceed\n18 metres in height; and\n(ii) an external wall of a building or part of Purpose Group III which consists of flats or\nmaisonettes if that building has not more than three storeys or that part is separated as\ndescribed in by-law 135 and does not exceed 18 metres in height."},{"id":"bylaw-143","kind":"bylaw","num":"143","title":"Beam or column.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"Any beam or column forming part of, and any structure carrying an external wall which is required\nto be constructed of non-combustible materials shall comply with the provisions of paragraph (3) of\nby-law 142 as to non-combustibility.\n[Amendment 2021]"},{"id":"bylaw-144","kind":"bylaw","num":"144","title":"Cladding on external wall.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Any cladding on any external wall situated less than 2 metres from any point on the relevant\nboundary or if the building is more than 18 metres in height, the cladding shall be constructed\nentirely of non-combustible materials and when tested, shall demonstrate the compliance in\naccordance with BS 8414.\n[Amendment 2021]\n(2) Any cladding on any external wall, if such a cladding is situated more than 2 metres from any\npoint on the relevant boundary and the building is less than 18 metres in height, the cladding\nshall have a surface complying with the requirements for Class O when tested and in accordance\nwith by-law 204.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-145","kind":"bylaw","num":"145","title":"Reference to Sixth Schedule.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"For the purpose of by-law 142 to 146 --\n(a) any part of a roof shall be deemed to be part of an external wall or side of a building if\nit is pitched to an angle of 70º or more to the horizontal and adjoins a space within the\nbuilding to which persons have access not limited to the purposes of maintenance or repair;\nand\n(b) any reference to the Sixth Schedule to these By-laws shall be construed as referring to the\nprovisions of Part I of the Schedule together with, at the option of the persons intending to\nerect the building, either the provisions of Part II, Part III or Part IV of the Schedule."},{"id":"bylaw-146","kind":"bylaw","num":"146","title":"Relevant boundary.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"If any building is to be erected on land occupied with any other building, or two or more detached\nbuildings are to be erected on land in common occupation and either of those buildings is within\nPurpose Group I or III, other than a detached building which consists only of a garage or of an open\ncar park, in the application of the provisions of this Part to any external wall of any building to be\nerected which faces an external wall of such other building--\n(a) the relevant boundary shall be a notional boundary passing between those buildings and\nsuch boundary must be capable of being situated in such a position as to enable the external\nwalls of those buildings to comply with the requirements of this Part; and\n(b) if such other building is an existing building it shall be deemed to be (a building to be)\nerected on the site which it occupies, being of the same purpose and having the same\nunprotected areas and fire resistance as the existing building."},{"id":"bylaw-147","kind":"bylaw","num":"147","title":"Construction of separating wall.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) Any separating wall, other than a wall separating buildings not divided into compartments within\nthe limits of size indicated by the letter “x” in Part I of the Ninth Schedule to these By-laws,\nshall be constructed wholly of non-combustible materials, excluding any surface finish to a wall\nwhich complies with the requirements of these By-laws and the required FRP for the wall shall\nbe obtained without assistance from such non-combustible material.\n(2) Any beam or column forming part of, and any structure carrying, a separating wall which is\nrequired to be constructed of non-combustible materials shall itself comply with the requirements\nof paragraph (1) as to non-combustibility."},{"id":"bylaw-148","kind":"bylaw","num":"148","title":"Special requirements as to compartment walls and compartment floors.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) No opening shall be made in any compartment wall or compartment floor with the exception of\nany one or more of the following:\n(a) an opening fitted with a door which complies with the requirements of by-law 162 and has\nFRP which is not less than --\n(i) in the case of a wall separating a flat or maisonette from any space in common use\ngiving access to that flat or maisonette, half hour; or\n(ii) in any other case, the FRP required by the provisions of these By-laws in respect of\nthe wall or floor;\n(b) an opening for a protected shaft;\n(c) an opening for a ventilation duct, other than a duct in, or consisting of, a protected shaft, if\nany space surrounding the duct is fire-stopped and the duct is fitted with an automatic fire\ndamper in accordance with Australian Standard 1682 and 1668 Part I-1974 or its equivalent\nwhere it passes through the wall or floor which fire damper shall have not less than the\nrequired FRP of the material of the compartment wall or floor through which it passes;\n(d) an opening for a pipe which complies with the requirements of paragraph (2) of by-law\n141;\n(e) an opening for a refuse chute having a FRP of at least one hour and having a close-fitting\ndoor situated in an external wall of the chamber having a FRP of half-hour.\n(2) Where a compartment wall or compartment floor forms a junction with any structure comprising any\nother compartment walls, or any external wall, separating wall or structure enclosing a protected\nshaft, such structures shall be bonded together at the junction or the junction shall be fire-stopped.\n(3) Where any compartment wall forms a junction with a roof, such wall shall be carried to the under\nsurface of the roof covering.\n(4) Where any chimney, appliance ventilation duct or duct encasing one or more flue pipes passes\nthrough a compartment floor or compartment wall --\n(a) any flue in the chimney; or\n(b) the passage in the appliance ventilation duct; or\n(c) the space within the duct encasing the flue pipe or pipe,\nshall be separated from that compartment floor or that compartment wall and from each compartment\nadjoining that wall or floor by non-combustible construction having FRP of not less than half the\nminimum FRP required by these By-laws in respect of that compartment wall or compartment floor\nthrough which such chimney, duct or pipe passes.\n(5) If any chimney, appliance ventilation duct or duct encasing one or more flue pipes forms part of\na compartment wall --\n(a) any flue in the chimney; or\n(b) the passage in the appliance ventilation duct; or\n(c) the space within the duct encasing the flue pipe or pipes,\nshall be separated from any compartment adjoining that wall by non-combustible construction which\nwill, at any level, have FRP of not less than half the minimum FRP required by these By-laws in\nrespect of the compartment wall at that level.\n(6) Any compartment wall or compartment floor which is required by these By-laws to have FRP of\none hour or more shall, excluding --\n(a) any floor finish;\n(b) any surface finish to a wall or ceiling which complies with the requirements of by-law 204;\nor\n(c) any ceiling which complies with the descriptions specified in the Ninth Schedule to these\nBy-laws,\nbe constructed wholly of non-combustible materials and, apart from any ceiling, the required FRP of\nthe wall or floor shall be obtained without assistance from any non-combustible material.\n(7) Any beam or column forming part of, and structure carrying, any compartment wall or compartment\nfloor which is required to be constructed of non-combustible materials, shall itself comply with\nthe provisions of paragraph (6) as to non-combustibility."},{"id":"bylaw-149","kind":"bylaw","num":"149","title":"Horizontal and vertical barriers of the external walls.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"Openings in external walls located vertically above one another shall be protected by approved flame\nbarriers either extending 750 millimetres beyond the exterior wall in the plane of the floor or by vertical\npanels not less than 900 millimetres in height.\n[Amendment 2021]"},{"id":"bylaw-150","kind":"bylaw","num":"150","title":"Protected shafts.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) No protected shaft shall be constructed for use for any purposes additional to those specified in\nthis Part other than for the accommodation of any pipe or duct, or as sanitary accommodation or\nwashrooms, or both.\n(2) Subject to the provisions of this Part, any protected shaft shall be completed enclosed.\n(3) Any protecting structure which is required to have a FRP of one hour or more, and any beam or\ncolumn forming part of that structure and any structure carrying such protecting structure shall be\nconstructed of non-combustible materials throughout, with the exception of any external surface\nfinish which complies with the requirements of by-law 204 relating to wall surfaces.\n(4) Any wall, floor or other structure enclosing a protected shaft but not being a protecting structure\nmay contain such openings as shall be in accordance with other provisions of these By-laws.\n(5) There shall be no opening in any protecting structure other than any one or more of the following:\n(a) an opening for a pipe;\n(b) an opening fitted with a fire-resisting door which complies with the provisions of by-law\n163;\n[Amendment 2021]\n(c) if the protected shaft contains a lift, an opening which complies with the provisions of\nby-law 152; and\n[Amendment 2021]\n(d) if the protected shaft serves as, or contains a ventilating duct, an inlet to or outlet from\nthe duct or an opening for the duct.\n(6) Any opening for pipe shall be effectively fire-stopped."},{"id":"bylaw-151","kind":"bylaw","num":"151","title":"Ventilation to lift shafts.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Where openings to lift shafts are not connected to protected lobbies, such lift shafts shall be provided\nwith vents of not less than 0.09 square metre per lift located at the top of the shafts. Where the vent\ndoes not discharge directly to the open air the lift shafts shall be vented to the exterior through a duct\nof the required FRP as for the lift shafts."},{"id":"bylaw-152","kind":"bylaw","num":"152","title":"Openings in lift shafts.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) Every opening in a lift shaft or lift entrance shall open into a protected lobby unless other suitable\nmeans of protection to the opening to the satisfaction of the Fire and Rescue Department is\nprovided. These requirements shall not apply to open type industrial and other special buildings\nas may be approved by the Director General.\n[Amendment 2021]\n(2) Landing doors shall have a FRP of not less than half the FRP of the hoistway structure with a\nminimum FRP of half hour.\n(3) No glass shall be used for or in landing doors except for vision in which case any vision panel\nshall be glazed with wired safety glass, and shall not be more than 0.0161 square metre and the\ntotal area of one or more vision panels in any landing door shall be not more than 0.0156 square\nmetre.\n(4) Each clear panel opening shall reject a sphere 150 millimetres in diameter.\n(5) Provision shall be made for the opening of all landing doors by means of an emergency key\nirrespective of the position of the lift car."},{"id":"bylaw-153","kind":"bylaw","num":"153","title":"Smoke detectors for lift lobbies.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) All lift lobbies shall be provided with smoke detectors except lift lobbies in an open structures.\n[Amendment 2021]\n(2) Lift not opening into a smoke lobby shall not use door reopening devices controlled by light beam\nor photo-detectors unless incorporated with a force close feature which after thirty seconds of any\ninterruption of the beam causes the door to close within a preset time."},{"id":"bylaw-154","kind":"bylaw","num":"154","title":"Emergency mode of operation in the event of mains power failure.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012"],"content":"Deleted.\n[Amendment 2012]"},{"id":"bylaw-155","kind":"bylaw","num":"155","title":"Fire mode of operation. Deleted.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"[Amendment 2021]"},{"id":"bylaw-156","kind":"bylaw","num":"156","title":"Protected shafts as ventilating duct.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) If a protected shaft serves as, or contains, a ventilating duct --\n(a) the duct shall be fitted with automatic fire dampers together with or without subducts\nas Australian Standard 1668: Part 1: 1974, so constructed at such intervals and in such\npositions as may be necessary to reduce, so far as a practical, the risk of fire spreading\nfrom a compartment to any other compartment, or such other provision shall be made as\nwill reduce such risk so far as practicable; and\n(b) the duct shall not be constructed of, or lined with, any material which substantially increase\nsuch risk.\n(2) In addition, in the case of a protected shaft containing a ventilating duct, the shaft be so constructed\nwith additional barriers to fire between the duct and the shaft as may be necessary to reduce so\nfar as practicable the risk of fire spreading from a compartment to any other compartment."},{"id":"bylaw-157","kind":"bylaw","num":"157","title":"Protected shafts consisting of staircase.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"An exit staircase or a protected shaft containing a staircase shall not contain any pipe conveying gas\nor oil or any ventilating duct other than a duct serving only that staircase or shaft.\n[Amendment 2021]"},{"id":"bylaw-158","kind":"bylaw","num":"158","title":"Stages in places of assembly.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) In places of assembly, other than school halls or other similar halls where stage scenery is\ninfrequently used, capable of seating more than 400 persons and in which stage scenery may be\nused, the stage shall be separated from the auditorium by a proscenium wall of not less than 220\nmillimetres brickwork or other material of equivalent FRP, carried down to a solid foundation and\nup to at least 0.90 metres above the roof level unless the roof is constructed of materials having\nthe FRP as specified in the Ninth Schedule to these By-laws.\n[Amendment 2021]\n(2) No more than three openings inclusive of the proscenium opening shall be provided in the\nproscenium wall.\n(3) No opening additional to the proscenium opening shall be more than 0.60 metres above the level\nof the stage nor shall such additional opening have an area exceeding 2.0 square metres and each\nsuch additional opening shall be fitted with a door constructed of materials having the FRP as\nspecified in the Ninth Schedule to these By-laws.\n[Amendment 2021]"},{"id":"bylaw-159","kind":"bylaw","num":"159","title":"Open stages.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"Open stages without proscenium walls may be permitted provided suitable protection devices to the\nsatisfaction of the Director General are installed.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-160","kind":"bylaw","num":"160","title":"Fire precautions in air conditioning systems.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) All air conditioning ducts, including framing therefor, except ducts in detached and semi-detached\nresidential buildings shall be constructed entirely of non-combustible materials and shall be\nadequately supported throughout their lengths.\n(2) No air conditioning ducts shall pass through fire walls unless as provided for in by-laws 148 and\n156.\n(3) The air intake of any air conditioning apparatus shall be situated such that air shall not be\nrecirculated from any space in which objectionable quantities of inflammable vapours or dust are\ngiven off and shall be so situated as to minimise the drawing in of any combustible material."},{"id":"bylaw-161","kind":"bylaw","num":"161","title":"Fire-stopping.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) Any fire stop required by the provisions of this Part shall be so formed and positioned as to\nprevent or retard the passage of flame.\n(2) Any fire stop shall --\n(a) if provided around a pipe or duct or in a cavity, be made of non-combustible material or,\nif it is in a floor or wall constructed of combustible material, of timber not less than 37\nmillimetres thick; and\n(b) if provided around a pipe or duct, be so constructed as not to restrict essential thermal\nmovement.\n(3) Any fire stop formed as a seal at the junction of two or more elements of structure shall be made\nof non-combustible material.\n(4) Any cavity in an element of structure which --\n(a) is continuous through the whole or part of such element; and\n(b) has a surface of combustible material exposed within the cavity which is of a class lower\nthan Class O in by-law 204 shall be fire stopped --\n(i) at any junction with another element of structure or with a ceiling under a roof; and\n(ii) in such a position that there is no continuous cavity without a fire stop which in one\nplane exceeds either 7.625 metres in a single dimension or 23.225 square metres in\narea:\nbut nothing in this by-law shall prohibit the insertion of combustible filling in a cavity."},{"id":"bylaw-162","kind":"bylaw","num":"162","title":"Fire doors in compartment walls and separating walls.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012"],"content":"(1) Fire doors of the appropriate FRP shall be provided.\n(2) Openings in compartment walls and separating walls shall be protected by a fire door having a\nFRP in accordance with the requirements for that wall specified in the Ninth Schedule to these\nBy-laws.\n(3) Openings in protecting structures shall be protected by fire doors having FRP of not less than half\nthe requirement for the surrounding wall specified in the Ninth Schedule to these by-laws but in\nno case less than half hour.\n(4) Openings in partitions enclosing a protected corridor or lobby shall be protected by fire doors\nhaving FRP of half hour.\n(5) Deleted.\n[Amendment 2012]"},{"id":"bylaw-163","kind":"bylaw","num":"163","title":"Half hour and one hour doors.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\n[Amendment 2021]\nFire doors conforming to the method of construction as stipulated below shall be deemed to meet the\nrequirements of the specified FRP:\n(a) doors and frames constructed in accordance with one of the following specifications shall be\ndeemed to satisfy the requirements for doors having FRP of half-hour:\n(i) a single door 900 millimetres wide X 2,100 millimetres high maximum or double doors 1\n800 millimetres X 2,100 millimetres high maximum constructed of solid hardwood core of\nnot less than 37 millimetres laminated with adhesives conforming to either BS 745 “Animal\nGlues”, or BS 1204, “Synthetic resin adhesives (phenolic and aminoplastic) for wood” Part 1,\n“Gap-filling adhesives”, or BS 1444, “Cold-setting casein glue for wood”, faced both sides\nwith plywood to a total thickness of not less than 43 millimetres with all edges finished\nwith a solid edge strip full width of the door. The meeting stiles of double doors shall be\nrabbeted 12 millimetres deep or may be butted provided the clearance is kept to a minimum;\n(ii) doors may be double swing provided they are mounted on hydraulic floor springs and\nclearances at floor not exceeding 4.77 millimetres and frame and meeting stiles not exceeding\n3 millimetres;\n(iii) a vision panel may be incorporated provided it does not exceed 0.065 square metre per leaf\nwith no dimension more than 1,370 millimetres and it is glazed with 6 millimetres Georgian\nWired Glass in hardwood stops;\n(iv) doors constructed in accordance with BS No. 459; Part 3: 1951 Fire Check Flush Doors and\nWood and Metal Frames (Half-Hour Type);\n(v) timber frames for single swing half-hour fire doors of overall width of 60 millimetres\nincluding 25 millimetres rabbet and depth to suit door thickness plus 34 millimetres stop;\n(vi) metal frames for half-hour fire doors shall be of sheet steel not lighter than 18 gauge of\noverall width 50 millimetres including 18 millimetres rabbet and depth to suit the door\nthickness plus 53 millimetres stop;\n(vii) timber or metal frames for double swing doors shall be as specified above with minimum\nclearances between frame and door;\n(b) doors and frames constructed in accordance with one of the following specifications shall be\ndeemed to satisfy the requirements for doors having FRP of one hour:\n(i) a single door not exceeding 900 millimetres wide X 2,100 millimetres high or double doors\nnot exceeding 1,800 millimetres X 2,100 millimetres high constructed as for specification (a)\nfor half-hour door but incorporating on both faces either externally or beneath the plywood\nfaces a layer of insulating board not less than 3 millimetres thick;\n(ii) doors may swing one way only and double doors shall have 12 millimetres wide rabbet at\nthe meeting stiles;\n(iii) a vision panel may be incorporated provided it does not exceed 10 square metres per leaf\nwith no dimension more than 300 millimetres and it is glazed with 6 millimetres Georgian\nWire Glass in hardwood stop;\n(iv) doors constructed in accordance with BS 459: Part 3: 1951: Fire Check Flush Doors and\nWood and Metal Frames (One Hour Type):\n(v) frames for one hour doors shall be as for half-hour doors except that timber frames shall be\npressure impregnated with 15% to 18% solution of monoammonium phosphate in water.\n[Amendment 2012]\n [Amendment 2021]"},{"id":"bylaw-164","kind":"bylaw","num":"164","title":"Door closers for fire doors.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) All fire doors shall be fitted with automatic door closers of the hydraulically spring operated type\nin the case of swing doors and of wire rope and weight type in the case of sliding doors.\n(2) Double doors with rabbeted meeting stiles shall be provided with coordinating device to ensure\nthat leafs close in the proper sequence.\n(3) Fire doors may be held open provided the hold open device incorporates a heat actuated device\nto release the door. Heat actuated devices shall not be permitted on fire doors protecting openings\nto protected corridors or exit staircases.\n[Amendment 2021]"},{"id":"bylaw-165","kind":"bylaw","num":"165","title":"Measurement of travel distance to exits.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) The travel distance to an exit shall be measured on the floor or other walking surface along\nthe centre line of the natural path of travel, starting 0.300 metre from the most remote point of\noccupancy, curving around any corners or obstructions with 0.300 metre clearance therefrom and\nending at the storey exit. Where measurement includes stairs, it shall be taken in the plane of the\ntread nosing.\n(2) In the case of open areas the distance to exits shall be measured from the most remote point\nof occupancy provided that the direct distance shall not exceed two-thirds the permitted travel\ndistance.\n(3) In any individual room which is subjected to the occupancy of not more than six persons, the\ntravel distance shall be measured from the door of such a room:\nProvided that the travel distance from the most remote point in the room to the room door does not\nexceed 9 metres or any other area determined by the Fire and Rescue Department.\n[Amendment 2012]\n[Amendment 2021]\n(4) The maximum travel distances to exits and dead end limits shall be as specified in the Seventh\nSchedule of these By-laws."},{"id":"bylaw-166","kind":"bylaw","num":"166","title":"Exits to be accessible at all times.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) Except as permitted by by-law 167 not less than two separate exits shall be provided from each\nstorey together with such additional exits as may be necessary.\n(2) The exits shall be so sited and the exit access shall be so arranged that the exits are within the\nlimits of travel distance as specified in the Seventh Schedule to these By-laws and are readily\naccessible at all times."},{"id":"bylaw-167","kind":"bylaw","num":"167","title":"Storey exits. Deleted.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\n [Amendment 2021]"},{"id":"bylaw-168","kind":"bylaw","num":"168","title":"Staircases.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012"],"content":"(1) Except as provided for in by-law 194 every upper floor shall have means of egress via at least\ntwo separate staircases.\n(2) Staircases shall be of such width that in the event of any one staircase not being available for\nescape purposes the remaining staircases shall accommodate the highest occupancy load of any\none floor discharging into it calculated in accordance with provisions in the Seventh Schedule to\nthese By-laws.\n(3) The required width of a staircase shall be the clear width between walls but handrails may be\npermitted to encroach on this width to a maximum of 80 millimetres.\n[Amendment 2012]\n(4) The required width of a staircase shall be maintained throughout its length including at landings.\n(5) Doors giving access to staircases shall be so positioned that their swing shall at no point encroach\non the required width of the staircase or landing."},{"id":"bylaw-169","kind":"bylaw","num":"169","title":"Exit route.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"No exit route may reduce in width along its path of travel from the storey exit to the final exit.\n[Amendment 2012]\n[Amendment 2021]\n(2) Deleted.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-170","kind":"bylaw","num":"170","title":"Egress through unenclosed openings.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Where unenclosed openings are permitted between floors and for a mezzanine floor, egress may be by\nway of an open staircase to an adjacent floor and thence to a story exit:\n(a) the layout is such that a fire originating anywhere within the compartment will be obvious\nto the occupants of all communicating levels or areas;\n(b) the travel distances specified in the Seventh Schedule to these By-laws are not exceeded;\n(c) only 50 percent of the occupants of a floor are assumed to use the open staircase and storey\nexits are provided at every level to accommodate the other 50 percent of the occupants of\nthat level in accordance with the provisions of the Seventh Schedule to these by-laws; and\n(d) the storey exits on the principal floor through with other levels discharge are designed to\nhandle the occupants of that floor plus 50 percent of the occupants from the adjacent levels\ndischarging through it."},{"id":"bylaw-171","kind":"bylaw","num":"171","title":"Horizontal exits.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) Where appropriate, horizontal exits may be provided in lieu of other exits.\n(2) Where horizontal exits are provided exit staircases and final exits need only be of a width to\naccommodate the occupancy load of the larger compartment or building discharging into it so long\nas the total number of exit widths provided is not reduced to less than half that would otherwise\nbe required for the whole building.\n[Amendment 2021]\n(3) For institutional occupancies the total exit capacity other than horizontal exits shall not be reduced\nby more than one-third that would otherwise be required for the entire area of the building."},{"id":"bylaw-172","kind":"bylaw","num":"172","title":"Emergency exit signs.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Storey exits and access to such exits shall be marked by readily visible signs and shall not be\nobscured by any decorations, furnishings or other equipment.\n(2) A sign reading “KELUAR” with an arrow indicating the direction shall be placed in every location\nwhere the direction of travel to reach the nearest exit is not immediately apparent.\n(3) The design and installation of every emergency exit sign shall be in compliance with MS 2687\nand MS 619.\n[Amendment 2012]\n[Amendment 2021]\n(4) All exit signs shall be illuminated continuously during periods of occupancy.\n(5) Deleted.\n [Amendment 2021]"},{"id":"bylaw-173","kind":"bylaw","num":"173","title":"Exit doors.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) All exit doors shall be openable from the inside without the use of a key or any special knowledge\nor effort.\n(2) Exit doors shall close automatically when released and all door devices including magnetic door\nholders, shall release the doors upon power failure or actuation of the fire alarm."},{"id":"bylaw-174","kind":"bylaw","num":"174","title":"Arrangement of storey exits.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) Except as provided for in by-law 194, every compartment shall be provided with at least two\nstorey exits located as far as practical from each other and shall not be less than 5 metres apart\nmeasured between the nearest edges of the opening and in such a position that the travel distance\nspecified in the Seventh Schedule to these By-Laws shall not be exceeded.\n [Amendment 2021]\n(2) The width of storey exit shall be in accordance with the provision in the Seventh Schedule to\nthese By-Laws.\n [Amendment 2021]\n(3) Basements and roof structures used solely for services need not be provided with alternative means\nof escape.\n [Amendment 2021]\n(4) Where a central core has more than one exit, storey exits shall be remote from one another and\nno two exits shall be approached from the same lift hall, common lobby or undivided corridor.\n [Amendment 2021]"},{"id":"bylaw-174A","kind":"bylaw","num":"174A","title":"Final exit.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) Each exit shall give access to—\n(a) a final exit;\n(b) a protected corridor leading to a final exit, where the protected corridor shall not exceed a\ntravel distance and dead-end for the corridor according to the Seventh Schedule;\n(c) an exit staircase leading to a final exit;\n(d) an external route leading to a final exit which may comprise an open sided external corridor\nwith no commercial activity and shall not be more than 5 metres from the building eave\nline; or\n(e) an open to sky corridor which is having a minimum width of 1.2 metres and two-way escape\npaths leading to a place of safety outside the building and any unprotected opening along\nthe corridor shall not be located lower than 1.8 metres from the floor level.\n(2) In a sprinkler protected building, a maximum of 50 percent of the total number of exit staircases\nmay discharge directly to the ground level covered circulation space if all of the following are\ncomplied with:\n(a) the discharge point of the exit staircase into the ground level circulation space shall be within\nsight of and with direct access to a place of safety outside the building;\n(b) the maximum distance between the discharge point of an exit staircase to a place of safety\noutside the building shall not exceed 10 metres;\n(c) where there are commercial activities such as shops, kiosks or carts located along one side\nor both sides of the designated escape passageway leading to the place of safety outside\nthe building, a minimum separation distance of 10 metres shall be maintained between the\ncommercial activities and the designated escape passageway, the circulation space shall also be\ninstalled with an engineered smoke control system and alternatively, the commercial activities\nshall be fire compartmented with walls and doors of a minimum 1 hour fire resistance period;\nand\n(d) the clear width of an exit door leading to the place of safety outside the building shall be\nadequate to receive the occupant load of the discharge floor and the total number of persons\ndischarging from the internal exit staircase.\n(3) There shall be no unprotected opening of an occupancy area or combustible material or construction\nwithin 3 metres from a discharge point of the exit staircase (both internal and external) and this\ndistance may be reduced to 1.5 metres if the unprotected opening is along the same plane of the\nstaircase exit.\n [Amendment 2021]"},{"id":"bylaw-175","kind":"bylaw","num":"175","title":"Calculation of occupancy loads.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Calculation of occupancy loads and capacity of exits shall be in accordance with the provisions of the\nSeventh Schedule to these By-laws."},{"id":"bylaw-176","kind":"bylaw","num":"176","title":"Computing storey exit width.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"To compute the required exit width from individual floors of a building --\n(a) calculate the floor area net or gross whichever is applicable;\n(b) determine the allowable occupancy load factor from Table;\n(c) divide the floor area by the number of square metre per person to determine the number of\npersons for which exits must be provided for that floor;\n(d) determine from the table the capacity of the type of exit to be used for the purpose group\nbeing designed; and\n(e) calculate the number of units of exit width for each type of exit used based upon the capacity."},{"id":"bylaw-177","kind":"bylaw","num":"177","title":"Computing number of staircases and staircase width.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"The following factors shall be used in computing the exit widths:\n(a) in a multi-storey building if x units of exit width are required from each floor the staircases\nserving those floors do not need to be x times the number of floors served in units of exit width.\nThe staircases need be only wide enough to serve each floor but not less than the minimum width\nallowed and in every case one of the exit staircases shall be assumed to be inaccessible and the\nremaining exit staircase shall be of sufficient width and number to accommodate the relevant\noccupancy;\n[Amendment 2021]\n(b) depending on the occupancy, street floor exits have to be sized to handle not only the occupant\nload of the street floor but also a percentage of the load of the exits discharging to the street\nfloor from floors above and below;\n(c) exits should never decrease in width along their length of travel and, if two or more exits converge\ninto a common exit, the common exit should never be narrower than the sum of the width of the\nexits converging into it;\n(d) except as provided in these By-laws, the minimum number of exits is two;\n(e) at least one of the staircases should be a minimum of two units width except that 900 millimetres\nmay be allowed where total occupancy of all floors served by staircases is less than 50; and\n(f) there should be no decrease in width along the path of travel of a staircase leading to a final exit.\n[Amendment 2021]"},{"id":"bylaw-178","kind":"bylaw","num":"178","title":"Exits for institutional and places of assembly.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"In buildings classified as institutional or places of assembly, exits to a street or large open space, together\nwith staircases, corridors and passages leading to such exits shall be located, separated or protected as\nto avoid any undue danger to the occupants of the place of assembly from fire originating in the other\noccupancy or smoke therefrom."},{"id":"bylaw-179","kind":"bylaw","num":"179","title":"Classification of places of assembly.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Each place of assembly shall be classified according to its capacity as follows:\nClass A – Capacity .. 1,000 persons or more\nClass B – Capacity .. 300 to 1,000 persons\nClass C – Capacity .. 100 to 300 persons"},{"id":"bylaw-180","kind":"bylaw","num":"180","title":"Space standards for calculating occupancy loads.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"The occupancy load permitted in any place of assembly shall be determined by dividing the net floor\narea or space assigned to the use by the square metre per occupant as follows:\n(a) assembly area of concentrated use without fixed seats such as an auditorium, places of worship,\ndance floor and lodge room 0.65 square metre per person;\n(b) assembly area of less concentrated use such as a conference room, dining room, drinking\nestablishment, exhibit room, gymnasium or lounge – 1.35 square metre per person;\n(c) standing room or waiting space – 3 square metres per person;\n(d) the occupancy load of an area having fixed seats shall be determined by the number of fixed seats\ninstalled. Required aisle space serving the fixed seats shall not be used to increase the occupant\nload."},{"id":"bylaw-181","kind":"bylaw","num":"181","title":"Width of means of egress.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"Means of egress shall be measured in units of exits width of 550 millimetres. Fractions of a unit shall\nnot be counted, except that 300 millimetres added to one or more full units shall be counted as one\nhalf of a unit exit width and no individual access to exit shall be less than 700 millimetres.\n[Amendment 2021]"},{"id":"bylaw-182","kind":"bylaw","num":"182","title":"Rate of discharge.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"The rate of travel per floor of persons shall be sixty persons per minute through doors or along level\npassage ways and forty-five persons per minute down stairs."},{"id":"bylaw-183","kind":"bylaw","num":"183","title":"Exit details for places of assembly.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Every place of assembly, every tier or balcony and every individual room used as a place of assembly\nshall have exits sufficient to provide for the total capacity thereof as determined in accordance with\nby-law 180 and as follows:\n(a) no individual unit of exit width shall serve more than one hundred persons;\n(b) doors leading outside the building at ground level or not more than three risers above or below\nground one hundred persons per exit unit;\n(c) staircases or other types of exit not specified in by-law 177 above seventy-five persons per exit\nunit;\n(d) every Class A place of assembly (capacity one thousand persons or more) shall have at least four\nseparate exits as remote from each other as practicable;\n(e) every Class B place of assembly (capacity three hundred to one thousand persons) shall have at\nleast two separate exits as remote from each other as practicable, and if of a capacity of over six\nhundred at least three such exits;\n(f) every Class C place of assembly (capacity one hundred to three hundred persons) shall have at\nleast two means of exit, consisting of separate exits or doors leading to a corridor or other space\ngiving access to separate exits in different directions."},{"id":"bylaw-184","kind":"bylaw","num":"184","title":"Seating.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) (a) The spacing of rows of seats from back to back shall be not less than 825 millimetres, nor\nless than 675 millimetres plus the sum of the thickness of the back and inclination of the\nback.\n(b) There shall be a space of not less than 300 millimetres between the back of one seat and\nthe front of the seat immediately behind it as measured between plumb-lines.\n(c) Rows of seats between gangways shall have not more than fourteen seats.\n(d) Rows of seats opening on to a gangway at one end only shall have not more than seven\nseats.\n(e) Seats without dividing arms shall have their capacity determined by allowing 450 millimetres\nper person.\n(2) (a) With continental seating the spacing of rows of unoccupied seats shall provide a clear width\nbetween rows measured horizontally as follows (automatic or self-rising seats shall be measured\nin the seat-up position, other seats shall be measured in the seat-down position):\n 450 millimetres clear width between rows of 18 seats or less;\n 500 millimetres clear width between rows of 35 seats or less;\n 525 millimetres clear width between rows of 45 seats or less;\n 550 millimetres clear width between rows of 46 seats or more.\n(b) With continental seating, the number of intervening seats between any seat and a gangway\nmay be increased to 49 where exit doors are provided along each side gangway of the row\nof seats at the rate of 1 pair of exit doors for each 5 rows of seat. Such exit doors shall\nprovide a minimum clear width of 1,680 millimetres."},{"id":"bylaw-185","kind":"bylaw","num":"185","title":"Gangway in places of assembly.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) A clear gangway not less than 1,200 millimetres in width shall be provided around the stalls and\nbalcony in a place of assembly leading to exit doors therein:\nProvided that if the gangways in the balcony lead to exit doors not less than 1,200 millimetres in width\nthe rear gangway may be omitted.\n(2) Gangways not less than 1,200 millimetres wide running parallel to the rows of seating in a place\nof assembly shall be provided where required by the local authority.\n(3) All floors of balconies or tiers in a place of assembly shall be constructed entirely of reinforced\nconcrete.\n(4) Steps shall not be used to overcome differences in level in a gangway in a place of assembly\nunless the slope of such gangway exceeds one in ten.\n(5) Where steps of a pitch exceeding 30º or ramps of a slope exceeding one in ten are provided in\ngangways flanking the seating in place of assembly, suitable handrails shall be provided.\n(6) The treads of steps in gangways in a place of assembly shall have a non-slip surface and the\nedges of such steps shall be illuminated at step level.\n(7) In circles and galleries or areas where the incline exceeds 15º, guard rails not less than 1,050\nmillimetres above floor level shall be provided at the foot of gangways in places of assembly."},{"id":"bylaw-186","kind":"bylaw","num":"186","title":"Exit doors in places of assembly.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) All doors used by the public as exit doors from any part of the place of assembly or leading to\nthe open air, shall open only in the direction of exit.\n(2) In place of assembly all exit doors and doors through which the public pass on the way to the\nopen air shall be without lock, bolts or other fastenings while the public are in the building:\nProvided that doors used for exit only may be fitted with panic bolts.\n(3) Panic bolts fitted to doors in a place of assembly shall be not less than 750 millimetres or more\nthan 1,100 millimetres above the floor.\n(4) Turnstiles, if installed in a place of assembly, shall be arranged clear of the line of exit, and shall\nnot be included in the calculation of exit width.\n(5) In a place of assembly every external door used by the public and every collapsible gate shall be\ncapable of being locked in the fully open position in such a way that a key is required to release\nsuch door or gate from such open positon."},{"id":"bylaw-187","kind":"bylaw","num":"187","title":"Notice affixed to door or gate.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"A notice or notices so arranged as to be visible from both sides of the door, gate or shutter whether the\ndoor, gate or shutter is in the open or in the closed position shall be affixed to, or in position adjacent\nto every door and gate referred to above, such notice bearing the words “This gate / door is required\nto be kept open and locked in that position during the whole time the audience / gathering is in the\nbuilding”. The height of the lettering for such notice shall not be less than 75 millimetres."},{"id":"bylaw-188","kind":"bylaw","num":"188","title":"Travel distance in place of assembly.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Exits in any place of assembly shall be arranged that the travel distance from any point to reach an\nexit shall not exceed 45 metres for unsprinkled buildings and 60 metres for sprinkled buildings."},{"id":"bylaw-189","kind":"bylaw","num":"189","title":"Enclosing means of escape in certain buildings.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Every staircase provided under these By-laws in a building of four storeys or more, or in a\nbuilding where the highest floor level is more than 12 metres above the ground level, or in any\nplace of assembly, or in any school when such staircase is to be used as an alternative means\nof escape shall be enclosed throughout its length with fire resisting materials.\n[Amendment 2012]\n(2) In a building of Purpose Group IV (Office), an open corridor design may have an unenclosed\nstaircase if provided with an extended landing which shall not be less than twice the staircase\nwidth and a wall separating the staircase from the occupancy shall be returned for a distance\nof not less than 1 metre along the frontage of adjacent occupancy.\n [Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-190","kind":"bylaw","num":"190","title":"External exit staircase.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) An exit staircase may qualify as an external exit staircase if no part of it is recessed for more\nthan 3 metres from the building façade and has —\n(a) a minimum of two adjacent sides abutting to a place of safety outside the building; or\n(b) one of its longest sides abutting to a place of safety outside the building.\n(2) An external exit staircase may be used as a required exit in-lieu of an internal exit staircase if—\n(a) it complies with the requirements for an exit staircase; and\n(b) there is no unprotected opening, combustible material and construction within 2 metres\nhorizontally or within 9 metres vertically below, adjacent or facing it;\nwith the exception to a building designed with external corridor access, the access to the external exit\nstaircase may be by means of an open-sided external corridor adjoining the occupancy areas, subject\nto the following:\n(i) the external corridor shall be served by at least two exit staircases; and\n(ii) an unobstructed ventilation opening shall be provided along the long side of the external\ncorridor above the parapet or balustrade; and\n(c) its final discharge shall lead directly to a place of safety outside the building.\n(3) Any ventilation opening to a toilet or other protected area is exempted from this restriction.\n(4) Where a window or any other glazed opening is required within this dimension, it shall be fitted\nwith a wired glass and be kept permanently in a closed position.\n(5) A fire door to the external exit staircase shall be provided.\n [Amendment 2021]"},{"id":"bylaw-191","kind":"bylaw","num":"191","title":"Openings in adjacent walls not permitted. Deleted.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"[Amendment 2021]"},{"id":"bylaw-192","kind":"bylaw","num":"192","title":"Moving walks.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) An inclined moving walk exit shall comply with the applicable requirements of ramps.\n(2) No moving walk capable of being operated in the direction contrary to normal exit travel shall\nbe used as a means of egress."},{"id":"bylaw-193","kind":"bylaw","num":"193","title":"Power operated doors as means of egress.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"A power operated door shall only be regarded as a means of egress if it is possible to be swung in the\ndirection of exit travel by manual means."},{"id":"bylaw-194","kind":"bylaw","num":"194","title":"Building with single staircase.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"A single staircase may be permitted in the following premises:\n(a) if any dwelling at 12 metres in height measured from the fire appliance access level to the\nhighest and lowest occupied floors; or\n(b) if any building does not exceed two storeys and its first floor does not exceed 6 metres from\nthe ground floor.\n [Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-195","kind":"bylaw","num":"195","title":"Staircases to reach roof level.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"In buildings exceeding 30 metres in height all staircases intended to be used as means of egress shall\nbe carried to the roof level to give access thereto."},{"id":"bylaw-196","kind":"bylaw","num":"196","title":"Smoke lobbies.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) Access to a staircase smoke lobby shall be by means of fire doors opening in the direction of\nescape.\n(2) The width of the smoke lobby shall at no point be less than the required exit width.\n(3) Smoke lobbies shall be provided at the basement levels where an escape staircase serving an upper\nstorey is extended to a basement.\n(4) Where practical smoke lobbies shall have permanent openings or openable windows of not less\nthan 1 square metre giving direct access to the open air from an external wall or internal light\nwell.\n[Amendment 2021]\n(5) Where natural ventilation is impractical smoke lobbies may be ventilated by means of a vertical\nshaft or mechanically pressurised.\n [Amendment 2021]"},{"id":"bylaw-197","kind":"bylaw","num":"197","title":"Protected lobbies.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) Protected lobbies shall be provided to serve staircase in buildings exceeding 18 metres above\nground level where the staircase enclosures are not ventilated through external walls.\n(2) In buildings where the topmost occupied floor exceeds 45 metres above ground level, such protected\nlobbies shall be pressurised to meet the requirements of MS 1472 or any other system meeting\nthe functional requirements of the Director General.\n[Amendment 2012]\n [Amendment 2021]\n(3) Protected lobbies may be omitted if the staircase enclosures are pressurised to meet the requirements\nof by-law 200."},{"id":"bylaw-197A","kind":"bylaw","num":"197A","title":"Provision of fire fighting shafts.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\n[Amendment 2021]\n(1) A building with the topmost occupied floor at more than 18 metres above fire appliance access\nlevel shall have one or more fire fighting shafts.\n [Amendment 2012]\n[Amendment 2021]\n(2) A building with a basement storey more than 9 metres below the fire appliance access level shall\nbe provided with one or more fire fighting shafts.\n [Amendment 2021]\n(3) A fire fighting access lobby shall be directly accessible from a fire fighting staircase, a fire lift\nand containing a dry riser or wet riser which shall be provided at every floor level, and shall be\nwithin 45 metres coverage from a fire fighting access lobby door.\n[Amendment 2012]\n[Amendment 2021]\n(4) A fire fighting access lobby may be omitted if the fire fighting staircase is pressurised to meet\nthe requirements of by-law 200 and all fire fighting installations within the pressurised staircase\nenclosure shall not intrude into the clear space required for means of escape.\n[Amendment 2012]\n[Amendment 2021]\n(5) A fire fighting staircase shall be provided to give direct access to each fire fighting access lobby\nand shall be directly accessible from outside the building at fire appliance access level and the\nstaircase may be one of the staircases required as means of escape from the building.\n[Amendment 2012]\n[Amendment 2021]\n(6) A fire lift, subject to paragraph (7) of this by-law, shall be provided to give access to each fire\nfighting access lobby or in the absence of a lobby, subject to paragraph (3) of this by-law, be\nconnected by a protected corridor to the fire fighting staircase at each floor level.\n[Amendment 2012]\n[Amendment 2021]\n(6) Deleted.\n(7) Deleted.\n(8) Deleted.\n(9) Deleted.\n[Amendment 2012]\n[Amendment 2021]\n(7) A fire lift shall be provided at the rate of one lift in every group of lifts which discharge into\nthe fire fighting access lobby provided that the fire lift is located not more than 60 metres travel\ndistance from the fire lift door to the furthermost point of the floor and in an open plan, the\ndirect distance shall be two-thirds of the travel distance.\n[Amendment 2012]\n[Amendment 2021]\n(8) All lifts serving upper floors shall not extend to basement floors except where the basement floors\nonly contains low fire loads or are used solely for car parks, and in all the permitted situations,\nprotected lobbies shall be provided which shall be interposed between the lift openings and the\nareas served.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-197B","kind":"bylaw","num":"197B","title":"Fire fighting access lobbies.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\nA fire fighting access lobby shall conform to the following requirements:\n(a) each lobby shall have a floor area of not less than 6.0 square metres; and\n(b) the openable area of a window or area of permanent ventilation shall not be less than 25\npercent of the floor area of the lobby and, if ventilation is by means of an openable window,\nadditional permanent ventilation which is having a free opening of 500 square centimetres\nshall be provided except when a mechanical pressurisation is provided as an alternative.\n [Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-198","kind":"bylaw","num":"198","title":"Ventilation of staircase enclosures.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) All staircase enclosures shall be ventilated at each floor or landing level by either permanent\nopenings or openable windows to the open air having a free area of not less than 1 square metre\nper floor.\n(2) Openable windows shall meet the operational requirements of the Director General.\n[Amendment 2021]\n(3) Deleted.\n[Amendment 2012]"},{"id":"bylaw-199","kind":"bylaw","num":"199","title":"Ventilation of staircase enclosures in buildings not exceeding 18 metres.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\n[Amendment 2021]\nIn buildings not exceeding 18 metres above ground level, staircase enclosures may be unventilated provided\nthat access to them at all levels except the top floor is through ventilated lobbies and the staircase\nenclosures are permanently ventilated at the top with at least 5 percent of the area of the enclosures.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-200","kind":"bylaw","num":"200","title":"Ventilation of staircase enclosures in buildings exceeding 18 metres.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"For staircases in buildings exceeding 18 metres above ground level that are not ventilated in accordance\nwith by-law 198, two alternative methods of preventing the infiltration of smoke into the staircase\nenclosures may be permitted by providing --\n(a) permanent ventilation at the top of the staircase enclosure of not less than 5 percent of\nthe area of the enclosure and in addition at suitable intervals in the height of the staircase\na mechanically ventilated shaft to achieve not less than 20 air changes per hour to be\nautomatically activated by a signal from the fire alarm panel; or\n(b) a mechanical pressurisation of the staircase enclosure which is designed and installed in\naccordance with MS 1472.\n [Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-201","kind":"bylaw","num":"201","title":"Staircase enclosures below ground level.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"All staircase enclosures below ground level shall be provided with suitable means of preventing the\ningress of smoke."},{"id":"bylaw-202","kind":"bylaw","num":"202","title":"Pressurised system for staircases.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"All staircases serving a building of more than 45 metres in height where there is no adequate ventilation\nas required, there shall be provided with a staircase pressurisation system which is designed and installed\nin accordance with MS 1472.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-203","kind":"bylaw","num":"203","title":"Restriction of spread of flame.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) A finished floor or floor covering may be exempted from the requirements of this Part:\nProvided that in any case where the authority having jurisdiction finds a floor surface of unusual\nhazard, the floor surface shall be considered a part of the interior finish for the purposes of this Part.\n(2) The classification of interior finish materials specified shall be that of the basic material used,\nwithout regard to subsequently applied paint or wall-paper, except that the Fire and Rescue\nDepartment having jurisdiction shall include such finishes in the determination of classification in\nany case where in the opinion of the Fire and Rescue Department having jurisdiction they are of\nsuch character or thickness or so applied as to affect materially the flame spread characteristics.\n [Amendment 2021]\nBy-Law 204. Classification of restriction of flame over surfaces of walls and ceilings.\nFor the purpose of this Part and the Eighth Schedule to these By-laws, any reference to a surface being\nof a specified class shall be construed as a requirement that the material of which the wall, ceiling or\nsoffit is constructed, shall comply with the following requirements --\nClass O. Surface of no flame spread.\n(a) Any reference to a surface being Class O shall be construed as a requirement that --\n(i) the material of which the wall or ceiling is constructed shall be non-combustible\nthroughout; or\n(ii) the surface material, or if it is bonded throughout to a substrate, the surface material\nin conjunction with the substrate, shall when tested in accordance with BS 476: Part\n6 and Part 7, shall have an index of performance not exceeding 6.\n[Amendment 2012]\n[Amendment 2021]\n(b) Any reference to a surface being of a class other than Class O shall be construed as a\nrequirement that the material of which the wall or ceiling is constructed shall comply with\nthe relevant test criteria as to surface spread of flame specified in relation to that class in\nBS 476: Part 1: Clause 7.\n[Amendment 2012]\n[Amendment 2021]\n(c) In relation to a requirement that a surface shall be of a class not lower than a specified\nclass, Class O shall be regarded as the highest class followed in descending order by Class\n1, Class 2, Class 3 and Class 4.\n[Amendment 2012]\nClass 1. Surface of Very Low Flame Spread.\nThose surfaces on which not more than 150 millimetres mean spread of flame occurs.\nClass 2. Surfaces of Low Flame Spread.\nThose surfaces on which during the first 11/\n minutes of test, the mean spread of flame is not\nmore than 375 mm and the final spread does not exceed 450 mm.\nClass 3. Surfaces of Medium Flame Spread.\nThose surfaces of which, during the first 11/\n minutes of test, the mean spread of flame is not\nmore than 375 millimetres and during the first 10 minutes of test is not more than 825 millimetres.\nClass 4. Surfaces of Rapid Flame Spread.\nThose surfaces on which during the first 11/\n minutes of test, the mean spread of flame is not\nmore than 375 millimetres and during the first 10 minutes of test is more than 825 millimetres."},{"id":"bylaw-205","kind":"bylaw","num":"205","title":"Classification of interior finish materials.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) Any material shown by test to have a life hazard greater than that indicated by the flame spread\nclassification owing to the amount or character of smoke generated shall be included in the\ngroup shown in by-law 204 appropriate to its actual hazard as determined by the Fire and Rescue\nDepartment.\n[Amendment 2021]\n(2) Classification of interior finish materials shall be in accordance with tests made under conditions\nsimulating actual installations.\n(3) Where a complete standard system of automatic sprinklers is installed, interior finish with flame\nspread rating not over Class 3 may be used in any location where Class 2 is normally specified,\nand with rating of Class 2 in any location where Class 1 is normally specified and with rating of\nClass 1 where Class O is specified.\n(4) In all buildings other than private residences, Class O or Class 1 interior finish shall be used in\nall basements or other underground spaces from which there is no direct exit to the outside of\nthe building if subject to occupancy for any purpose other than storage or service facilities."},{"id":"bylaw-206","kind":"bylaw","num":"206","title":"Classification of surface of wall or ceiling.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) The surface of a wall or ceiling in a room, circulation space or protected shaft shall be of a class\nnot lower than that specified as relevant in the Eight Schedule to these By-laws:\nProvided that --\n(a) a wall may have a surface of any class not lower than Class 3 to the extent permitted by\nparagraph (3); and\n(b) a ceiling may either have a surface of any class not lower than Class 3 to the extent\npermitted by paragraph (3).\n[Amendment 2021]\n(2) Any part of the surface of a wall in a room may be of any class not lower than Class 3 if the\narea of the part, or, if there are two or more such parts, the total area of those parts does not\nexceed the lesser of the following:\n(a) half the floor area of the room; or\n(b) in the case of a building or compartment of Purpose Group I, II or III, 2.2 square metres\nor in any other case 6.5 square metres.\n(3) Any part or the surface of a ceiling may be of any class not lower than Class 3 if that part of\nthe surface is the face of a layer of material the other face of which is exposed to the external\nair and --\n(a) (i) the ceiling is that of a room in a building or compartment of Purpose Group II, III, IV,\nV or VII or that of a circulation space in a building or compartment of any purpose\ngroup;\n(ii) the area of that part does not exceed 2.5 square metres; and\n(iii) the distance between that part and any other such part is not less than 4 square metres;\nor\n(b) (i) the ceiling is that of a room in a building or compartment of Purpose Group VI or\nVIII;\n(ii) the area of that part does not exceed 5 square metres;\n(iii) the distance between that part and other such part is not less than 150 millimetres;\nand\n(iv) that part and all other such parts are evenly distributed over the whole area of the\nceiling and together have an area which does not exceed 15 percent of the floor area\nof the room; or\n(c) the ceiling is that of a balcony, verandah, open car park, covered way or loading way which,\nirrespective of its floor area, has at least one of its longer sides wholly and permanently open;\nor\n(d) the ceiling is that of a garage, conservatory or outbuilding which, irrespective of whether\nit forms part of a building or is a building which is attached to another building or wholly\ndetached, has a floor area not exceeding 44 square metres."},{"id":"bylaw-207","kind":"bylaw","num":"207","title":"Exceptions relating to ceilings. Deleted.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-208","kind":"bylaw","num":"208","title":"Reference to roofs.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Any reference in this Part to a roof or part of a roof of a specified designation shall be construed as\nmeaning a roof or part of a roof so constructed as to be capable of satisfying the relevant test criteria\nspecified in respect of that designation of roof in BS 476: Part 3:\nProvided that any roof or part of a roof shall be deemed to be of such a designation if --\n(a) it conforms with one of the specifications set out against the designation in the Eight Schedule\nto these By-laws; or\n(b) a similar part made to the same specification as that roof is proved to satisfy the relevant test\ncriteria."},{"id":"bylaw-209","kind":"bylaw","num":"209","title":"Reference to buildings.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Any reference in this Part to a building shall, in any case where two or more houses adjoin, be construed\nas a reference to one of those houses."},{"id":"bylaw-210","kind":"bylaw","num":"210","title":"Construction of roofs.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2021"],"content":"(1) No part of the roof of a building which --\n(a) has a cubic capacity exceeding 1,420 cubic metres;\n(b) is wholly or partly of Purpose Group VI or VII; or\n(c) is a house in a continuous terrace of more than two houses;\nshall be so constructed as to be designated in accordance with by-law 212 BD, CA, CB, CC, CD, DA,\nDB, DC or DD, or be covered with wood shingles.\n[Amendment 2021]\n(2) Any part of a roof which is so designated BA, BB or BC, shall not be less than 2.30 metres from\nany point on a boundary.\n[Amendment 2021]\n(3) Any part of a roof which is so designated AD, BD, CA, CB, CC or CD, or is covered with wood\nshingles, shall be not less than 4.60 metres from any point on a boundary unless such part is --\n(a) of an area not exceeding 3 square metres; and\n(b) separated from any other part of the same roof which is so designated or covered with\nwood shingles by an area of roof which is at least 1.50 metres wide and which is covered\nby non-combustible material,\nin which case such designated part or parts covered with wood shingles shall be not less than\n2.30 metres from any such point.\n[Amendment 2021]"},{"id":"bylaw-211","kind":"bylaw","num":"211","title":"Roofing materials.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"(1) A surface or material for a roof covering or roof construction shall have the surface spread of\nflame rating not lower than Class 1, except in the case of Purpose Group I or III as shown in the\nFifth Schedule to these By-Laws, and in a building that is protected throughout with an automatic\nsprinkler system.\n[Amendment 2012]\n[Amendment 2021]\n(2) The Director General may approve the use of combustible material for roof construction for the\nbuilding of Purpose Group II, IV, V or VI as shown in the Fifth Schedule to these By-Laws, if\nthe following requirements are satisfied:\n(a) the building shall not exceed four storeys;\n(b) the roof space between the roof and the ceiling shall have a cavity barrier wherever required,\nwhich complies with the relevant provision, and an opening in the cavity barrier shall be\nfire-stopped; and\n(c) if the underside of the roof serves as a ceiling to a room or space, the element of the\nunderside of the roof shall comply with the relevant provision of by-law 204.\n[Amendment 2012]\n[Amendment 2021]\n(3) At the junctions with a separating wall or compartment wall, the roof construction shall comply\nwith the requirements as may be specified by the Fire and Rescue Department.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-211A","kind":"bylaw","num":"211A","title":"Materials for construction.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":["2012","2021"],"content":"[Amendment 2012]\n(1) Material used in the construction of a building element shall comply with the requirements stated\nunder this Part in addition to the performance requirements such as for fire resistance or limits\nto spread of flame.\n[Amendment 2012]\n[Amendment 2021]\n(2) Intumescent paint is allowed to be used for the protection of structural steel member of all buildings\nprovided that –\n(a) the paint is of a proprietary system that has been tested to achieve the fire resistance\nperformance as required in BS 476; and\n(b) a coating of intumescent paint onto structural steel, and subsequent maintenance of the\ncoating conforms to BS 8202.\n[Amendment 2012]\n[Amendment 2021]\n(3) In a building which is protected by an automatic sprinkler system, a fire-rated glass may be used\nfor the construction of a compartment wall, compartment floor, enclosure to smoke stop lobby,\nfire fighting lobby or protected shaft without an exit staircase or fire lift, subject to the following:\n(a) the wall and door shall have necessary fire resistance, including insulation, when subject to\nthe test under BS 476 for the wall and MS 1073 for the door; and\n(b) the wall and door shall meet the Class A of impact performance requirements when subject\nto the test under BS 6206 or AS 2208.\n[Amendment 2012]\n[Amendment 2021]\n(4) The wall, ceiling, roof covering or finish shall not contain any plastic material.\n[Amendment 2012]\n[Amendment 2021]\n(5) For the purpose of this by-law, “AS” means the latest published edition of the Australian Standard.\n[Amendment 2012]"},{"id":"bylaw-212","kind":"bylaw","num":"212","title":"Category designation for fire penetration and spread of flame on roof surface.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Each category designation for roofing material shall consist of two letters, the first letter referring to\nfire penetration and the second letter to spread of flame on the roof surface, these being determined\nas follows:\n(a) First letter --\n(i) A - Those specimens which have not been penetrated within 1 hour;\n(ii) B - Those specimens which are penetrated in not less than 1/\n hour;\n(iii) C - Those specimens which are penetrated in less than 1/\n hour;\n(iv) D - Those specimens which are penetrated in the preliminary test.\n(b) Second letter --\n(i) A - Those specimens on which there is no spread of flame;\n(ii) B - Those specimens on which there is not more than 525 millimetres spread of flame;\n(iii) C - Those specimens on which there is more than 525 millimetres spread of flame;\n(iv) D - Those specimens which continue to burn for 5 minutes after the withdrawal of the\ntest flame or spread more than 375 millimetres across the region of burning in the\npreliminary test."},{"id":"bylaw-213","kind":"bylaw","num":"213","title":"Fire resistance.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"Subject as otherwise provided by this Part every element of structure shall be so constructed as to\nhave fire resistance for not less than whichever of the periods specified in the Ninth Schedule to these\nBy-laws is relevant, having regard to the purpose group of the building of which it forms part and the\ndimensions specified in that Schedule."},{"id":"bylaw-214","kind":"bylaw","num":"214","title":"Additional requirements.","part":"VII","partTitle":"FIRE SAFETY INSTALLATION REQUIREMENTS","amendments":[],"content":"(1) In addit
