<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UBBL Navigator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f6f3ec;
    --paper:#fffdf8;
    --ink:#1b2027;
    --ink-soft:#565b63;
    --ink-faint:#8b8f96;
    --line:#ddd7c8;
    --line-strong:#c7bfa9;
    --accent:#1c4f66;
    --accent-ink:#ffffff;
    --accent-soft:#e4edf0;
    --accent-soft-line:#bcd3db;
    --amend:#96591f;
    --amend-soft:#f4e6d3;
    --danger:#8a3324;
    --danger-soft:#f6e4df;
    --focus:#1c4f66;
    --shadow: 0 1px 2px rgba(27,32,39,.06), 0 6px 18px -8px rgba(27,32,39,.12);
    --radius-s:4px;
    --radius-m:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181d;
      --paper:#1b2129;
      --ink:#eceae3;
      --ink-soft:#a8adb5;
      --ink-faint:#767c85;
      --line:#333b45;
      --line-strong:#3f4954;
      --accent:#6fb3ce;
      --accent-ink:#0e1418;
      --accent-soft:#20323b;
      --accent-soft-line:#2d4f5c;
      --amend:#d9a15c;
      --amend-soft:#332a1c;
      --danger:#e0806c;
      --danger-soft:#3a2620;
      --focus:#6fb3ce;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181d;
    --paper:#1b2129;
    --ink:#eceae3;
    --ink-soft:#a8adb5;
    --ink-faint:#767c85;
    --line:#333b45;
    --line-strong:#3f4954;
    --accent:#6fb3ce;
    --accent-ink:#0e1418;
    --accent-soft:#20323b;
    --accent-soft-line:#2d4f5c;
    --amend:#d9a15c;
    --amend-soft:#332a1c;
    --danger:#e0806c;
    --danger-soft:#3a2620;
    --focus:#6fb3ce;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html, body{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  ::selection{background:var(--accent-soft-line);}
  a{color:var(--accent);}
  button, input{ font-family:inherit; }
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .num{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}

  /* ---------- Shell ---------- */
  .shell{
    display:grid;
    grid-template-rows:auto 1fr;
    height:100vh;
    height:100dvh;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 28px);
    background-size:28px 28px;
    background-position:-1px -1px;
    background-blend-mode:normal;
    position:relative;
    flex-wrap:wrap;
  }
  .topbar::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--paper) 88%, transparent), var(--paper) 85%);
    pointer-events:none;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    position:relative;
    z-index:1;
    min-width:0;
  }
  .brand .mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.09em;
    color:var(--accent-ink);
    background:var(--accent);
    padding:3px 6px;
    border-radius:3px;
    font-weight:600;
  }
  .brand h1{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .brand .sub{
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:.02em;
  }

  .searchwrap{
    position:relative;
    flex:1 1 340px;
    min-width:220px;
    max-width:520px;
    z-index:1;
  }
  .searchwrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--ink-faint); pointer-events:none;
  }
  #searchInput{
    width:100%;
    padding:9px 34px 9px 32px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius-m);
    background:var(--paper);
    color:var(--ink);
    font-size:13.5px;
  }
  #searchInput:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
  #searchClear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:none; background:transparent; color:var(--ink-faint);
    width:22px; height:22px; border-radius:50%; display:none;
    font-size:15px; line-height:1;
  }
  #searchClear:hover{background:var(--accent-soft); color:var(--ink);}

  .jumpform{
    display:flex;
    align-items:stretch;
    gap:0;
    position:relative;
    z-index:1;
  }
  .jumpform label{
    display:flex; align-items:center;
    font-size:11.5px; color:var(--ink-soft);
    padding:0 8px 0 2px; white-space:nowrap;
  }
  #jumpInput{
    width:150px;
    padding:9px 10px;
    border:1px solid var(--line-strong);
    border-right:none;
    border-radius:var(--radius-m) 0 0 var(--radius-m);
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  #jumpGo{
    padding:9px 14px;
    border:1px solid var(--accent);
    border-radius:0 var(--radius-m) var(--radius-m) 0;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
  }
  #jumpGo:hover{filter:brightness(1.08);}

  .themeToggle{
    z-index:1;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink-soft);
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .themeToggle:hover{color:var(--ink);}

  /* ---------- Body layout ---------- */
  .body{
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:0;
  }
  .sidebarScrim{
    display:none; position:fixed; inset:0; z-index:19;
    background:rgba(10,12,15,.35);
  }
  @media (max-width:760px){
    .body{grid-template-columns:1fr;}
    .sidebar{
      position:fixed; inset:0 20% 0 0; z-index:20;
      transform:translateX(-101%);
      transition:transform .18s ease;
      box-shadow:var(--shadow);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebarScrim.show{display:block;}
    .menuBtn{display:inline-flex !important; order:1;}
    .topbar{padding:10px 14px; gap:8px 10px;}
    .brand{order:2; flex:1 1 auto; min-width:0;}
    .brand h1{font-size:16px;}
    .brand .sub{display:none;}
    .themeToggle{order:3;}
    .searchwrap{order:4; flex:1 1 100%; max-width:none; min-width:0;}
    .jumpform{order:5; flex:1 1 100%;}
    #jumpInput{flex:1; width:auto; min-width:0;}
    .main{padding:20px 16px 56px;}
    .clauseHead h2{font-size:20px;}
    .navFoot button{max-width:48%;}
  }

  .sidebar{
    border-right:1px solid var(--line);
    background:var(--paper);
    overflow-y:auto;
    min-height:0;
    padding:6px 0 40px;
  }
  .sideSection{ margin-top:4px; }
  .sideSectionTitle{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px 6px;
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-faint);
    position:sticky; top:0;
    background:var(--paper);
    z-index:2;
  }
  .partGroup{ border-top:1px solid var(--line); }
  .partHead{
    width:100%;
    display:flex; align-items:baseline; gap:8px;
    padding:8px 14px;
    background:none; border:none; text-align:left;
    color:var(--ink);
  }
  .partHead:hover{background:var(--accent-soft);}
  .partHead .roman{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--accent); font-weight:600;
    min-width:22px;
  }
  .partHead .ptitle{
    font-size:12.5px; font-weight:600; letter-spacing:.01em;
    flex:1;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .partHead .chev{
    font-size:10px; color:var(--ink-faint);
    transition:transform .15s ease;
  }
  .partGroup.open .chev{transform:rotate(90deg);}
  .partList{ display:none; padding-bottom:4px;}
  .partGroup.open .partList{display:block;}

  .clauseItem{
    width:100%;
    display:flex; align-items:baseline; gap:9px;
    padding:6px 14px 6px 34px;
    background:none; border:none; text-align:left;
    color:var(--ink-soft);
    border-left:2px solid transparent;
  }
  .clauseItem .n{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; color:var(--ink-faint);
    min-width:26px;
  }
  .clauseItem .t{
    font-size:12.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .clauseItem:hover{background:var(--accent-soft); color:var(--ink);}
  .clauseItem.active{
    background:var(--accent-soft);
    border-left-color:var(--accent);
    color:var(--ink);
  }
  .clauseItem.active .n{color:var(--accent);}

  /* ---------- Main pane ---------- */
  .main{
    overflow-y:auto;
    min-height:0;
    padding:28px 34px 80px;
  }
  .mainInner{ max-width:680px; margin:0 auto; }

  .crumb{
    font-size:12px; color:var(--ink-faint);
    margin-bottom:14px;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .crumb a{color:var(--ink-soft); text-decoration:none;}
  .crumb a:hover{color:var(--accent); text-decoration:underline;}

  .clauseHead{
    display:flex; align-items:flex-start; gap:14px;
    padding-bottom:16px; margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .clauseHead .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:600;
    color:var(--accent-ink);
    background:var(--accent);
    padding:5px 10px;
    border-radius:var(--radius-s);
    white-space:nowrap;
    margin-top:2px;
  }
  .clauseHead h2{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:23px; font-weight:600;
    margin:0 0 6px;
    text-wrap:balance;
  }
  .clauseMeta{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .pill{
    font-size:10.5px; letter-spacing:.03em;
    padding:2px 8px;
    border-radius:99px;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
  }
  .pill.amend{
    color:var(--amend);
    background:var(--amend-soft);
    border-color:transparent;
    font-family:'IBM Plex Mono',monospace;
  }
  .copyBtn{
    margin-left:auto;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:11.5px;
    padding:5px 10px;
    border-radius:var(--radius-s);
    display:flex; align-items:center; gap:5px;
    flex:0 0 auto;
    align-self:flex-start;
  }
  .copyBtn:hover{color:var(--ink); border-color:var(--ink-faint);}

  .clauseBody{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:16px;
    line-height:1.75;
    color:var(--ink);
  }
  .clauseBody p{ margin:0 0 14px; text-wrap:pretty; }
  .clauseBody mark{
    background:var(--amend-soft);
    color:var(--ink);
    border-radius:2px;
    padding:0 1px;
  }
  .clauseBody .amendTag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--amend);
    background:var(--amend-soft);
    padding:1px 7px;
    border-radius:99px;
    margin:0 0 14px;
  }

  .navFoot{
    display:flex; justify-content:space-between; gap:12px;
    margin-top:32px; padding-top:18px;
    border-top:1px solid var(--line);
  }
  .navFoot button{
    display:flex; flex-direction:column; gap:2px;
    border:1px solid var(--line);
    background:var(--paper);
    padding:9px 13px;
    border-radius:var(--radius-m);
    max-width:46%;
  }
  .navFoot button:hover{border-color:var(--accent); background:var(--accent-soft);}
  .navFoot .lbl{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}
  .navFoot .val{font-size:12.5px; color:var(--ink); text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .navFoot .next{align-items:flex-end;}
  .navFoot .next .val{text-align:right;}

  /* ---------- Welcome / results ---------- */
  .welcome{ max-width:640px; }
  .welcome h2{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:25px; margin:0 0 10px; text-wrap:balance;
  }
  .welcome p{ color:var(--ink-soft); margin:0 0 14px; max-width:60ch; }
  .statRow{
    display:flex; gap:10px; flex-wrap:wrap;
    margin:18px 0 26px;
  }
  .statCard{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:var(--radius-m);
    padding:12px 16px;
    min-width:110px;
  }
  .statCard .figure{
    font-family:'IBM Plex Mono',monospace;
    font-size:22px; font-weight:600; color:var(--accent);
  }
  .statCard .cap{ font-size:11px; color:var(--ink-faint); letter-spacing:.03em; }
  .exampleRow{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;
  }
  .exampleChip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    padding:5px 10px;
    border-radius:99px;
    color:var(--ink-soft);
  }
  .exampleChip:hover{border-color:var(--accent); color:var(--accent);}

  .resultsHead{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px; flex-wrap:wrap; gap:6px;
  }
  .resultsHead h2{ font-family:'IBM Plex Serif',Georgia,serif; font-size:19px; margin:0; }
  .resultsHead .count{ font-size:12px; color:var(--ink-faint); }
  .resultCard{
    display:block;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:var(--radius-m);
    padding:13px 16px;
    margin-bottom:10px;
    color:var(--ink);
    text-decoration:none;
  }
  .resultCard:hover{ border-color:var(--accent); box-shadow:var(--shadow); }
  .resultCard .rhead{ display:flex; align-items:baseline; gap:9px; margin-bottom:4px; }
  .resultCard .rnum{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--accent); font-weight:600; }
  .resultCard .rtitle{ font-size:14.5px; font-weight:600; font-family:'IBM Plex Serif',Georgia,serif; }
  .resultCard .rpart{ font-size:11px; color:var(--ink-faint); margin-left:auto; white-space:nowrap; }
  .resultCard .rsnippet{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; }
  .resultCard .rsnippet mark{ background:var(--amend-soft); color:var(--ink); border-radius:2px; }
  .noResults{ color:var(--ink-faint); font-size:13.5px; padding:20px 0; }

  .menuBtn{
    display:none;
    border:1px solid var(--line-strong);
    background:var(--paper);
    width:32px; height:32px; border-radius:var(--radius-s);
    align-items:center; justify-content:center;
    color:var(--ink-soft);
    z-index:1;
  }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="menuBtn" id="menuBtn" aria-label="Open by-law index" title="Open index">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <span class="mark">UBBL 1984</span>
      <div>
        <h1>UBBL Navigator</h1>
        <div class="sub">Uniform Building By&#8209;Laws &middot; consolidated to Amendment 2021</div>
      </div>
    </div>
    <div class="searchwrap">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.2" stroke="currentColor" stroke-width="1.5"/><path d="M17 17l-3.6-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search by keyword &mdash; e.g. staircase, refuse chute, fire lift&hellip;" autocomplete="off" spellcheck="false">
      <button id="searchClear" aria-label="Clear search" title="Clear search">&times;</button>
    </div>
    <form class="jumpform" id="jumpForm">
      <label for="jumpInput">Go to clause</label>
      <input id="jumpInput" type="text" placeholder="e.g. 34A" autocomplete="off" spellcheck="false">
      <button id="jumpGo" type="submit">Open</button>
    </form>
    <button class="themeToggle" id="themeToggle" aria-label="Toggle color theme" title="Toggle theme">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 2a8 8 0 100 16 6.5 6.5 0 010-16z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="body">
    <div class="sidebarScrim" id="scrim"></div>
    <nav class="sidebar" id="sidebar" aria-label="By-law index"></nav>
    <main class="main" id="main">
      <div class="mainInner" id="mainInner"></div>
    </main>
  </div>
</div>

<script id="ubbl-data" type="application/json">{"generatedFrom":"UBBL 2021.pdf (Uniform Building By-Laws 1984, incorporating Amendment 2021)","bylaws":[{"id":"bylaw-1","kind":"bylaw","num":"1","title":"Citation.","part":"I","partTitle":"PRELIMINARY","amendments":["2021"],"content":"These by-laws may be cited as the Uniform Building (Amendment) By-Laws 2021.\n[Amendment 2021]"},{"id":"bylaw-2","kind":"bylaw","num":"2","title":"Interpretation.","part":"I","partTitle":"PRELIMINARY","amendments":["1991","1999","2007","2011","2012","2021"],"content":"In these by-laws, unless the context otherwise requires--\n“Act” means the Street, Drainage and Building Act 1974;\n“advertisement hoarding” means any frame, hoarding, board, wall, bar, pillar, post, wire, or any\ncombination of these, or any erection of any kind, or any surface or space used for the display of trade,\nbusiness or professional advertisements;\n“aggregate” means any material other than cement and water used in the making of concrete which\ndoes not contain additions or admixtures;\n“alterations” include additions and extensions;\n“approved” means approved by the local authority;\n“approved plan” means a plan for a building approved by the local authority in accordance with these\nBy-laws;\n“architect” means a person who is registered as an architect under any law relating to the registration\nof architects and who under the law is allowed to practise or carry on business as an architect;\n[Amendment 2007]\n[Amendment 2021]\n“ASHRAE” means the American Society of Heating, Refrigerating and Air Conditioning Engineers, Inc.;\n[Amendment 2021]\n“balcony” means any stage, platform, oriel window or other similar structure projecting outwards from\nthe wall of a building and supported by brackets or cantilevered;\n“base” in relation to a wall or pier means--\n(a) the underside of the course immediately above the footings, if any, or in the case of wall carried\nby a beam, above the beam; and\n(b) in any other case the bottom of such wall or pier;\n“basement” means any storey or storeys of a building which is or are at a level lower than the ground\nstorey;\n“building draughtsman” means any building draughtsman who is registered under the relevant Act;\n[Amendment 2007]\n“building line” means the line prescribed by either the competent planning authority or the local authority\nbeyond which no part of a building may project, except as otherwise permitted by these By-laws;\n“building plans” mean plans that include site plans, key plans, floor plans, sections and elevations of\nbuilding, and shall be as stipulated in by-laws 8, 9 and 10;\n[Amendment 2007]\n[Amendment 2021]\n“BS” means the latest published edition of the British Standard Specification;\n“BSCP” means the latest published edition of the British Standard Code of Practice;\n“building draughtsman” Deleted.\n[Amendment 2007]\n[Amendment 2021]\n“ceiling” means the covering to the underside of floor joists or ceiling joists or floor slabs excluding\nin all cases any supporting beams, and where no such covering exists means the underside of floor\njoists or roof cellars or ties excluding any supporting beams;\n“certificate of completion and compliance “ means a certificate issued under by-law 25;\n[Amendment 1999]\n[Amendment 2007]\n“column”, in relation to structural steel, timber or reinforced concrete, means any part of construction\nwhich will by its resistance to compression in the direction of its length and to the bending actions\ninduced by such compression, support and transmit loading;\n“communication” means any service provided pursuant to the requirements specified by the Malaysian\nCommunications and Multimedia Commission;\n[Amendment 2021]\n“construction project manager” means any employee of a contractor possessing the acceptable level of\nskill, knowledge and experience as may be determined and who is assigned to a construction site or\nany other such place to organise, plan, control and coordinate the construction works from an inception\nto completion and registered with the Lembaga Pembangunan Industri Pembinaan Malaysia;\n[Amendment 2021]\n“construction site supervisor” means any employee of a contractor possessing the acceptable level of skill,\nknowledge and experience who is assigned to a construction site or any other such place to supervise\nthe construction works and registered with the Lembaga Pembangunan Industri Pembinaan Malaysia;\n[Amendment 2021]\n“contractor” means a person who carries out or completes or undertakes to carry out or complete any\nconstruction works and registered with the Lembaga Pembangunan Industri Pembinaan Malaysia;\n[Amendment 2021]\n“dead load” Deleted.\n[Amendment 2012]\n“depth”, in respect of a building, means the measured distance between the front line of the building\nand the back line of the rear main wall which separates the main building from the open space;\n“detached building” means any building not attached to any other buildings;\n“disabled person” means a person with a physical impairment, hearing impairment or sight impairment\nwhich affects his mobility or his use of buildings as referred to under by-law 34A;\n[Amendment 1991]\n[Amendment 2021]\n“engineer” means a person who is registered as a professional engineer under any law relating to the\nregistration of engineers and who under the law is allowed to practise or carry on the business as an\nengineer;\n[Amendment 2007]\n[Amendment 2021]\n“external wall” means an outer wall of a building not being a party wall notwithstanding that it may\nimmediately adjoin a wall of another building;\n“factory” means any building or part thereof designed, adapted or used for--\n(a) the making of any article or part of any article, commodity or product; or\n(b) the altering, repairing, ornamenting, finishing, cleaning, washing or the breaking up or demolition\nof any article, commodity or product; or\n(c) the adapting for sale or assembly of any article, commodity or product; and\n(d) any other building as defined in the Factories and Machinery Act 1967;\n“fire wall” means any wall, not being an external wall, of materials having the fire resistance as\nrequired under Part VII, of these by-laws and either used or constructed to be used for the separation\nof adjoining buildings or the separation of parts of a building in such manner as to prevent or reduce\nthe spreading of fire from one building to another or from one part of a building to another part of that\nbuilding and includes a proscenium wall, compartment wall, separating wall and a protecting structure;\n[Amendment 2021]\n“flat” means any separate dwelling used or constructed or adapted to be used wholly or principally\nfor human habitation for a single family, where the kitchen, lavatory and bathroom or water closet are\ncontained within the separate dwelling and that dwelling is contained in a building comprising two or\nmore such dwellings joined vertically;\n“flat roof” means any roof having no inclination or having an inclination of not more than seven and\none-half degrees with the horizontal;\n“flood level” means such flood level as may be prescribed for any area by the local authority;\n“floor” includes any horizontal platform forming the surface of any storey and any joist, board, timber,\nstone, concrete, steel or other substance connected with or forming part of such platform;\n“footing” means the construction whereby the weight of the structure of building is transferred from\nthe base structure to the foundations;\n“foundation” means a system or arrangement of foundation units such as footing, raft or pile through\nwhich the loads from a building or structure are transferred to the supporting soil or rock;\n“garage” for purpose of these By-laws, means a building or part thereof designed, adapted or used for\nthe housing of motor vehicles;\n“godown” means any building or part thereof designed, adapted or used for storage purposes but does\nnot include any garage ancillary to a residential building;\n“ground storey” means the lowest storey of a building to which there is an entrance from the outside\non or above the level of the ground at the front of the building;\n“habitable room” means any room not less than 6.5 square metres in area but does not include any\nbathroom, water closet, open verandah, terrace or garage;\n“hardwood timber” for the purpose of these by-laws means any timber specified by the Malaysian\nTimber Industry Board and shall be in accordance with MS 1714 – Specification for visual strength\ngrading of tropical hardwood timber;\n[Amendment 2021]\n“headroom” means the clear vertical distance between the finished floor level and the soffit of the\nlowest projecting member or surface above that point;\n“height” in relation to --\n(a) a room means the vertical distance measured between the finished floor level and the underside\nof the ceiling excluding the thickness of the plaster;\n(b) any storey means the vertical distance measured between the upper surfaces of its floor to the\nupper surface of the floor immediately above it;\n(c) a wall means the vertical distance measured from the base of the wall to its highest part or,\nin the case of a gable, to half the height of the gable;\n“hospital” means any building or part thereof designed, adapted or used for the care, accommodation\nor treatment of the sick, infirm, aged, convalescent or pregnant;\n“hotel” means any building specifically designed and constructed or substantially adapted to be used\nto accommodate persons for the purpose of gain or profit, with or without arrangements for communal\nfeeding, and includes a boarding house, lodging house or guest house;\n“imposed load” means the load assumed to be produced by the intended occupancy or use including\ndistributed, concentrated impact and inertia loads but excluding wind loads;\n“inspector of works” means a person who is registered as an inspector of works under the Architects\nAct 1967 [Act 117] or Registration of Engineers Act 1967 [Act 138];\n[Amendment 2021]\n“lateral support”, in relation to a wall or pier, means such support in the direction of the thickness,\nlength or breadth of the wall or pier which prevents movement thereof at the level and in line of\ndirection of such support;\n“layout plan” means a plan approved by the competent planning authority;\n“lintel” means a beam supporting walling over an opening or recess;\n“load bearing”, in relation to any part of a building and its foundations, means that part of the building\nwhich bears a load other than that due to its own weight and to wind pressure on its own surface;\n“low lying land” means any land of which the surface is below flood level or which is so situated that\nit cannot at all times be efficiently drained by gravitation into an existing public surface water drain\nor water course;\n“mesh” in relation to the measurement of materials, means the mesh of a sieve complying with BS\n410--Test Sieves;\n“mezzanine floor” means any floor interposed between the main floors of a building and includes any\nplatform or landing of greater than 2.5 metres width;\n“MS” means the latest published edition of the Malaysian Standard;\n“MS EN” means the latest published edition of the Malaysian Standard which is identical to the\nEuropean Standard;\n[Amendment 2012]\n“MSCP” means the latest published edition of the Malaysian Standard Code of Practice;\n“panel wall” means a non-load bearing wall set within a structural frame;\n“partition” means a non-load bearing wall of any internal wall, not being a party wall, compartment\nwall, separating wall or an external wall;\n[Amendment 2021]\n“party wall” means a wall forming part of a building and used or constructed to be used for separation\nof adjoining buildings belonging to different owners or occupied or constructed or adapted to be occupied\nby different persons either constructed over or abutting a common boundary;\n“permanent load” means that static weight of all walls, partitions, floors, roofs and finishes, including\nall other permanent construction;\n[Amendment 2012]\n“pitched roof” means a roof having an inclination of more than seven and a-half degrees with the\nhorizontal;\n“prestressed concrete” means concrete in which predetermined stresses are induced to counteract the\nstresses due to permanent and superimposed loading for the purpose of eliminating or decreasing the\ntensile stresses due to bending and sheer;\n[Amendment 2021]\n“principal submitting person” means a qualified person who submits building plans to the local authority\nfor approval in accordance with these By-Laws and includes any other qualified person who takes over\nthe duties and responsibilities of or acts for the first-mentioned qualified person in accordance with\nby-law 7;\n[Amendment 2007]\n“qualified person” means an architect, engineer or building draughtsman;\n[Amendment 2007]\n[Amendment 2021]\n“registered building draughtsman” Deleted.\n[Amendment 2007]\n“residential building” means a building or part thereof designed, adapted or used for human habitation;\n“room” means any portion of a building enclosed by walls or partitions;\n“school” means any building or part thereof designed, adapted or used for the dissemination of knowledge\nand includes a crèche;\n“self-closing door” means a door fitted with a device which is free from any means of holding it in an\nopen position and which will close automatically unless held open by other approved means;\n[Amendment 2021]\n“semi-detached building” means any building designed to be built as one pair having a party wall as one of its walls;\n“shophouse” means any building, part of which is designed, adapted or used for business purposes;\n“singly built detached house” Deleted.\n[Amendment 1999]\n[Amendment 2007]\n“site supervisory staff” means full time staff engaged for a particular project and report to the project\narchitect or engineer, and may constitute inspector of works or registered engineer or registered building\ndraughtsman or graduate architect or architect for the purpose of supervising all construction works at\nsite on behalf of the principal submitting person or submitting person;\n[Amendment 2021]\n“smoke stop door” Deleted.\n[Amendment 2021]\n“SPAH” means a rainwater harvesting and utilisation system where the rainwater is collected from a\nroof, conveyed to a rainwater tank and stored for use;\n[Amendment 2011]\n[Amendment 2021]\n“storey” means the space between the upper surface of every floor and the surface of the floor next\nabove it, or if there be no such floor then the underside of the tie or collar beam of the roof or other\ncovering or if there be neither tie nor collar beam then the level of half the vertical height of the\nunderside of the rafters or other support of the roof;\n“submitting person” means a qualified person who submits plans, other than building plans, to the\nlocal authority or relevant statutory authority in accordance with these By-Laws and includes any\nother qualified person who takes over the duties and responsibilities of or acts for the first mentioned\nqualified person in accordance with by-law 7;\n[Amendment 2007]\n“swimming pool” means any pool or bath for the purpose of swimming;\n“technical conditions” means conditions pertaining to health and safety issues relating to buildings and\nessential services serving the buildings;\n[Amendment 2007]\n“temporary building” includes any building constructed wholly or in part of materials which are, in\nthe absence of special care, liable to rapid deterioration, or are otherwise unsuitable for use in the\nconstruction of permanent buildings, and may include any house or building the erection of which\nis permitted under licence issued by the local authority for a limited period to be specified upon the\nexpiration of which the building shall be demolished;\n“terrace house” means any residential building designed as a single dwelling unit and forming part of\na row or terrace of not less than three such residential buildings;\n“verandah-way” means a covered footway fronting a street;\n“wind load” means all loads due to the effect of wind pressure or suction.\n[Amendment 2012]"},{"id":"bylaw-2A","kind":"bylaw","num":"2A","title":"Application of this Part.","part":"IA","partTitle":"DEMOLITION OF BUILDINGS","amendments":["2012"],"content":"This Part shall apply to the demolition of a building before reconstruction thereof.\n[Amendment 2012]"},{"id":"bylaw-2B","kind":"bylaw","num":"2B","title":"Preparation and submission of demolition plan, etc.","part":"IA","partTitle":"DEMOLITION OF BUILDINGS","amendments":["2012","2021"],"content":"[Amendment 2012]\n(1) Before the demolition is commenced, one copy of a detailed demolition plan together with a\ncopy of the stability report prepared in accordance with MS 2318 shall be submitted to the local\nauthority.\n(2) The detailed demolition plan shall bear a certificate by the submitting person in Form A of the\nSecond Schedule to the effect that the details shall be in accordance with MS 2318 and that the\nsubmitting person shall accept full responsibility for the proper execution of the demolition works.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-2C","kind":"bylaw","num":"2C","title":"Power of local authority to reject demolition plan and stability report.","part":"IA","partTitle":"DEMOLITION OF BUILDINGS","amendments":["2012","2021"],"content":"[Amendment 2012]\nNotwithstanding paragraph (2) of by-law 2B, the local authority may examine and in so doing may\nreject any demolition plan or stability report which is not in accordance with MS 2318 and if it rejects\nthe plan or report, it may require the submitting person to resubmit a new demolition plan or stability\nreport in respect of the rejected portion.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-2D","kind":"bylaw","num":"2D","title":"Notice of commencement or resumption of building operations.","part":"IA","partTitle":"DEMOLITION OF BUILDINGS","amendments":["2012","2021"],"content":"[Amendment 2012]\n(1) Notice of the intention to commence or resume the demolition of a building required under\nsubsection 70(9) of the Act shall be made in Form B of the Second Schedule and shall include\nparticulars of the intended work.\n(2) If the work is not commenced or resumed on the date given in such notice, a further notice in\nForm B of the Second Schedule shall be given before the works commence or resume.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-2E","kind":"bylaw","num":"2E","title":"Methods of demolition.","part":"IA","partTitle":"DEMOLITION OF BUILDINGS","amendments":["2012","2021"],"content":"[Amendment 2012]\nThe demolition works shall conform to MS 2318.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-2F","kind":"bylaw","num":"2F","title":"Duties of submitting person.","part":"IA","partTitle":"DEMOLITION OF BUILDINGS","amendments":["2012","2021"],"content":"[Amendment 2012]\n(1) The submitting person certifying the plan under paragraph (2) of by-law 2B shall be responsible\nfor the proper execution of the demolition works and shall continue to be so responsible until the\ncompletion of the demolition works unless–\n(a) with the agreement of the local authority, another submitting person has been appointed\nto take over; or\n(b) the local authority agrees to accept his withdrawal or replacement at the request of the\nowner provided that the demolition works has not been commenced.\n(2) Where the local authority agrees to accept the submitting person’s withdrawal or replacement under\nsubparagraph (1)(b), the demolition works shall not commence until another submitting person\nhas been appointed to take over.\n(3) Where any submitting person who has submitted the demolition plan has died or become bankrupt\nor cannot be found or has been deregistered from the register or for any other reason ceased to\npractise, the owner or occupier shall as soon as practicable appoint another submitting person to\nact for him and to submit adequate evidence to the local authority of the circumstances.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-2G","kind":"bylaw","num":"2G","title":"Exemption from this Part.","part":"IA","partTitle":"DEMOLITION OF BUILDINGS","amendments":["2012","2021"],"content":"[Amendment 2012]\nThe local authority may if it deems fit exempt any minor demolition works from the requirements of\nthis Part.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-3","kind":"bylaw","num":"3","title":"Submission of plans for approval.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007","2012"],"content":"(1) All plans for buildings submitted to the local authority for approval in addition to the requirements\nof section 70 of the Act shall--\n(a) be deposited at the office of the local authority together with the fees prescribed for the\nsubmission of such plans in accordance with the First Schedule to these By-laws;\n(b) bear upon them a statement showing for what purpose the building for which the plans\nare submitted is to be erected and used;\n(c) bear the certification of the principal submitting persons or submitting persons on these\nplans together with Form A as set out in the Second Schedule to these By-laws for which\nthey are respectively responsible; and\n[Amendment 2007]\n(d) Deleted.\n[Amendment 2012]\n(2) Every plan, drawing or calculation in respect of any building shall be submitted by a principal\nsubmitting person or submitting person.\n[Amendment 2007]"},{"id":"bylaw-4","kind":"bylaw","num":"4","title":"Return of plan.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"(1) A local authority may if it is of the view that any plan, drawing or calculation is beyond the\ncompetence of such principal submitting person or submitting person submitting the same, return\nsuch plan, drawing or calculation.\n[Amendment 2007]\n(2) A local authority shall accept any returned plan, drawing or calculation if the same were re-submitted\ntogether with a certificate from the relevant competent authority responsible for registering such\nprincipal submitting person or submitting person, certifying that such plan, drawing or calculation\nis within the competence of such principal submitting person or submitting person submitting the\nsame.\n[Amendment 2007]"},{"id":"bylaw-5","kind":"bylaw","num":"5","title":"Supervision of work.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007","2012","2021"],"content":"(1) Where under these By-laws any plan, drawing or calculation in relation to any building is required\nto be submitted by a principal submitting person or submitting person, no erection or continued\nerection of that building shall take place unless that principal submitting person or submitting\nperson or any person duly authorised by him undertakes the supervision of the erection and the\nsetting out, where applicable, of that building.\n[Amendment 2007]\n[Amendment 2012]\n(2) The erection of a building shall be carried out under the fulltime supervision of a construction\nproject manager and assisted by a construction site supervisor who are accredited and certified\nby the Lembaga Pembangunan Industri Pembinaan Malaysia.\n[Amendment 2012]\n[Amendment 2021]\n(3) A site supervisory staff shall be appointed to supervise the works of the contractor to ensure\ncompliance with site safety measures, erection qualities, plans and specifications of the building.\n[Amendment 2021]"},{"id":"bylaw-6","kind":"bylaw","num":"6","title":"Plans to be signed.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"(1) All plans submitted shall be signed by the principal submitting person or submitting person and\nby the owner or his agent and shall bear the full address of the owner.\n[Amendment 2007]\n(2) The local authority may, if satisfied that the owner of the premises has refused to or has failed\nto execute any work which is required under the Act to be executed by him, direct the owner of\nthe premises in writing to execute such work."},{"id":"bylaw-7","kind":"bylaw","num":"7","title":"Withdrawal or change of principal submitting person or submitting person.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"[Amendment 2007]\n(1) The principal submitting person or submitting person submitting the plans shall be responsible for\nthe proper execution of the works and shall continue to be so responsible until the completion of\nthe works unless--\n(a) with the agreement of the local authority another principal submitting or submitting person\nis appointed to take over; or\n[Amendment 2007]\n(b) the local authority agrees to accept his withdrawal or replacement at the request of the\nowner provided that the erection of a building has not commenced.\n(2) Where the local authority agrees to accept a principal submitting person’s or submitting person’s\nwithdrawal or replacement under paragraph (1) (b) of by-law 7 the works shall not commence\nuntil another principal submitting person or submitting person is appointed to take over.\n[Amendment 2007]\n(3) Where any principal submitting person or submitting person who has submitted any plan, drawing\nor calculation in respect of any building has died or become bankrupt or cannot be found or has\nbeen deregistered from the register or for any other reason ceased to practise, the owner or occupier\nshall as soon as practicable appoint another principal submitting person or submitting person to\nact for him and to submit adequate evidence to the local authority of the circumstances.\n[Amendment 2007]"},{"id":"bylaw-8","kind":"bylaw","num":"8","title":"Plans to be deposited.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2012","2021"],"content":"[Amendment 2021]\n(1) All building plans shall be deposited to and in the manner as determined by the local authority.\n[Amendment 2021]\n(2) One set of the plans shall be retained by the local authority and the other set shall be returned\nafter approval.\n[Amendment 2012]\n[Amendment 2021]\n(2A) Any plan shall be deemed to have been deposited and furnished at the time the plan has been\nreceived by the local authority.\n[Amendment 2021]\n(3) If the plans are disapproved, one set of such plans shall be returned with a statement explaining\nthe reasons for disapproval.\n(4) Deleted.\n[Amendment 2021]"},{"id":"bylaw-9","kind":"bylaw","num":"9","title":"Scale of plans.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"(1) All plans shall be drawn to the following scales--\n(a) site plans not less than 1 : 1000;\n(b) key or location plans any convenient scale;\n(c) all other general building plans not less than 1 : 100 except in special cases\nwhere the size of the building renders drawings\nto this scale to be impracticable to accommodate\nwithin the limitations of paper sizes or when the\ndrawings are of unwieldy dimensions, the local\nauthority may use its discretion to permit plans\nto be submitted to a smaller scale but in no case\nshall the scale be less than 1 : 200;\n(d) sketch plans for approval in principle not less than 1 : 200.\n(2) Notwithstanding paragraph (1), all plans may be drawn in International System of Units."},{"id":"bylaw-10","kind":"bylaw","num":"10","title":"Plans required.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007","2011","2012","2021"],"content":"(1) All building plans in respect of any building shall, unless inapplicable, contain the following:\n[Amendment 2007]\n(a) a site plan showing--\n(i) the site of the proposed building lot together with the number of the lot and the\nsection number;\n(ii) the means of access to the site from the street and the name of the street;\n(iii) the distance from the centre and side of roadway distinctly figured on one of such\nplans;\n(iv) where required by the local authority the dimensions and area of the lot;\n[Amendment 2012]\n(v) the complete lines of surface water and foul water drainage and the point of discharge\nof the proposed drains;\n(vi) the scale, north point and the numbers of adjoining lots or buildings;\n(vii) the dimensions of clearances between the proposed building and the boundaries;\n(viii) all lines of proposed adjustments of land or buildings for street, river or drainage\nimprovements and such like where applicable showing the width of such new street\nor proposed new street and its connection with the nearest public street;\n(ix) existing and proposed ground level of the site;\n[Amendment 2011]\n(x) the location of the rainwater tank;\n(xi) SPAH elements such as piping systems, rainwater tanks, water pumps and other related\nequipment (as required to install SPAH) shall be clearly shown on the plan for the\nfollowing category of buildings:\n(A) in respect of residential buildings, SPAH shall be required to be installed\nonly for bungalows and semi-detached houses with roof areas equivalent to\nor more than 100 square metres; and\n(B) all detached buildings with roof areas equivalent to or more than 100 square\nmetres.\n[Amendment 2011]\n[Amendment 2021]\n(b) a floor plan of each floor except when other floors are repetitive or are identical floors,\ncontaining the following information--\n(i) figured dimensions of the lengths and breadths of the building and rooms and thickness\nof walls thereof;\n(ii) figured dimensions of all door and window openings, the clear daylight area of air\nwells, back areas and open spaces of the building;\n(iii) figured dimensions between walls, piers and stanchions on the foundation plan of the\nbuilding;\n(iv) lines of permanent drainage of the site with arrows indicating the direction of flow,\nthe drains into which they will discharge and their sizes; and\n(v) the names and uses of rooms.\n(c) cross, longitudinal and other sections to clearly delineate the construction of the building\nand showing--\n(i) the existing ground level and proposed new ground level if the level of the site is to\nbe raised or lowered;\n(ii) the level of street, roadside drain and verandah-way (if the building abuts a street);\n(iii) the width and depth of foundations and thickness of walls, partitions and floors\nthereof;\n(iv) the height of storeys, staircases, doors, windows and ventilating openings thereof;\n(v) the sizes, position and direction of floor joists and beams and the construction of the\nroof thereof; and\n(vi) the materials to be used in the construction of the structure.\n(d) front, rear and side elevations showing--\n(i) the levels of adjoining footways, verandah-ways, roads and the levels of the proposed\ncounterparts;\n(ii) part elevations of existing adjoining buildings showing their floor levels, main coping,\nparapets and verandah heights; and\n(iii) the materials proposed for the walls, windows and roof, if applicable and visible.\n(2) The principal submitting person or owner or occupier, as the case may be shall provide the local\nauthority with such further information as the local authority may require.\n[Amendment 2007]\n(3) All plans shall be clearly drawn in black with differences of material shown in distinct colour\nand all existing structures in neutral tints.\n[Amendment 2021]"},{"id":"bylaw-11","kind":"bylaw","num":"11","title":"Exemption from by-law 10.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"The local authority may if it deems fit exempt any person from any or all of the requirements of\nparagraph (1) of by-law 10."},{"id":"bylaw-12","kind":"bylaw","num":"12","title":"Sketch plans for approval in principle.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2021"],"content":"(1) Notwithstanding the provisions of by-laws 8 and 10 when the consideration of the local authority\nis desired for approval in principle of a building, tentative sketch plans accompanied by a brief\nreport sufficient to show the character and standard of the building may be submitted subject to\nthe payment of the fees as prescribed in the First Schedule to these By-laws.\n[Amendment 2021]\n(2) When a building has been approved in principle, plans in accordance with by-laws 3 to 10 and\n14 to 16 shall be submitted and approved before erection of the building approved in principle\nmay be commenced."},{"id":"bylaw-13","kind":"bylaw","num":"13","title":"Special permission to commence building operations.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"(1) The local authority may, in writing grant special permission to commence building operations\nprovided that such commencement will not infringe the provisions of the Act or these By-laws.\n(2) The granting of any permission under paragraph (1) of by-law 13 shall not deprive the local\nauthority of its power to give written directions in respect of such building."},{"id":"bylaw-14","kind":"bylaw","num":"14","title":"Plans of alterations.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"(1) In plans submitted for additions or alterations, including a subdivision of rooms, to a building,\nthe parts, if any, of the building to be removed shall be shown in dotted lines and new work shall\nbe either in red or in black fully coloured.\n(2) All existing surface water and foul water drains, stairs, windows and doors and all openings for\nlight and ventilation of the building shall be shown on such plans."},{"id":"bylaw-15","kind":"bylaw","num":"15","title":"Specifications.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"If so required by the local authority plans submitted for approval shall be accompanied by a specification\nof all materials proposed to be used."},{"id":"bylaw-16","kind":"bylaw","num":"16","title":"Details and calculations of structural plans.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007","2012","2021"],"content":"(1) One copy of the detailed structural plans of the proposed building together with the structural\ncalculations for the same shall be submitted before the commencement of construction.\n[Amendment 2021]\n(2) The detailed structural plans shall bear a certificate by the submitting person as in Form A as set\nout in the Second Schedule to these By-laws to the effect that the details are in accordance with\nthese By-laws and that the submitting person accepts full responsibility.\n[Amendment 2007]\n[Amendment 2012]\n(3) All structural plans shall be clearly marked to indicate the imposed loads for which each floor\nsystem or each part has been designed."},{"id":"bylaw-17","kind":"bylaw","num":"17","title":"Power of local authority to reject structural plans and calculations.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"Notwithstanding paragraph (2) by-law 16 the local authority may examine and in so doing may reject\nany structural plans or calculations which are not in accordance with these By-laws and if it rejects\nsuch plans or calculations it may require such submitting person to resubmit new structural plans or\ncalculations in respect of the rejected portion.\n[Amendment 2007]"},{"id":"bylaw-18","kind":"bylaw","num":"18","title":"Permits.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"(1) Sketch plans may be submitted for minor erections, minor alterations and additions in lieu of\napproved plans and permits may be issued as authority to carry out such works if they comply\nwith the requirements of these By-laws, provided that if in the opinion of the local authority the\nworks involved require the submission of normal building plans, such plans shall be submitted in\naccordance with these By-laws.\n(2) Permits may be issued on such terms and conditions as the local authority thinks fit for the erection\nof any fence which encroaches on a footway."},{"id":"bylaw-19","kind":"bylaw","num":"19","title":"Temporary permits.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"(1) A temporary permit for a limited period may be issued by the local authority for the following\npurpose--\n(a) the erection of a shed for shows or place of worship;\n(b) the erection of a builders’ working shed or a store or other shed to be used in connection\nwith building works;\n(c) the depositing of building materials on streets;\n(d) the erection of scaffolding on a street;\n(e) the erection of staging, framework, platform or superstructure of any kind on a roof abutting\na street; and\n(f) the erection of hoarding on streets in accordance with by-law 20.\n(2) a temporary permit may be issued at the discretion of the local authority for the erection of a\ntemporary building and shall be subject to all or some of the conditions as set out in the First\nSchedule to these By-laws.\n(3) Plans or sketch plans in accordance with the requirement of the local authority shall be submitted\nfor temporary permits under this by-law."},{"id":"bylaw-20","kind":"bylaw","num":"20","title":"Advertisement hoardings.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"(1) The erection of hoardings or any framing for the display of advertisements or sign-boards shall\nbe subject to an annual temporary permit issued at the discretion of and subject to any conditions\nthat may be imposed by the local authority.\n(2) Plans or sketch plans of such hoardings or framings shall be submitted in accordance with the\nrequirements of the local authority.\n(3) The plans must be certified by the submitting person to the effect that the proposed hoarding can\nbe safely supported by the structure onto which it is to be constructed and that he accepts full\nresponsibility.\n[Amendment 2007]"},{"id":"bylaw-21","kind":"bylaw","num":"21","title":"Materials not to be deposited in a street without permission.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"(1) No person shall deposit any building materials in any street without a temporary permit issued\nunder by-law 19.\n(2) The fee for such permit shall be that prescribed in the First Schedule to these By-laws.\n(3) The person to whom such permit is issued shall at his own expense cause such materials to be\nsufficiently fenced and enclosed until the materials are removed or otherwise made secure to the\nsatisfaction of the local authority.\n(4) Such materials shall be suitably lighted during the hours of darkness and a watchman shall be\nemployed to ensure that this is done."},{"id":"bylaw-22","kind":"bylaw","num":"22","title":"Notice of commencement or resumption of building operations.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":[],"content":"(1) Notice of the intention to commence or resume the erection of a building required under subsection\n(9) of section 70 of the Act shall be made in Form B as set out in the Second Schedule to these\nBy-laws and shall include particulars of the intended work.\n(2) If the work is not commenced or resumed on the date given in such notice, a further notice in\nForm B as set out in the Second Schedule to these By-laws shall be given before the work may\nbe commenced or resumed."},{"id":"bylaw-23","kind":"bylaw","num":"23","title":"Notice of completion of setting out. Deleted.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"[Amendment 2007]"},{"id":"bylaw-24","kind":"bylaw","num":"24","title":"Notice of completion of excavation for foundation. Deleted.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"[Amendment 2007]"},{"id":"bylaw-25","kind":"bylaw","num":"25","title":"Certificate of completion and compliance.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007","2011","2021"],"content":"[Amendment 2007]\n(1) A certificate of completion and compliance in Form F as set out in the Second Schedule shall be\nissued by the principal submitting person –\n[Amendment 2007]\n(a) when all the technical conditions as imposed by the local authority have been duly complied\nwith;\n[Amendment 2007]\n(b) when Forms G1 to G21 in respect of certifications as set out in the Second Schedule have\nbeen duly certified and received by him;\n[Amendment 2007]\n[Amendment 2021]\n(c) when all the essential services, including an access road, landscape, car park, drain, sanitary,\nwater, electricity installation, communication, fire hydrant, sewerage and refuse disposal\nrequirements, and fire lift where required, have been provided; and\n[Amendment 2007]\n[Amendment 2011]\n[Amendment 2021]\n(d) when he certifies in Form F that he has supervised the erection and completion of the\nbuilding and that to the best of his knowledge and belief the building has been constructed\nand completed in accordance with the Act, these By-Laws and the approved plans.\n[Amendment 2007]\n(2) Upon the issuance of the certificate of completion and compliance, the principal submitting person\nshall accept full responsibility for the issuance of the certificate of completion and compliance\nand he certifies that the building is safe and fit for occupation.\n[Amendment 2007]\n[Amendment 2021]\n(3) The respective contractor or trade contractor who has certified Forms G1 to G21 as set out in the\nSecond Schedule shall be held responsible for the quality of the works erected and completed.\n[Amendment 2021]\n(4) The principal submitting person shall within fourteen days from the issuance of the certificate of\ncompletion and compliance or partial certificate of completion and compliance, as the case may\nbe, deposit a copy of the said certificate and Forms G1 to G21 with the local authority and the\nBoard of Architects Malaysia or the Board of Engineers Malaysia, as the case may be.\n[Amendment 2007]\n[Amendment 2021]\n(5) Nothing contained in this by-law shall prevent the local authority or any officer authorised by it\nin writing for the purpose, from inspecting any building works at any stage thereof and calling\nattention to any failure to the building or non-compliance with these By-Laws which he may\nobserve, and, giving notice in writing to the principal submitting person or submitting person\nordering such failure or non-compliance to be rectified.\n[Amendment 2007]\n[Amendment 2021]\n(6) Subject to paragraph (5), the local authority may issue a directive in writing to the principal\nsubmitting person to withhold the issuance of the certificate of completion and compliance or\npartial certificate of completion and compliance, as the case may be.\n[Amendment 2007]\n[Amendment 2021]\n(7) The principal submitting person or submitting person shall within twenty-one days after the receipt\nof the notice issued in pursuance of paragraph (5) or such a further period as may be approved\nby the local authority, rectify the failure or non-compliance.\n[Amendment 2007]\n[Amendment 2021]\n(8) Where the principal submitting person or submitting person has rectified the failure or non\u0002compliance, he shall issue a notice to the local authority confirming that such rectification works\nhave been satisfactorily completed.\n[Amendment 2007]\n[Amendment 2021]\n(9) Upon receipt of the notice as mentioned in paragraph (8), the local authority shall within fourteen\ndays from the receipt of such notice inspect the building to confirm that the failure or non\u0002compliance has been satisfactorily rectified.\n[Amendment 2007]\n[Amendment 2021]\n(10) Where the local authority is satisfied that the failure or non-compliance as stipulated in paragraph\n(5) has been satisfactorily rectified, the local authority shall issue a directive in writing to the\nprincipal submitting person to issue the certificate of completion and compliance or partial certificate\nof completion and compliance, as the case may be.\n[Amendment 2007]\n[Amendment 2021]\n(11) Where the local authority has not carried out the inspection of rectification works in pursuance of\nparagraph (9) within the period as stipulated in that paragraph, it shall be deemed that the local\nauthority is satisfied that the rectification works have been satisfactorily completed.\n[Amendment 2007]\n[Amendment 2021]\n(12) Where the failure or non-compliance has not been rectified by the principal submitting person\nor submitting person within the period stipulated in paragraph (7), the local authority may itself\ncause any work to be executed or any measure to be taken if it considers such work or a measure\nis necessary to rectify the non-compliance.\n[Amendment 2007]\n[Amendment 2021]\n(13) The cost for executing such work or taking such a measure as referred to in paragraph (12) shall\nbe borne by the owner of the building.\n[Amendment 2007]\n[Amendment 2021]\n(14) The certificate of completion and compliance or partial certificate of completion and compliance,\nas the case may be, shall not be issued by the principal submitting person until all the failure or\nnon-compliance in respect of the building has been satisfactorily rectified.\n[Amendment 2007]\n[Amendment 2021]\n(15) A certificate of fire safety from the Fire and Rescue Department (except for residential buildings\nof not exceeding 18 metres in height) shall be attached with Forms G8 and G9.\n[Amendment 2021]\n(16) A certificate of fitness from the Department of Occupational Safety and Health shall be attached\nwith Form G11.\n[Amendment 2021]\n(17) A letter of confirmation from the water authority that the water supply is ready for connection\nshall be attached with Form G13.\n[Amendment 2021]\n(18) A letter of clearance from a sewerage certifying agency shall be attached with Forms G14 and\nG15.\n[Amendment 2021]\n(19) A letter of confirmation from Tenaga Nasional Berhad that the electrical power supply is ready\nfor connection shall be attached with Form G16.\n[Amendment 2021]\n(20) A letter of confirmation from the relevant local authority or Public Works Department shall be\nattached with Form G17 and if the letter of confirmation has not been received by the submitting\nperson within fourteen days from the date of application, the letter of confirmation shall be deemed\nto be given.\n[Amendment 2021]"},{"id":"bylaw-25A","kind":"bylaw","num":"25A","title":"Certificate of completion and compliance. Deleted.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["1999","2007"],"content":"[Amendment 1999]\n[Amendment 2007]"},{"id":"bylaw-26","kind":"bylaw","num":"26","title":"Temporary certificate of fitness for occupation. Deleted.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"[Amendment 2007]"},{"id":"bylaw-27","kind":"bylaw","num":"27","title":"Partial certificate of completion and compliance.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007","2011","2021"],"content":"[Amendment 2007]\n(1) The principal submitting person may issue a partial certificate of completion and compliance in\nForm F1 as set out in the Second Schedule, in respect of any part of a building partially completed\nsubject to any condition imposed by the local authority which it deems necessary for the reasons\nof public health and safety.\n[Amendment 2007]\n[Amendment 2011]\n[Amendment 2021]\n(2) Notwithstanding paragraph (1), no partial certificate of completion and compliance shall be issued\nunless all the essential services including an access road, landscape, car park, drain, sanitary, water,\nelectricity installation, communication, fire hydrant, sewerage and refuse disposal requirements,\nand fire lift where required, serving the partially completed portion of the building have been\nprovided.\n[Amendment 2021]\n(3) A partial certificate of completion and compliance once issued shall remain effective until the\nwhole of the building has been completed and a certificate of completion and compliance has\nbeen issued in the pursuance of by-law 25.\n[Amendment 2007]\n[Amendment 2021]\n(4) A certificate of fire safety from the Fire and Rescue Department (except for residential buildings\nof not exceeding 18 metres in height) shall be attached with Forms G8 and G9.\n[Amendment 2021]\n(5) A certificate of fitness from the Department of Occupational Safety and Health shall be attached\nwith Form G11.\n[Amendment 2021]\n(6) A letter of confirmation from the water authority that the water supply is ready for connection\nshall be attached with Form G13.\n[Amendment 2021]\n(7) A letter of clearance from a sewerage certifying agency shall be attached with Forms G14 and\nG15.\n[Amendment 2021]\n(8) A letter of confirmation from Tenaga Nasional Berhad that the electrical power supply is ready\nfor connection shall be attached with Form G16.\n[Amendment 2021]\n(9) A letter of confirmation from the relevant local authority or Public Works Department shall be\nattached with Form G17 and if the letter of confirmation has not been received by the submitting\nperson within fourteen days from the date of application, the letter of confirmation shall be deemed\nto be given.\n[Amendment 2021]"},{"id":"bylaw-28","kind":"bylaw","num":"28","title":"Offences.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007","2021"],"content":"[Amendment 2021]\n(1) If the principal submitting person has failed to deposit a copy of the certificate of completion and\ncompliance or partial certificate of completion and compliance, as the case may be, and Forms\nG1 to G21 within the period as stipulated in paragraph 25(4) with the local authority and the\nBoard of Architects Malaysia or the Board of Engineers Malaysia, as the case may be, he shall\nbe guilty of an offence.\n(2) If the principal submitting person or submitting person has failed to comply with the notice issued\nby the local authority in accordance with paragraph 25(5) in respect of the rectification of any\nfailure to the building or non-compliance with these By-Laws, he shall be guilty of an offence.\n[Amendment 2007]\n[Amendment 2021]"},{"id":"bylaw-29","kind":"bylaw","num":"29","title":"Fees for consideration of plans and for permits.","part":"II","partTitle":"SUBMISSION OF PLANS FOR APPROVAL","amendments":["2007"],"content":"Fees in accordance with the First Schedule to these By-laws shall be paid by the principal submitting\npersons or submitting persons who submit plans and specifications for approval in respect of buildings\nto be constructed or altered or for the issue of permits or temporary permits in accordance with these\nBy-laws.\n[Amendment 2007]"},{"id":"bylaw-30","kind":"bylaw","num":"30","title":"Open spaces to be provided.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"Every building which is erected shall, unless the local authority is of the opinion that in any particular\ncase air space is otherwise sufficiently and permanently provided for, have directly attached thereto an\nopen space exclusively belonging thereto of such dimensions as may be prescribed hereafter."},{"id":"bylaw-31","kind":"bylaw","num":"31","title":"Open spaces not to be altered or roofed.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"(1) Whenever any open space has been provided in connection with any building in pursuance of\nthese By-laws, no person shall, without the approval in writing of the local authority--\n(a) make or maintain or permit to be made or maintained any alteration in such open space; or\n(b) construct or maintain or permit to be constructed or maintained a roof over any portion\nthereof so as to diminish the area of such open space:\nProvided that the local authority in its discretion may issue such a permit if it is satisfied that\nthe free movement of air is not impeded or hindered.\n(2) The local authority may by notice in writing require the owner or any person acting in contravention\nof this Part to remove any such alteration or roof or otherwise to do such works as will restore\nsuch open space."},{"id":"bylaw-32","kind":"bylaw","num":"32","title":"Space about buildings abutting a street and a backlane.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"(1) The open space for buildings abutting a street and backlane shall be--\n(a) in respect of residential buildings, not less than one-third of the built-on area of the building\nlot; and\n(b) in respect of other buildings used for non-residential purposes, not less than one-tenth of\nthe built-on area of the building lot.\n(2) For the purpose of calculating the open space required by paragraph (1) of by-law 32--\n(a) in a two-storeyed shophouse the space occupied by any single-storeyed annexe not being a\nhabitable room which does not exceed the height of the ceiling of the ground floor shall be\nconsidered as neutral and shall not be counted as built-on area or as open space;\n(b) half the width of the backlane abutting a building shall be counted as open space;\n(c) balconies, passage-ways and sun-shades may project over any open space provided they do\nnot project more than 1 metre and such projection shall be counted as open space and not\nas built up area;\n(d) the open space provided between the street and the set back for a building line of a terrace\nhouse shall not be counted as open space.\n(3) Where open space not abutting a backlane is provided for, such open space shall have a minimum\nclear dimension of not less than 2.5 metres and such open space shall exclude projections of\nhoods, sun-shades or balconies."},{"id":"bylaw-33","kind":"bylaw","num":"33","title":"Space about buildings on lots abutting a street and having no backlane.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"For a building on a lot abutting a street and having no backlane, the open space shall be situated at\nthe rear of the building and shall extend across the full width of the lot."},{"id":"bylaw-34","kind":"bylaw","num":"34","title":"Space about detached buildings.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"(1) Subject to the specific requirement of Part VII, for a detached building there shall be not less than\n2 metres clear space measured between the extreme projections of the building and boundaries\nof its lot and 4 metres clear space between such building and any other building unless they are\nwithin the same building lot.\n(2) For the purpose of this by-law a pair of semi-detached buildings shall be deemed to be one\nbuilding on a single lot."},{"id":"bylaw-34A","kind":"bylaw","num":"34A","title":"Building requirements for disabled persons.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":["1991","2012","2021"],"content":"[Amendment 1991]\n(1) Any building or part thereof to which this by-law applies --\n(a) shall be provided with access to enable a disabled person to get into, out of and to move\nwithin the building except for any part of the building for which access is provided wholly\nor mainly for the inspection, maintenance or repair of the building, its services or fixed plant\nor machinery; and\n(b) shall be designed with facilities for the use of the disabled person.\n[Amendment 1991]\n[Amendment 2021]\n(2) The requirements of this by-law shall be deemed to be satisfied by compliance with MS 1183 and\nMS 1184.\n[Amendment 1991]\n[Amendment 2021]\n(3) The buildings to which this by-law applies and which on the date of commencement of this by\u0002law have been erected, are being erected or have not been erected but plans have been submitted\nand approved, shall be modified or altered to comply with this by-law within three years from\nthe date of commencement of this by-law.\n[Amendment 1991]\n[Amendment 2021]\n(4) Notwithstanding paragraph (3), the local authority may, if it is satisfied that it is justifiable to do\nso--\n(a) allow an extension or further extensions of the period within which the requirements of this\nby-law are to be complied with; or\n(b) allow variations, deviations or exemptions as it may specify from any provision of this by\u0002law.\n[Amendment 1991]\n[Amendment 2021]\n(5) Any person aggrieved by any decision of the local authority under paragraph (4) may, within thirty\ndays after the person has been notified of the decision, appeal against that decision in writing to\nthe State Authority, whose decision shall be final.\n[Amendment 1991]\n[Amendment 2021]\n(6) Deleted.\n[Amendment 2012]"},{"id":"bylaw-35","kind":"bylaw","num":"35","title":"Access from a street.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"Every building to be erected on a site which does not front a street shall have access from a street and\nthe means, nature and extent of the access shall be in accordance with a layout plan approved by the\ncompetent planning authority or the local authority."},{"id":"bylaw-36","kind":"bylaw","num":"36","title":"Splayed corner.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":[],"content":"Where a building is erected at the junction of two streets and in cases where the degree of splay or\nrounding off is not shown on the layout plan or any statutory amendment, modification or replacement\nthereof maintained by the competent planning authority, the corner of such building shall be splayed\nor rounded off to a height of not less than 5 metres above the street level at the point of intersection\nof the street lines so that no part of the building below this height shall project beyond the straight\nline drawn across the corner of the building plot joining each street line at a point 3 metres from the\npoint of intersection of the street lines."},{"id":"bylaw-37","kind":"bylaw","num":"37","title":"Projections over the street and over the building line.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":["2021"],"content":"(1) Where buildings abut on a street, projection over the street for open verandahs, balconies, sun\u0002shades or similar projections may be permitted on the following basis:\nProjection = Width of street in metres minus 10 metres\nProvided that the maximum projection which may be permitted under this formula is 1.25 metres\nclear of the approved line of street.\n(2) Projections in the nature of canopies over entrances in excess of 1.25 metres may be permitted\nat the discretion of the local authority.\n(3) All such projections shall be at least 5 metres above the level of the road. Between the levels of\n2.5 metres and 5 metres, projections not exceeding 500 millimetres may be permitted.\n(4) Where a building line is prescribed for a street set back from the regular line of street, projections\nabove the ground floor over such building line may be permitted provided that such projection\nshall not exceed 1.80 metres and shall not exceed one half of the building frontage to the building\nline.\n[Amendment 2021]"},{"id":"bylaw-38","kind":"bylaw","num":"38","title":"Width of footway.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":["2012"],"content":"(1) The width of any verandah-way or uncovered footway shall not be less than 2.10 metres but\npiers or columns to a maximum depth of 600 millimetres from the boundary of the street may be\npermitted on such verandah-way or footway.\n[Amendment 2012]\n(2) The width of the verandah-way or uncovered footway shall be measured from the boundary of\nthe street to the wall or other part (not being an outside verandah pier) of the building nearest\nthe street, and all dimensions referred to in this by-law shall be measured at the pavement level\nof the verandah or uncovered footway.\n(3) For the purpose of this by-law any step, threshold or other structure appurtenant to a building\nshall be deemed to be part of the building though no directly connected therewith.\n(4) Where there is a change in levels along the footway between adjoining lots there shall be provided\nsteps with risers not exceeding 150 millimetres and treads not less than 275 millimetres or a\npedestrian ramp of gradient not exceeding one in ten.\n(5) Where a service road is provided the footway required to be provided and constructed shall follow\nthe line of the street."},{"id":"bylaw-38A","kind":"bylaw","num":"38A","title":"Energy efficiency in buildings.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":["2012","2021"],"content":"[Amendment 2012]\n(1) A new or renovated non-residential building with air conditioned space exceeding 4,000 square\nmetres --\n(a) shall be designed to meet the requirements of MS 1525 with regards to the Overall Thermal\nTransfer Value (OTTV) and the Roof Thermal Transfer Value (RTTV); and\n(b) shall be provided with an Energy Management System.\n[Amendment 2012]\n[Amendment 2021]\n(2) The roof for all buildings (residential and non-residential) shall not have a thermal transmittance\n(U-value) greater than --\n(a) 0.4 W/m2K for a light weight roof (below 50 kg/m2); and\n(b) 0.6 W/m2K for a heavy weight roof (above 50 kg/m2),\nunless provided with other shading or cooling means.\n[Amendment 2012]\n[Amendment 2021]"},{"id":"bylaw-38B","kind":"bylaw","num":"38B","title":"Protection of building structures against lightning strikes.","part":"III","partTitle":"SPACE, LIGHT AND VENTILATION","amendments":["2012","2021"],"content":"[Amendment 2012]\n(1) The assessment of risks and provision of measures to protect building structures against lightning\nstrikes shall comply with the requirements as set out in MS IEC 62305.\n[Amendment 2012]\n[Amendment 2021]\n(2) For the purpose of pa
