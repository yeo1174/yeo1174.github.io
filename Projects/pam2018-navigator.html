<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAM Contract 2018 Navigator</title>
<style>
  :root{
    --bg:#f6f3ec;
    --paper:#fffdf8;
    --ink:#1b2027;
    --ink-soft:#565b63;
    --ink-faint:#8b8f96;
    --line:#ddd7c8;
    --line-strong:#c7bfa9;
    --accent:#26476b;
    --accent-ink:#ffffff;
    --accent-soft:#e6edf4;
    --accent-soft-line:#b7c8db;
    --amend:#96591f;
    --amend-soft:#f4e6d3;
    --danger:#8a3324;
    --danger-soft:#f6e4df;
    --focus:#26476b;
    --shadow: 0 1px 2px rgba(27,32,39,.06), 0 6px 18px -8px rgba(27,32,39,.12);
    --radius-s:4px;
    --radius-m:8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181d;
      --paper:#1b2129;
      --ink:#eceae3;
      --ink-soft:#a8adb5;
      --ink-faint:#767c85;
      --line:#333b45;
      --line-strong:#3f4954;
      --accent:#8fb4d9;
      --accent-ink:#0c1a26;
      --accent-soft:#1c2b3a;
      --accent-soft-line:#2f4a63;
      --amend:#d9a15c;
      --amend-soft:#332a1c;
      --danger:#e0806c;
      --danger-soft:#3a2620;
      --focus:#8fb4d9;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181d;
    --paper:#1b2129;
    --ink:#eceae3;
    --ink-soft:#a8adb5;
    --ink-faint:#767c85;
    --line:#333b45;
    --line-strong:#3f4954;
    --accent:#8fb4d9;
    --accent-ink:#0c1a26;
    --accent-soft:#1c2b3a;
    --accent-soft-line:#2f4a63;
    --amend:#d9a15c;
    --amend-soft:#332a1c;
    --danger:#e0806c;
    --danger-soft:#3a2620;
    --focus:#8fb4d9;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  html, body{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  ::selection{background:var(--accent-soft-line);}
  a{color:var(--accent);}
  button, input{ font-family:inherit; }
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  .num{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}

  /* ---------- Shell ---------- */
  .shell{
    display:grid;
    grid-template-rows:auto 1fr;
    height:100vh;
    height:100dvh;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 28px);
    background-size:28px 28px;
    background-position:-1px -1px;
    background-blend-mode:normal;
    position:relative;
    flex-wrap:wrap;
  }
  .topbar::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--paper) 88%, transparent), var(--paper) 85%);
    pointer-events:none;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    position:relative;
    z-index:1;
    min-width:0;
  }
  .brand .mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.09em;
    color:var(--accent-ink);
    background:var(--accent);
    padding:3px 6px;
    border-radius:3px;
    font-weight:600;
  }
  .brand h1{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:19px;
    font-weight:600;
    margin:0;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .brand .sub{
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:.02em;
  }

  .searchwrap{
    position:relative;
    flex:1 1 340px;
    min-width:220px;
    max-width:520px;
    z-index:1;
  }
  .searchwrap svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--ink-faint); pointer-events:none;
  }
  #searchInput{
    width:100%;
    padding:9px 34px 9px 32px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius-m);
    background:var(--paper);
    color:var(--ink);
    font-size:13.5px;
  }
  #searchInput:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
  #searchClear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:none; background:transparent; color:var(--ink-faint);
    width:22px; height:22px; border-radius:50%; display:none;
    font-size:15px; line-height:1;
  }
  #searchClear:hover{background:var(--accent-soft); color:var(--ink);}

  .jumpform{
    display:flex;
    align-items:stretch;
    gap:0;
    position:relative;
    z-index:1;
  }
  .jumpform label{
    display:flex; align-items:center;
    font-size:11.5px; color:var(--ink-soft);
    padding:0 8px 0 2px; white-space:nowrap;
  }
  #jumpInput{
    width:150px;
    padding:9px 10px;
    border:1px solid var(--line-strong);
    border-right:none;
    border-radius:var(--radius-m) 0 0 var(--radius-m);
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  #jumpGo{
    padding:9px 14px;
    border:1px solid var(--accent);
    border-radius:0 var(--radius-m) var(--radius-m) 0;
    background:var(--accent);
    color:var(--accent-ink);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
  }
  #jumpGo:hover{filter:brightness(1.08);}

  .themeToggle{
    z-index:1;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink-soft);
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .themeToggle:hover{color:var(--ink);}

  /* ---------- Body layout ---------- */
  .body{
    display:grid;
    grid-template-columns:300px 1fr;
    min-height:0;
  }
  .sidebarScrim{
    display:none; position:fixed; inset:0; z-index:19;
    background:rgba(10,12,15,.35);
  }
  @media (max-width:760px){
    .body{grid-template-columns:1fr;}
    .sidebar{
      position:fixed; inset:0 20% 0 0; z-index:20;
      transform:translateX(-101%);
      transition:transform .18s ease;
      box-shadow:var(--shadow);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebarScrim.show{display:block;}
    .menuBtn{display:inline-flex !important; order:1;}
    .topbar{padding:10px 14px; gap:8px 10px;}
    .brand{order:2; flex:1 1 auto; min-width:0;}
    .brand h1{font-size:16px;}
    .brand .sub{display:none;}
    .themeToggle{order:3;}
    .searchwrap{order:4; flex:1 1 100%; max-width:none; min-width:0;}
    .jumpform{order:5; flex:1 1 100%;}
    #jumpInput{flex:1; width:auto; min-width:0;}
    .main{padding:20px 16px 56px;}
    .clauseHead h2{font-size:20px;}
    .navFoot button{max-width:48%;}
  }

  .sidebar{
    border-right:1px solid var(--line);
    background:var(--paper);
    overflow-y:auto;
    min-height:0;
    padding:6px 0 40px;
  }
  .sideSection{ margin-top:4px; }
  .sideSectionTitle{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px 6px;
    font-size:10.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-faint);
    position:sticky; top:0;
    background:var(--paper);
    z-index:2;
  }
  .partGroup{ border-top:1px solid var(--line); }
  .partHead{
    width:100%;
    display:flex; align-items:baseline; gap:8px;
    padding:8px 14px;
    background:none; border:none; text-align:left;
    color:var(--ink);
  }
  .partHead:hover{background:var(--accent-soft);}
  .partHead .roman{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--accent); font-weight:600;
    min-width:22px;
  }
  .partHead .ptitle{
    font-size:12.5px; font-weight:600; letter-spacing:.01em;
    flex:1;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .partHead .chev{
    font-size:10px; color:var(--ink-faint);
    transition:transform .15s ease;
  }
  .partGroup.open .chev{transform:rotate(90deg);}
  .partList{ display:none; padding-bottom:4px;}
  .partGroup.open .partList{display:block;}

  .clauseItem{
    width:100%;
    display:flex; align-items:baseline; gap:9px;
    padding:6px 14px 6px 34px;
    background:none; border:none; text-align:left;
    color:var(--ink-soft);
    border-left:2px solid transparent;
  }
  .clauseItem .n{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; color:var(--ink-faint);
    min-width:34px;
  }
  .clauseItem .t{
    font-size:12.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .clauseItem:hover{background:var(--accent-soft); color:var(--ink);}
  .clauseItem.active{
    background:var(--accent-soft);
    border-left-color:var(--accent);
    color:var(--ink);
  }
  .clauseItem.active .n{color:var(--accent);}

  /* flat (non-collapsible) group, e.g. Preliminary / Appendix */
  .flatGroup{ padding-bottom:4px; }
  .flatGroup .clauseItem{ padding-left:14px; }

  /* ---------- Main pane ---------- */
  .main{
    overflow-y:auto;
    min-height:0;
    padding:28px 34px 80px;
  }
  .mainInner{ max-width:680px; margin:0 auto; }

  .crumb{
    font-size:12px; color:var(--ink-faint);
    margin-bottom:14px;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .crumb a{color:var(--ink-soft); text-decoration:none;}
  .crumb a:hover{color:var(--accent); text-decoration:underline;}

  .clauseHead{
    display:flex; align-items:flex-start; gap:14px;
    padding-bottom:16px; margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .clauseHead .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:600;
    color:var(--accent-ink);
    background:var(--accent);
    padding:5px 10px;
    border-radius:var(--radius-s);
    white-space:nowrap;
    margin-top:2px;
  }
  .clauseHead h2{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:23px; font-weight:600;
    margin:0 0 6px;
    text-wrap:balance;
  }
  .clauseMeta{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .pill{
    font-size:10.5px; letter-spacing:.03em;
    padding:2px 8px;
    border-radius:99px;
    border:1px solid var(--line-strong);
    color:var(--ink-soft);
  }
  .pill.amend{
    color:var(--amend);
    background:var(--amend-soft);
    border-color:transparent;
    font-family:'IBM Plex Mono',monospace;
  }
  .copyBtn{
    margin-left:auto;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:11.5px;
    padding:5px 10px;
    border-radius:var(--radius-s);
    display:flex; align-items:center; gap:5px;
    flex:0 0 auto;
    align-self:flex-start;
  }
  .copyBtn:hover{color:var(--ink); border-color:var(--ink-faint);}

  .subIndex{
    background:var(--accent-soft);
    border:1px solid var(--accent-soft-line);
    border-radius:var(--radius-m);
    padding:12px 14px;
    margin-bottom:20px;
  }
  .subIndex .subIndexTitle{
    font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:7px;
  }
  .subIndex ul{ margin:0; padding:0; list-style:none; display:grid; gap:4px; }
  .subIndex li{ font-size:12.5px; color:var(--ink); display:flex; gap:7px; }
  .subIndex .sn{ font-family:'IBM Plex Mono',monospace; color:var(--accent); flex:0 0 auto; min-width:44px; }

  .clauseBody{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:16px;
    line-height:1.75;
    color:var(--ink);
  }
  .clauseBody p{ margin:0 0 14px; text-wrap:pretty; }
  .clauseBody mark{
    background:var(--amend-soft);
    color:var(--ink);
    border-radius:2px;
    padding:0 1px;
  }
  .clauseBody .amendTag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--amend);
    background:var(--amend-soft);
    padding:1px 7px;
    border-radius:99px;
    margin:0 0 14px;
  }
  .appendixNote{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-m);
    padding:12px 14px;
    margin-top:-6px;
    margin-bottom:14px;
  }
  .appendixNote .lbl{
    font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:4px;
  }

  .navFoot{
    display:flex; justify-content:space-between; gap:12px;
    margin-top:32px; padding-top:18px;
    border-top:1px solid var(--line);
  }
  .navFoot button{
    display:flex; flex-direction:column; gap:2px;
    border:1px solid var(--line);
    background:var(--paper);
    padding:9px 13px;
    border-radius:var(--radius-m);
    max-width:46%;
  }
  .navFoot button:hover{border-color:var(--accent); background:var(--accent-soft);}
  .navFoot .lbl{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}
  .navFoot .val{font-size:12.5px; color:var(--ink); text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .navFoot .next{align-items:flex-end;}
  .navFoot .next .val{text-align:right;}

  /* ---------- Welcome / results ---------- */
  .welcome{ max-width:640px; }
  .welcome h2{
    font-family:'IBM Plex Serif',Georgia,serif;
    font-size:25px; margin:0 0 10px; text-wrap:balance;
  }
  .welcome p{ color:var(--ink-soft); margin:0 0 14px; max-width:60ch; }
  .welcome .ocrNote{
    font-size:12px; color:var(--ink-faint); border-left:2px solid var(--line-strong);
    padding-left:10px; max-width:56ch;
  }
  .statRow{
    display:flex; gap:10px; flex-wrap:wrap;
    margin:18px 0 26px;
  }
  .statCard{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:var(--radius-m);
    padding:12px 16px;
    min-width:110px;
  }
  .statCard .figure{
    font-family:'IBM Plex Mono',monospace;
    font-size:22px; font-weight:600; color:var(--accent);
  }
  .statCard .cap{ font-size:11px; color:var(--ink-faint); letter-spacing:.03em; }
  .exampleRow{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;
  }
  .exampleChip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    padding:5px 10px;
    border-radius:99px;
    color:var(--ink-soft);
  }
  .exampleChip:hover{border-color:var(--accent); color:var(--accent);}

  .resultsHead{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:14px; flex-wrap:wrap; gap:6px;
  }
  .resultsHead h2{ font-family:'IBM Plex Serif',Georgia,serif; font-size:19px; margin:0; }
  .resultsHead .count{ font-size:12px; color:var(--ink-faint); }
  .resultCard{
    display:block;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:var(--radius-m);
    padding:13px 16px;
    margin-bottom:10px;
    color:var(--ink);
    text-decoration:none;
  }
  .resultCard:hover{ border-color:var(--accent); box-shadow:var(--shadow); }
  .resultCard .rhead{ display:flex; align-items:baseline; gap:9px; margin-bottom:4px; }
  .resultCard .rnum{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--accent); font-weight:600; }
  .resultCard .rtitle{ font-size:14.5px; font-weight:600; font-family:'IBM Plex Serif',Georgia,serif; }
  .resultCard .rpart{ font-size:11px; color:var(--ink-faint); margin-left:auto; white-space:nowrap; }
  .resultCard .rsnippet{ font-size:12.5px; color:var(--ink-soft); line-height:1.55; }
  .resultCard .rsnippet mark{ background:var(--amend-soft); color:var(--ink); border-radius:2px; }
  .noResults{ color:var(--ink-faint); font-size:13.5px; padding:20px 0; }

  .menuBtn{
    display:none;
    border:1px solid var(--line-strong);
    background:var(--paper);
    width:32px; height:32px; border-radius:var(--radius-s);
    align-items:center; justify-content:center;
    color:var(--ink-soft);
    z-index:1;
  }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>

<body>
<div class="shell">
  <header class="topbar">
    <button class="menuBtn" id="menuBtn" aria-label="Open contract index" title="Open index">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <span class="mark">PAM 2018</span>
      <div>
        <h1>PAM Contract Navigator</h1>
        <div class="sub">PAM Contract 2018 (With Quantities) &middot; OCR extraction</div>
      </div>
    </div>
    <div class="searchwrap">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.2" stroke="currentColor" stroke-width="1.5"/><path d="M17 17l-3.6-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search by keyword — e.g. extension of time, retention, arbitration…" autocomplete="off" spellcheck="false">
      <button id="searchClear" aria-label="Clear search" title="Clear search">&times;</button>
    </div>
    <form class="jumpform" id="jumpForm">
      <label for="jumpInput">Go to clause</label>
      <input id="jumpInput" type="text" placeholder="e.g. 23.0, Art 7, App 9" autocomplete="off" spellcheck="false">
      <button id="jumpGo" type="submit">Open</button>
    </form>
    <button class="themeToggle" id="themeToggle" aria-label="Toggle color theme" title="Toggle theme">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 2a8 8 0 100 16 6.5 6.5 0 010-16z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="body">
    <div class="sidebarScrim" id="scrim"></div>
    <nav class="sidebar" id="sidebar" aria-label="Contract index"></nav>
    <main class="main" id="main">
      <div class="mainInner" id="mainInner"></div>
    </main>
  </div>
</div>

 Cost Sums (‘P.C. Sums’) means the sums provided in the contract for . works or services to be executed by Nominated Sub-Contractor or for materials ; and goods to be supplied by Nominated Supplier;\n\n(as) Provisional or Provisional Quantity means the estimated quantities of work provided in the Contract Bills for work to be executed or for the supply of any materials and goods which cannot be determined or detailed at the time;\n\n(at) Provisional Sums means the sums provided in the contract and/or the Nominated Sub-Contract for work to be executed or for the supply of any materials and goods which cannot be foreseen, determined or detailed at the time;\n\n(au) Quantity Surveyor means the Person named in Article 5 and shall be a Registered Quantity Surveyor or any other form of practice registered under the Quantity Surveyors Act 1967 and approved by the Board of Quantity Surveyors, Malaysia;\n\n(av) Relevant Event means any one of the events for extension of time set out in Clause 23.8;\n\n(aw) _ Retention Fund means the sum retained in accordance with Clause 30.5;\n\n(ax) Service Provider means any company or body authorised to provide water, electricity, telecommunication, sewerage and other related services;\n\n(ay) Site means the land and other places on, in, under, over or through which the | Works are to be executed and is provided by the Employer for the purposes of the ; Contract including other land and places obtained by the Contractor and accepted by the Employer as forming part of the Site;\n\n(az) Site Agent means the person appointed under Clause 8.1;\n\n(ba) Site Staff means the person appointed under Clause 10.1;\n\n(bb) — Specialist Consultant means the Person named in Article 6 and such Person shall | be a Specialist Consultant appointed by the Employer for a designated scope of professional work; |\n\n(bc) Variation means changes made to the Works as defined under Clause 11.1;\n\n(bd) | Week means a period of seven (7) consecutive days; | PAM Contract 2018 (With Quantities) 6 : |\n\n(be) Works means the works described in the Articles of Agreement and referred to in the Contract Documents and includes any changes made to these works in accordance with the Contract; and\n\n(bf) Works Programme means the works programme described in the Contract Documents and in Clause 3.5,"}, {"id": "article-8", "kind": "article", "num": "8", "title": "Meanings", "content": "In the interpretation of the Contract, unless the context requires otherwise, the following Meanings shall apply:\n\n(a) Gender - words of one gender include the other gender, and words denoting natural persons include corporations and firms and all such words are to be construed interchangeably in that manner;\n\n(b) Headings and Marginal Notes - the headings and marginal notes in the Conditions are not to be taken into consideration in the interpretation or construction of the | Conditions or of the Contract;\n\n(c) Reference to legislation - a reference to any Acts is deemed to include references to any subsequent amendments, consolidation or replacement of the Acts; |\n\n(d) Singular and Plural - words importing the singular also include the plural and vice versa where the context requires; and\n\n(e) Where any word or phrase is given a defined meaning, any other grammatical form of that word or phrase has a corresponding meaning."}], "clauses": [{"id": "clause-1.0", "kind": "clause", "num": "1.0", "title": "Contractor's Obligations", "subclauses": [{"num": "1.1", "title": "Completion of Works in accordance with Contract Documents"}, {"num": "1.2", "title": "Temporary work and construction method"}, {"num": "1.3", "title": "Contractor's design and responsibilities"}, {"num": "1.4", "title": "Discrepancy or divergence between documents"}], "content": "1.0 Contractor's Obligations Completion of\n\n1.1 The Contractor shall upon and subject to these Conditions carry out and complete the Works in Works in accordance with the Contract Documents and in compliance therewith provide accordance with materials, goods and standards of workmanship of the quality and standard described in the Contract Contract Documents and/or required by the Architect in accordance with the provisions of Documents the Contract. ' Temporary work\n\n1.2 Unless designed by the Architect or Consultant, the Contractor shall be fully responsible for and construction the adequacy, stability and safety of all temporary works and of all methods of construction method of the Works, irrespective of any approval by the Architect or Consultant. , Contractor’s\n\n1.3 If the Contractor proposes any alternative design to that specified in the Works or if the design and Contract leaves any matter of design, specification or choice of materials, goods and responsibilities workmanship to the Contractor, the Contractor shall ensure that such works are fit for its purpose. The copyright of the Contractor’s design and alternative design belongs to the Contractor, but the Employer shall be entitled to use the design and alternative design for the completion, maintenance, repair and future extension of the Works. The acceptance by the Architect or Consultant of the Contractor’s design and alternative design shall not relieve the Contractor of his responsibilities under the Contract. Discrepancy or\n\n1.4 The Contractor shall use the Contract Documents and any other subsequent documents divergence issued by the Architect to plan the Works prior to execution. If during the said planning and between subsequent execution of the Works, the Contractor finds any discrepancy in or divergence documents between any of the Contract Documents and any subsequent documents issued by the Architect, he shall give to the Architect a written notice in sufficient time before the commencement of construction of the affected works, specifying the discrepancy or divergence to enable the Architect to issue written instructions within a period which would not materially delay the progress of the affected works, having regard to the Completion Date. Such discrepancy or divergence shall not vitiate the Contract."}, {"id": "clause-2.0", "kind": "clause", "num": "2.0", "title": "Architect's Instructions ('AI')", "subclauses": [{"num": "2.1", "title": "Contractor to comply with AI"}, {"num": "2.2", "title": "AI"}, {"num": "2.3", "title": "Provisions empowering instructions"}, {"num": "2.4", "title": "Failure of Contractor to comply with AI"}], "content": "2.0 Architect's Instructions (‘AI’) Contractor to\n\n2.1 The Contractor shall subject to Clauses 2.2 and\n\n2.3 forthwith comply with all instructions comply with AI issued to him by the Architect in regard to any matter in respect of which the Architect is expressly empowered by these Conditions to issue instructions. Al\n\n2.2 All instructions issued by the Architect shall be in writing expressly entitled “Architect’s Instruction” (‘AI’). All other forms of written instructions including drawings issued by the Architect shall be an AI:\n\n2.2(a) upon written confirmation from the Contractor entitled “Confirmation of Architect’s Instruction” (‘CAI’); or\n\n2.2(b) upon subsequent confirmation of the written instructions by the Architect with an AI. Provisions 2.3 Upon receipt of a written instruction from the Architect, the Contractor may request the empowering Architect to specify in writing which provision of these Conditions empowers the issuance instructions of the said instruction and the Architect shall forthwith comply with such a request. If the Contractor thereafter complies with the said instruction without invoking any dispute resolution procedure under the Contract to establish the Architect’s power in that regard, the instruction shall be deemed to have been duly given under the specified provision. Failure of\n\n2.4 If the time of compliance [which shall not be less than seven (7) Days from receipt of the Contractor to Al] is stated by the Architect in the AI and the Contractor does not comply therewith then comply with AI the Employer may, without prejudice to any other rights and remedies which he may possess under the Contract, employ and pay other Person to execute any work which may be necessary to give effect to such instruction, The cost of employing other Person and any additional cost in this connection shall be set-off by the Employer under Clause 30.4."}, {"id": "clause-3.0", "kind": "clause", "num": "3.0", "title": "Contract Documents, Programme And As-built Drawings", "subclauses": [{"num": "3.1", "title": "Contract Documents"}, {"num": "3.2", "title": "Custody of tender documents"}, {"num": "3.3", "title": "Copies of documents"}, {"num": "3.4", "title": "Further drawings or details"}, {"num": "3.5", "title": "Works Programme"}, {"num": "3.6", "title": "Programme not part of Contract"}, {"num": "3.7", "title": "Architect's acceptance of programme"}, {"num": "3.8", "title": "Availability of documents"}, {"num": "3.9", "title": "Limitation of use of documents"}, {"num": "3.10", "title": "As-built Drawings and operation and maintenance manuals"}], "content": "3.0 Contract Documents, Programme And As-built Drawings Contract\n\n3.1 The Contract Documents are to be read as mutually explanatory of one another. In the event Documents of any conflict or inconsistencies between any of the Contract Document, the priority in the interpretation of such documents shall be in the following descending order: PAM Contract 2018 (With Quantities) 9 : Se 3.1{a) the Letter of Award;\n\n3.1(b) the Articles of Agreement;\n\n3.1(c) the Conditions of Contract;\n\n3.1(d) the Contract Drawings;\n\n3.1(e) the Contract Bills; and 3.1¢f) other documents incorporated in the Contract Documents, unless expressly stated to be excluded in any of the Contract Document. Custody of\n\n3.2 The original tender documents shall remain in the custody of the Architect or Quantity tender Surveyor so as to be available at all reasonable times for inspection by the Employer and | e Works Programme. The : Contractor without charge to the Employer, shall provide the Architect from time to time ; with similar number of copies of any revised Works Programme. | Programme not\n\n3.6 The Works Programme shall not constitute part of the Contract, whether physically | part of Contract incorporated or not into the Contract Documents. Architect’s\n\n3.7 The acceptance by the Architect of the Works Programme shall not relieve the Contractor acceptance of of his obligations, duties or responsibilities under the Contract. The Works Programme may programme be used by the Architect to monitor progress and the Architect is entitled to rely on the Works Programme as @ basis for the assessment of extension of time and the effect of the delay and/or disturbances to the progress of the Works. Availability of\n\n3.8 The Contractor shall keep a copy of the Contract Drawings and the unpriced Contract Bills documents on the Site to be available to the Architect and Consultant and their authorised representatives at all reasonable times. Limitation of use\n\n3.9 None of the Contract Documents in Clause 3.1 shall be used by the Contractor for any of documents purpose other than the Contract. Except for the purpose of the Contract, the parties shall not disclose any of the rates and prices in the Contract Bills to any other party. As-built\n\n3.10 The Contractor shall supply and shall cause any Nominated Sub-Contractor to supply As- Drawings and built Drawings and/or operation and maintenance manuals specified in the Contract operation and Documents and/or Nominated Sub-Contract documents in the manner and within the time maintenance specified therein, Where these are not specified, the Contractor shall supply and shall manuals ensure that the Nominated Sub-Contractor supplies four((4) copies of the above items 1 before the Completion Date."}, {"id": "clause-4.0", "kind": "clause", "num": "4.0", "title": "Statutory Obligations, Notices, Fees And Charges", "subclauses": [{"num": "4.1", "title": "Statutory requirements"}, {"num": "4.2", "title": "Inconsistencies with statutory requirements"}, {"num": "4.3", "title": "Conforming to statutory obligations"}, {"num": "4.4", "title": "Fees, levies and charges"}], "content": "| 4.0 Statutory Obligations, Notices, Fees And Charges Statutory\n\n4.1 The Contractor shall comply with and submit all notices required by any laws, regulations, requirements by-laws, terms and conditions of any Appropriate Authority and Service Provider in respect of the execution of the Works and all temporary works. | Inconsistencies\n\n4.2 If the Contractor finds any inconsistencies between the Contract Documents (including any « with statutory subsequent documents issued by the Architect) and any laws, regulations, by-laws, terms | requirements and conditions of any Appropriate Authority and Service Provider, he shall immediately | specify the inconsistencies and give to the Architect a written notice before commencement | of construction of the affected works, ; Conforming to 43 If within seven (7) Days of having given written notice to the Architect, the Contractor does statutory not receive any AI in regard to the matters specified in Clause 4.2, he shall proceed with the obligations work to conform to such laws, regulations, by-laws, terms and conditions of any Appropriate Authority and Service Provider. Any changes so necessitated shall be deemed to be a Variation required by the Architect. Fees, levies and\n\n4.4 The Contractor shall pay and indemnify the Employer against any liability in respect of any ; charges fees, levies and charges including any penalties which may arise from the Contractor’s non- compliance with any laws, regulations, by-laws, terms and conditions of any Appropriate Authority and Service Provider in respect of the execution of the Works and all temporary works. If the Contractor fails to pay, the Employer may pay such amount and such amount together with any additional cost in this connection shall be set-off by the Employer under Clause 30.4."}, {"id": "clause-5.0", "kind": "clause", "num": "5.0", "title": "Levels And Setting Out Of The Works", "subclauses": [{"num": "5.1", "title": "Setting out"}], "content": "5.0 Levels And Setting Out Of The Works Setting out\n\n5.1 The Architect shall determine all levels which may be required for the execution of the Works and shall provide the Contractor with drawings and information to enable the Contractor to set out the Works, The Contractor shall at his own cost rectify any errors arising from any inaccurate setting out. With the consent of the Employer, the Architect may instruct that such errors need not be rectified subject to an appropriate deduction to be set-off by the Employer under Clause 30.4."}, {"id": "clause-6.0", "kind": "clause", "num": "6.0", "title": "Materials, Goods And Workmanship To Conform To Description, Testing And Inspection", "subclauses": [{"num": "6.1", "title": "Standards of works, materials, goods and workmanship"}, {"num": "6.2", "title": "Provision of vouchers"}, {"num": "6.3", "title": "Inspection and testing"}, {"num": "6.4", "title": "Contractor's obligation not relieved"}, {"num": "6.5", "title": "Work not in accordance with the Contract"}, {"num": "6.6", "title": "No compensation for time and cost"}, {"num": "6.7", "title": "Failure of Contractor to comply"}, {"num": "6.8", "title": "Warranties in respect of materials and goods"}], "content": "6.0 Materials, Goods And Workmanship To Conform To Description, Testing And Inspection Standards of\n\n6.1 All works, materials, goods and workmanship shall be of the respective quality and works, materials, standards described in the Contract Documents and required by the Architect in accordance goods and with the provisions of the Contract. workmanship Provision of\n\n6.2 The Contractor shall upon the request of the Architect, provide him with vouchers or such ; vouchers other evidence to prove that the materials and goods comply with Clause 6.1. Inspection and\n\n6.3 The Contractor shall provide samples of materials and goods for testing before testing incorporation into the Works, The Architect may issue an AI requiring the Contractor to : open up for inspection any work covered up, or to arrange for or carry out any test on any materials and goods already incorporated in the Works or of any executed work. The cost of such opening up or testing together with the cost of making good shall be added to the Contract Sum unless:\n\n6.3(a) the cost is provided for in the Contract Bills;\n\n6.3(b) the inspection or test shows that the works, materials and goods were not in accordance with the Contract; or 6.3{c) the inspection or test was in the opinion of the Architect required in consequence of some prior negligence, omission, default and/or breach of contract by the Contractor. PAM Contract 2018 (With Quantities) 1] . Contractor’s\n\n6.4 The provisions of Clauses 6.2 and 6.3 shall not relieve the Contractor of his obligations to | obligation not execute the work and supply materials and goods in accordance with the Contract. relieved Work not in\n\n6.5 If the Architect finds any work, materials, goods or workmanship which is not in accordance with accordance with the Contract, the Architect shall instruct the Contractor in writing: the Contract |\n\n6.5(a) to remove from and not to bring to the Site such materials and goods; | ; ; |\n\n6.5(b) to demolish and reconstruct such work to comply with the Contract;\n\n6.5(c) to rectify such work as instructed by the Architect with no adjustment to the | Contract Sum; | 6.5(d)} to submit a method statement within seven (7) Days from receipt of the written. ° i instruction (or within such period as may be specified by the Architect in the [ instruction) proposing how such works, materials, goods or workmanship can be rectified. If the Architect accepts the Contractor’s proposal, the Contractor shall carry out the rectification work with no adjustment to the Contract Sum or alternatively, the Architect may reject the proposal and issue any other written instruction under this clause; or {\n\n6.5(e) with the consent of the Employer, to leave all or any such works, materials, | goods or workmanship in the Works subject to an appropriate set-off by the Employer under Clause 30.4 and the Contractor shall remain liable for the same. ; No compensation\n\n6.6 Compliance by the Contractor with a written instruction issued under Clause 6.5 shall not | for time and cost entitle the Contractor to an extension of time nor compensation for any loss and/or expense that may be incurred. Failure of\n\n6.7 If the Contractor fails or refuses to comply with a written instruction of the Architect issued. Contractor to under Clause 6.5, the Employer may without prejudice to any other rights or remedies | comply which he may possess under the Contract, employ and pay other Person to carry out the . subject matter of the written instruction. All costs incurred including any loss and expense shall be set-off by the Employer under Clause 30.4. | Warranties in\n\n6.8 If the Contract requires any manufacturer, sub-contractor or supplier to give a warranty or respect of guarantee in respect of any proprietary systems, materials and goods supplied, the | materials and Contractor shall procure such warranties or guarantees and submit to the Employer. The goods provision of such warranties or guarantees shall in no way relieve or release the Contractor | from any liabilities under the Contract."}, {"id": "clause-7.0", "kind": "clause", "num": "7.0", "title": "Royalties And Intellectual Property Rights", "subclauses": [{"num": "7.1", "title": "Indemnity to Employer"}, {"num": "7.2", "title": "Contractor's liability to pay"}, {"num": "7.3", "title": "Government royalties"}], "content": "7.0 Royalties And intellectual Property Rights | Indemnity to\n\n7.1 Subject to Clause 7.2, all royalties or other sums payable in respect of the supply and use in Employer carrying out the Works of any articles, processes, inventions or drawings shall be deemed i to have been included in the Contract Sum. The Contractor shall indemnify the Employer ; against all claims, proceedings, damages, costs and expenses which may be brought against | the Employer or to which he may be subjected to by reason of the Contractor infringing or being held to have infringed any such intellectual property rights. Contractor's\n\n7.2 Where in compliance with a written instruction, the Contractor has informed the Architect | liability to pay in writing that there may be an infringement of intellectual property rights but the Architect still instructs the Contractor in writing to comply, the Contractor shall not be liable for any such infringement. All royalties, damages or other monies which the Contractor may be liable to pay for such infringement shall be added to the Contract Sum. Government 73 Except where otherwise provided for in the Contract, the Contractor shall pay all royalties Government royalties, levies, rent and all other payments in connection with the Works."}, {"id": "clause-8.0", "kind": "clause", "num": "8.0", "title": "Site Agent", "subclauses": [{"num": "8.1", "title": "Site Agent"}, {"num": "8.2", "title": "Instructions to Site Agent"}, {"num": "8.3", "title": "Exclusion of Person employed on the Works"}], "content": "8.0 Site Agent Site Agent\n\n8.1 The Contractor shall appoint a competent person to be the Site Agent. The Site Agent for the purposes of the Contract shall be deemed to be the Contractor’s authorised site representative. The Site Agent shall be assisted by such assistants and supervisory staff as necessary to execute the Works efficiently and satisfactorily. The Site Agent shall be employed full time on Site and in the event that he has to be temporarily absent from the Site, the Contractor shall designate a deputy in his place. Instructions to\n\n8.2 The Contractor shall ensure that the Site Agent and such assistants and supervisory staff are Site Agent capable of receiving directions or instructions in English or Bahasa Malaysia. The Site Agent shall be deemed to be authorised by the Contractor to receive any directions given by the Site Staff or instructions given by the Architect and any such directions and instructions given shall be deemed to have been given to the Contractor. Exclusion of\n\n8.3 The Architect may instruct the Contractor to remove the Site Agent or any Person under the Person employed employment or control of the Contractor from the Site. The Architect shall not exercise this on the Works discretion unreasonably or vexatiously. On receipt of a written instruction, the Contractor shall immediately remove and replace such staff or any Person within a reasonable time and such staff or Person so removed, shall not again be employed on the Site. The Contractor shall not be entitled to any extension of time and additional cost in respect of any instruction given by the Architect under this clause. ,"}, {"id": "clause-9.0", "kind": "clause", "num": "9.0", "title": "Access To The Works", "subclauses": [{"num": "9.1", "title": "Access to the Works"}], "content": "9.0 Access To The Works Access to the\n\n9.1 The Architect, Consultant and their authorised representatives shall at all times have Works reasonable access to the Works and to the factories, workshops or other places where any construction plant, materials, goods and work are being fabricated, prepared or stored for the Contract. The Contractor shall ensure that all sub-contracts contain provisions entitling the Architect, Consultant and their authorised representatives to have such access."}, {"id": "clause-10.0", "kind": "clause", "num": "10.0", "title": "Site Staff", "subclauses": [{"num": "10.1", "title": "Duty of Site Staff"}, {"num": "10.2", "title": "Directions given by Site Staff"}], "content": "10.0 Site Staff Duty of Site Staff\n\n10.1 The Employer may from time to time appoint such number of Site Staff as the Employer shall deem necessary. The Site Staff shall act as inspectors under the direction of the Architect and the Contractor shall provide reasonable facilities for the performance of such duties. Directions given\n\n10.2 Any directions given to the Contractor or his Site Agent by the Site Staff shall be of no by Site Staff effect, unless given in writing in regard to a matter in respect of which the Site Staff have been expressly authorised in writing by the Architect. All such directions involving a Variation shall be of no effect, unless confirmed by an AI."}, {"id": "clause-11.0", "kind": "clause", "num": "11.0", "title": "Variations, Provisional And Prime Cost Sums", "subclauses": [{"num": "11.1", "title": "Definition of Variation"}, {"num": "11.2", "title": "No Variations required by Architect shall vitiate Contract"}, {"num": "11.3", "title": "Issue of Variations after Practical Completion"}, {"num": "11.4", "title": "AI on P.C. Sums and Provisional Sums"}, {"num": "11.5", "title": "Valuation of Variations and Provisional Sums"}, {"num": "11.6", "title": "Valuation rules"}, {"num": "11.7", "title": "Additional expense caused by Variation"}, {"num": "11.8", "title": "Access to Contractor's books and documents"}, {"num": "11.9", "title": "Variations and additional expenses added to Contract Sum"}], "content": "11.0 Variations, Provisional And Prime Cost Sums : Definition of\n\n11.1 The term “Variation” means the alteration or modification of the design, quality or quantity Variation of the Works including:\n\n11.1(a) the addition, omission or substitution of any work;\n\n11.1(b) the alteration of the kind or standard of any materials and goods to be used in the Works;\n\n11.1(c) the removal from the Site of any work executed or materials and goods brought thereon by the Contractor for the purposes of the Works other than work, materials and goods which are not in accordance with the Contract; and 11.1¢d) any changes to the provisions in the Contract with regards to: 11.1¢d)@) —_ any limitation of working hours; 11.1(d)Gi) working space; 11.1(d)(iii) access to or utilisation of any specific part of the Site; 11.1(d)(iv) the execution and completion of the work in any specific order; and 11.1{d)(v) _ the execution of temporary works, but shall exclude any changes intended to rectify any negligence, omission, default and/or breach of contract by the Contractor and such changes shall be executed by the Contractor entirely at his own cost. No Variations\n\n11.2 The Architect may issue an AI ordering a Variation or sanctioning any Variation made by required by the Contractor. No Variation ordered by the Architect or subsequently sanctioned by him Architect shall shall vitiate the Contract, Pending the valuation of the Variations, the Contractor shall carry vitiate Contract out with due diligence and expedition all Variations so instructed. ; | Issue of\n\n11.3 The Architect may issue instructions in writing requiring a Variation at any time before the Variations after issuance of the Certificate of Practical Completion. Thereafter, any AI requiring a Variation | Practical must be necessitated by obligations or compliance with the requirements of any Completion Appropriate Authority and Service Provider. | Al on P.C. Sums 114 The Architect shall issue AI in regard to the expenditure of P.C. Sums and Provisional and Provisional Sums included in the Contract Bills and of P.C. Sums which arise as a result of instructions Sums issued in regard to the expenditure of Provisional Sums. Valuation of\n\n11.5 All Variations shall be measured and valued by the Quantity Surveyor. Upon completion of Variations and the Variations, the Contractor shall submit complete details and particulars as required by Provisional Sums the Architect and Quantity Surveyor for valuation of Variations. Where any recording of site information and/or site measurements are carried out at the Site, the Contractor shall provide the Quantity Surveyor with such assistance as may be necessary to carry out the’ ; works and the Contractor shall be given the opportunity to be present to take such notes and | measurements as he may require. If the Quantity Surveyor is of the opinion that the details and particulars submitted by the Contractor are insufficient to enable him to carry out the | measurement and valuation, the Quantity Surveyor shall within twenty eight (28) Days ; from receipt of the Contractor’s submission, inform him of any deficiency in his j submission and may require the Contractor to provide such further details and particulars \\ within a further twenty eight (28) Days. When the Contractor has submitted sufficient details and particulars, the Quantity Surveyor shall measure and value the Variations within thirty days (30) Days or any other extended date as agreed between the Architect and ! Contractor. : Valuation rules\n\n11.6 The valuation of Variations and work executed by the Contractor for which a Provisional Quantity is included in the Contract and the expenditure of Provisional Sums (other than for f work for which a tender had been accepted under Clause 27.14) shall be made in : accordance with the following rules:\n\n11.6(a) where work is of a similar character to, is executed under similar conditions as, rt and does not significantly change the quantity of work as set out in the 1 Contract Documents, the rates and prices in the Contract Documents shall | | determine the valuation; i\n\n11.6(b) where work is of a similar character to work as set out in the Contract Documents but is not executed under similar conditions or is executed under similar conditions but there is a significant change in the quantity of work : | carried out, the rates and prices in the Contract Documents shall be the basis ; for determining the valuation which shall include a fair adjustment in the rates to take into account such difference; 11,6(c) where work is not of a similar character to work as set out in the Contract Documents, the valuation shall be at fair market rates and prices determined by the Quantity Surveyor;\n\n11.6(d) where work cannot be properly measured and valued in accordance with Clause 11.6(a), (b) or (c), the Contractor shall be allowed: 11.6(d)@i) ‘the daywork rates in the Contract Documents; or 11.6(d)Gji} where there are no such daywork rates in the Contract Documents, at the actual cost to the Contractor of his materials, additional construction plant and scaffolding, transport and labour for the work concerned, plus fifteen (15) percent, which . percentage shall include for the use of all tools, standing plant, standing scaffolding, supervision, overheads and profit. ; In either case, vouchers specifying the time spent daily upon the work, the workers' names, materials, additional construction plant, scaffolding and transport used shall be signed by the Site Agent and verified by the Site Staff and shall be delivered to the Architect and Quantity Surveyor at weekly intervals with the final records delivered not later than fourteen (14) Days after the work has been completed;\n\n11.6(e) the rates and prices in the Contract Documents shall determine the valuation of items omitted. If omissions substantially vary the conditions under which any remaining items of work are carried out, the prices of such remaining items shall be valued under Clause 11.6(a), (b) or (c); and }\n\n11.6(f) in respect of Provisional Quantities, the quantities stated in the Contract Documents shall be re-measured by the Quantity Surveyor based on the actual ! quantities executed within sixty (60) Days after the said works are completed. | The rates and prices in the Contract Documents shall determine their valuations. | Additional\n\n11.7 Where a Variation has caused or is likely to cause the Contractor to incur additional | expense caused expenses for which he would not be paid under any provisions in Clause 11.6, the | by Variation Contractor may make a claim for such additional expenses provided always that: 11.7(a)} the Contractor shall give written notice to the Architect of his intention to ; claim for such additional expenses together with an initial estimate of his | claim duly supported with all necessary calculations. Such notice must be , | . given within twenty eight (28) Days from the date of the Al or CAI giving rise to his claim. The giving of such written notice shall be acondition precedent to any entitlement to additional expenses that the Contractor may have under the Contract; and\n\n11.7(b) within twenty eight (28) Days of completing such Variation, the Contractor shall send to the Architect and Quantity Surveyor complete particulars of his claim for additional expenses together with all necessary calculations to substantiate his claims. If the Contractor fails to submit the required particulars within the stated time (or within such longer period as may be agreed in | writing by the Architect), it shall be deemed that the Contractor has waived his rights to any such additional expenses. | Access to\n\n11.8 The Contractor shall keep contemporaneous records to substantiate all his claims for Contractor’s additional expenses under Clause 11.7, and shall submit all particulars to the Architect and | books and Quantity Surveyor. The Architect and Quantity Surveyor shall have access to all books, documents documents, reports, papers or records in the possession, custody or control of the ; Contractor that are material to the claim and the Contractor shall provide free of charge a | copy each to the Architect and Quantity Surveyor when requested. All such documents shall remain available in accordance with this clause until all claims have been resolved. The Contractor shall use his best endeavour to ensure that all such similar documents in the possession, custody or control of sub-contractors and/or suppliers that are material to the claim are similarly available. Variations and\n\n11.9 As soon as the Architect and Quantity Surveyor have ascertained the amount of Variations additional and/or additional expenses claimed by the Contractor under Clause 11.7, the amount so expenses added ascertained shall be added to the Contract Sum. When an Interim Certificate is issued after to Contract Sum the date of ascertainment, such amount shall be included in the certificate."}, {"id": "clause-12.0", "kind": "clause", "num": "12.0", "title": "Contract Bills", "subclauses": [{"num": "12.1", "title": "Measurement of building works"}, {"num": "12.2", "title": "Correction of errors or omissions"}], "content": "12.0 Contract Bills Measurement of\n\n12.1 The quality and quantity of the work included in the Contract Sum shall be deemed to be building works those which are set out in the Contract Bills and unless otherwise expressly stated, shall be prepared in accordance with the principles of the Standard Method of Measurement of Building Works sanctioned by the Royal Institution of Surveyors Malaysia and currently in force. Correction of\n\n12.2 Unless otherwise expressly provided, the contract is a (Lump Sum (Contract Any error in errors or description, quantity or omission of items in the Contract Bills shall not vitiate the Contract omissions and shall be corrected by the Architect or Consultant,"}, {"id": "clause-13.0", "kind": "clause", "num": "13.0", "title": "Contract Sum", "subclauses": [{"num": "13.1", "title": "Contract Sum not to be adjusted or altered"}], "content": "13.0 Contract Sum Contract Sum\n\n13.1 The Contract Sum shall not be adjusted or altered in any way whatsoever, other than in not to be accordance with the express provisions of the Contract. Any arithmetical errors or any adjusted or errors in the prices and rates shall be corrected and/or rationalised by the Architect or altered Consultant without any change to the Contract Sum before the signing of the Contract."}, {"id": "clause-14.0", "kind": "clause", "num": "14.0", "title": "Materials And Goods", "subclauses": [{"num": "14.1", "title": "Materials and goods not to be removed"}, {"num": "14.2", "title": "Materials and goods included in certificates"}, {"num": "14.3", "title": "Responsibility for materials and goods"}, {"num": "14.4", "title": "Warranty of title of goods and materials"}], "content": "14.0 Materials And Goods Materials and 14,1 Materials and goods delivered to the Site for incorporation into the permanent works shall goods not to be not be removed until completion of the Works unless prior consent in writing from the removed Architect has been obtained, which consent shall not be unreasonably withheld or delayed. 3 Materials and\n\n14.2 Where the value of such materials and goods has in accordance with Clause 30.2 been | goods included in included in any Interim Certificate under which the Employer has effected payment, such certificates materials and goods shall become the property of the Employer. Responsibility for\n\n14.3 The Contractor shall be responsible for any loss and/or damage to such materials and goods ; materials and including materials and goods supplied by Nominated Sub-Contractors and Nominated goods Suppliers. Warranty of title\n\n14.4 The Contractor shall be deemed to have warranted that he has title free from encumbrances of goods and for such materials and goods upon inclusion of the value of such materials and goods in any materials applications for payments under Clause 30.1. In the event that the Contractor is found to have made a false warranty, any loss suffered by the Employer shall be made good by the Contractor or shall be set-off under Clause 30.4."}, {"id": "clause-15.0", "kind": "clause", "num": "15.0", "title": "Practical Completion And Defects Liability", "subclauses": [{"num": "15.1", "title": "Practical Completion"}, {"num": "15.2", "title": "Certificate of Practical Completion"}, {"num": "15.3", "title": "Contractor's failure to comply with undertaking"}, {"num": "15.4", "title": "Schedule of Defects"}, {"num": "15.5", "title": "Instruction to make good Defects"}, {"num": "15.6", "title": "Certificate of Making Good Defects"}], "content": "15.0 Practical Completion And Defects Liability . Practical\n\n15.1 The Works are Practically Completed when: Completion\n\n15.1(a) in the opinion of the Architect, the Employer can have full use of the Works for their intended purposes, notwithstanding that there may be works and defects of a minor nature still to be executed and the Contractor has given to . the Architect a written undertaking to make good and to complete such works ‘ and defects within a reasonable time specified by the Architect; and\n\n15.1(b) other requirements expressly stated in the Contract Documents as a pre- i requisite for the issuance of the Certificate of Practical Completion have been \\ complied with. Certificate of\n\n15.2 When the whole of the Works are Practically Completed, the Contractor shall forthwith : Practical give written notice to that effect to the Architect who shall within fourteen (14) Days do | Completion either one of the following: F\n\n15.2(a) if the Architect is of the opinion that the Works are not Practically Completed under Clause 15.1, the Architect shall give written notice to the Contractor with copy extended to the Nominated Sub-Contractors stating the reasons for his opinion and specifying the works that are incomplete and/or the conditions . ‘ that have not been complied with; or |\n\n15.2(b) if the Architect is of the opinion that the Works are Practically Completed ; under Clause 15.1, the Architect shall issue the Certificate of Practical Completion. The date of Practical Completion shall be: 15.2(b)(i) the date of receipt of the Contractor’s written undertaking to make good and to complete works and defects of a minor nature, where there are such works and defects; or 15.2(b)(ii) __the date of receipt of the Contractor’s written notice, where there are no works and defects of a minor nature. The Certificate of Practical Completion shall be issued to the Contractor with copies extended to the Employer and Nominated Sub-Contractors. Upon the issuance of Certificate of Practical Completion by the Architect, the Contractor shall forthwith return Site possession to the Employer. Contractor’s\n\n15.3 Where applicable, the Contractor shall comply with his undertaking to attend to the works failure to comply and defects of a minor nature under Clause 15.1(a) within the specified time. In the event ’ with undertaking the Contractor fails to comply with his undertaking, the Employer may without prejudice to any other rights and remedies which he may possess under the Contract do any one of the following:\n\n15.3(a) grant the Contractor additional ex-gratia time to be specified by the Architect to enable the Contractor to comply with his said undertaking;\n\n15.3(b) employ and pay other Person to execute any work which may be necessary to give effect to the Contractor’s said undertaking. All costs incurred including any loss and/or expense shall be set-off by the Employer under Clause 30.4; or\n\n15.3(c) accept to leave all or any such works and defects of a minor nature in the Works subject to an appropriate set-off under Clause 30.4. ] | Schedule of 13.4 Any Defects in the Works which appear within the Defects Liability Period shall be | Defects specified by the Architect in a schedule of defects which he shall deliver to the Contractor not later than fourteen (14) Days after the expiration of the Defects Liability Period. The Contractor shall make good the Defects specified within twenty eight (28) Days after | receipt of the schedule of defects (or within such longer period as may be agreed in writing ; by the Architect) at the Contractor’s cost. If the Contractor fails to attend to the Defects, the | Employer may, without prejudice to any other rights and remedies which he may possess under the Contract, employ and pay other Person to rectify the Defects and all costs incurred shall be set-off by the Employer under Clause 30.4. If the Architect with the | consent of the Employer, instructs the Contractor to leave the Defects in the Works, then an i appropriate deduction for such Defects not made good by the Contractor shall be set-off by | the Employer under Clause 30.4. Instruction to\n\n15.5 Notwithstanding Clause 15.4, the Architect may at any time during the Defects Liability - t make good Period issue an AI requiring any critical Defects which need urgent rectification to be made | Defects good within a reasonable time specified by the Architect at the Contractor’s cost. If the Contractor fails to attend to such Defects within the time specified by the Architect, the Employer may employ and pay other Person to rectify such Defects and all costs incurred shall be set-off by the Employer under Clause 30.4. | Certificate of\n\n15.6 Upon completion of making good all Defects which may have been required to be made Making Good good under Clause 15.4, the Contractor shall forthwith give written notice to the Architect Defects to that effect. The Architect shall within fourteen (14) Days do either one of the following:\n\n15.6(a) if the Architect is of the opinion that there is no Defects or the Coritractor has | made good all Defects, the Architect shall issue a Certificate of Making Good Detects and the date of making good Defects shall be the date of receipt of the | Contractor’s written notice. The Certificate of Making Good Defects shall be issued to the Contractor and copies shall be extended to the Employer and Nominated Sub-Contractors; or\n\n15.6(b) if the Architect is of the opinion that the Defects have not been made good, the Architect shall give written notice to the Contractor with copies to Nominated Sub-Contractors stating the reasons for the non-issuance of the Certificate of Making Good Defects. ."}, {"id": "clause-16.0", "kind": "clause", "num": "16.0", "title": "Partial Possession By Employer", "subclauses": [{"num": "16.1", "title": "Possession of Occupied Part with consent"}, {"num": "16.2", "title": "Possession of Occupied Part without consent"}, {"num": "16.3", "title": "Contractor to remove equipment"}], "content": "16.0 Partial Possession By Employer Possession of\n\n16.1 If at any time before Practical Completion of the Works, the Employer wishes to take Occupied Part possession and occupy any part of the Works (“the Occupied Part”) and the consent of the with consent Contractor (whose consent shall not be unreasonably delayed or withheld) has been obtained, then notwithstanding anything expressed or implied elsewhere in the Contract, the Employer may take possession of the Occupied Part and the following shall apply:\n\n16.1(a) within fourteen (14) Days from the date on which the Employer has taken possession of the Occupied Part, the Architect shall issue a Certificate of Partial Completion. The Certificate of Partial Completion shall state the Architect’s estimate of the approximate total value of the Occupied Part and for all purposes of Clause 16.0, the value so stated shall be deemed to be the total value of the Occupied Part;\n\n16.1(b) for the purposes of Clauses 15.4, 15.5 and 16.1(f), Practical Completion of the Occupied Part shall be deemed to have occurred and the Defects Liability | Period in respect of the Occupied Part shall be deemed to have commenced on the date which the Employer has taken possession;\n\n16.1(c) the Liquidated Damages under Clause 22.1 shall be reduced by the ratio of the estimated value of the Occupied Part to the Contract Sum;\n\n16.1(d) upon the issuance of the Certificate of Partial Completion, the Architect shall within fourteen (14) Days issue a certificate to release half the amount of the Retention Fund in the ratio of the estimated value of the Occupied Part to the Contract Sum. The Contractor shall be entitled to payment within the Period of Honouring Certificates;\n\n16.1(e) when in the opinion of the Architect all Defects in the Occupied Part which he may have required to be made good under Clause 15.4 or 15.5 have been made good, he shall issue a Certificate of Making Good Defects under Clause 15.6 in respect of the Occupied Part; and 16.18 upon the issuance of the Certificate of Making Good Defects of the Occupied Part, the Architect shall within fourteen (14) Days issue a certificate for the release of the remaining amount of the Retention Fund in respect of the Occupied Part. The Contractor shall be entitled to payment within the Period of Honouring Certificate. Possession of\n\n16.2 The Employer may, without prejudice to any other rights and remedies which he may Occupied Part possess under the Contract, enter and occupy such part of the Works prior to the completion without consent of the whole of the Works without the consent of the Contractor under Clause 16.1 provided always that: 16,2(a) the completion of the Works has been delayed and a Certificate of Non- Completion has been issued by the Architect under Clause 22.1; and\n\n16.2(b) such entry and occupation of the Occupied Part can be effected without any * unreasonable disturbance to the progress of the Contractor’s remaining works. In that event, the provisions of Clauses 16.1(a) to\n\n16.1(f) shall apply. Contractor to\n\n16.3 If the Employer takes possession of the Occupied Part under Clause 16.1 or 16.2, the remove Contractor shall upon the written instruction of the Architect remove his site facilities, equipment construction plant or equipment, materials and goods from the Occupied Part."}, {"id": "clause-17.0", "kind": "clause", "num": "17.0", "title": "Assignment And Sub-Contracting", "subclauses": [{"num": "17.1", "title": "Assignment by Employer"}, {"num": "17.2", "title": "Assignment by Contractor"}, {"num": "17.3", "title": "No sub-contracting"}], "content": "17.0 Assignment And Sub-Contracting Assignment by\n\n17.1 Other than assigning his rights, interests or benefits under the Contract to his financial Employer institution, the Employer shall not without the written consent of the Contractor (such consent shall not be unreasonably delayed or withheld) assign the same to other parties. Assignment by\n\n17.2 Other than assigning any payment due or to become due under the Contract to his financial Contractor institution, the Contractor shall not without the written consent of the Employer (such consent shall be at the sole discretion of the Employer) assign his rights, interests or benefits under the Contract to other parties. No sub-\n\n17.3 Except where otherwise provided by the Contract, the Contractor shall not wholly or contracting substantially sub-contract the Works. Where the Contractor sub-contracts labour only of craftsmen, skilled or semi-skilled workmen to carry out any portion of the Works, this shall not constitute sub-contracting within the meaning of this clause."}, {"id": "clause-18.0", "kind": "clause", "num": "18.0", "title": "Injury To Person Or Loss And/Or Damage Of Property And Indemnity To Employer", "subclauses": [{"num": "18.1", "title": "Contractor's indemnity against injury or death"}, {"num": "18.2", "title": "Contractor's indemnity against loss and/or damage"}, {"num": "18.3", "title": "Contractor's indemnity against claims by workmen"}, {"num": "18.4", "title": "Indemnities not to be defeated"}], "content": "| 18.0 Injury To Person Or Loss And/Or Damage Of Property And Indemnity To Employer | Contractor’s\n\n18.1 The Contractor shall be liable for and shall indemnify the Employer against any damage, indemnity expense, liability, loss, claim or proceedings whatsoever whether arising at common law or against injury or by statute in respect of personal injury to or death of any person arising out of or in the death course of or caused by the carrying out of the Works and provided always that the same is due to any negligence, omission, default and/or breach of contract by the Contractor or of any Person for whom the Contractor is responsible. Contractor’s\n\n18.2 The Contractor shall be liable for and shall indemnify the Employer against any damage, indemnity expense, liability, loss, claim or proceedings due to loss and/or damage of any kind against loss whatsoever to any property real or personal, including the Works and any other property of and/or damage the Employer, in so far as such loss and/or damage arises out of or in the course of or by reason of the execution of the Works and provided always that the same is due to any negligence, omission, default and/or breach of contract by the Contractor or of any Person for whom the Contractor is responsible. Contractor’s 18,3 The Contractor shall be liable for and shall indemnify the Employer against any damage, indemnity expense, liability, loss, claim or proceedings whatsoever arising out of claims by any and against claims by every workman employed in and for the execution of the Works and for payment of workmen compensation under or by virtue of the Workmen’s Compensation Act 1952 and the Employees’ Social Security Act 1969. Indemnnities not\n\n18.4 The indemnities given by the Contractor under Clauses 18.1 to\n\n18.3 shall not be defeated or to be defeated reduced by reason of any negligence or omission of the Employer, Architect, Consultant or other authorised representatives in failing to supervise or control the Contractor’s site operation or methods of working or temporary work or to detect or prevent or remedy defective work or to ensure proper performance of any obligation of the Contractor under the Contract."}, {"id": "clause-19.0", "kind": "clause", "num": "19.0", "title": "Insurance Against Injury To Person And Loss And/Or Damage Of Property", "subclauses": [{"num": "19.1", "title": "Contractor to insure against injury to Person and loss and/or damage of property"}, {"num": "19.2", "title": "Employee's social security scheme for local workmen"}, {"num": "19.3", "title": "Insurance for local workmen not subject to SOCSO"}, {"num": "19.4", "title": "Workmen's compensation insurance for foreign workers"}, {"num": "19.5", "title": "Placing of insurance with licensed insurance companies"}], "content": "19.0 Insurance Against Injury To Person And Loss And/Or Damage Of Property Contractor to\n\n19.1 Without prejudice to his liability to indemnify the Employer under Clause 18.0, the insure against Contractor shall, as a condition precedent to the commencement of any work under the ; injury to Person Contract, take out and maintain in the joint names of the Employer, Contractor, sub- and loss and/or contractor and all interested parties in respect of personal injuries or death and injury or loss damage of and/or damage of property real or personal arising out of or in the course of or by reason of property the execution of the Works and whether or not such injury, death, loss and/or damage is | caused by negligence, omission, default and/or breach of contract by the Contractor, ‘ Employer, sub-contractor and interested parties and any of their servants and agents. Such | insurance policy shall provide cover in respect of third party liability for personal injury or death and damage to property for the amounts stated in the Appendix. If the Contractor having regard to his indemnity to the Employer under Clause 18.0 desires to increase any of - ¥ the insurance coverage, he shall do so and allow for any additional cost. The insurance | policy shall include the following endorsements: |\n\n19.1(a) a “cross liability” endorsement to provide insurance cover to the Employer and | Contractor and any other parties involved in the Works as though they are separately insured for their respective rights and interest; 19,1(b) an endorsement to the effect that the Architect, Consultant and any other ! professional consultants (as applicable) and their employees and representatives, Site Staff, employees and representatives of the Employer, are deemed to be third parties; ; 19.1{c) an endorsement for waiver of all expressed or implied rights of subrogation or F recoveries against the insured; and\n\n19.1(d) an endorsement for automatic extension or renewal of the insurance up to the issuance of the Certificate of Making Good Defects. Employees’ social\n\n19.2 Without prejudice to his liability to indemnify the Employer under Clause 18.0, the security scheme Contractor shall register or cause to register all local workmen employed on the Works and for local who are subject to registration under the Employees’ Social Security Scheme (hereinafter . workmen referred to as “SOCSO”) in accordance with the Employees’ Social Security Act 1969 and shall cause all sub-contractors to comply with the same provisions. The Contractor shall | make payment of all contributions and cause all sub-contractors to make similar payments from time to time when the same ought to be paid. Insurance for\n\n19.3 Without prejudice to his liability to indemnify the Employer under Clause 18.0, the local workmen Contractor shall, as a condition precedent to the commencement of any work under the not subject to Contract, take out and maintain in the joint names of the Employer and Contractor and shall SOCSO cause all sub-contractors to take out and maintain a similar insurance policy for local workmen who are not subject to registration under SOCSO. Such insurance policy shall be effected and maintained as necessary to cover all liabilities including common law liability in respect of any claim which may arise in the course of the execution of the Works. The insurance policy shall be valid up to the Completion Date and the extended maintenance cover shall be for the Defects Liability Period plus a further three (3) Months. If the Contractor is unable to complete by the Completion Date or complete making good the Defects within the insured period, he shall ensure that the insurance is accordingly extended for the same period of delay. The Contractor shall effect the said extension of the insurance cover not less than one (1) Month before the expiry of the insurance currently in force. Workmen’s\n\n19.4 Without prejudice to his liability to indemnify the Employer under Clause 18.0, the compensation Contractor shall, as a condition precedent to the commencement of any work under the insurance for Contract, take out and maintain in the name of the Contractor and shall cause all sub- foreign workers contractors to take out and maintain a similar insurance policy for all foreign workers employed on the Works as required by the Workmen’s Compensation Act 1952 and Workmen’s Compensation (Foreign Worker’s Compensation Scheme) (Insurance) Order 1998. Such insurance policy shall be effected and maintained as necessary to cover all liabilities including common law liability in respect of any claim which may arise in the course of the execution of the Works. The insurance policy shall be valid up to the Completion Date and the extended maintenance cover shall be for the Defects Liability Period plus a further three (3) Months. If the Contractor is unable to complete by the Completion Date or complete making good the Defects within the insured period, he shail ensure that the insurance is accordingly extended for the same period of delay. The Contractor shall effect the said extension of the insurance cover not less than one (1) Month before the expiry of the insurance currently in force. oT : Placing of\n\n19.5 The insurance referred to in Clauses 19.1, 19.2, 19.3 and 19.4 shall be placed with licensed insurance with insurance companies approved by the Employer, and the Contractor shall deposit with the licensed Employer the policy and the receipt of premiums paid with copies extended to the Architect insurance and Consultant. If the Contractor makes default in insuring or continuing to insure as companies aforesaid, the Employer may (but is not obligated to) insure against any risks in respect of which the default has occurred and the amount of premiums and any other cost incurred or paid by the Employer shall be set-off by the Employer under Clause 30.4."}, {"id": "clause-20.A", "kind": "clause", "num": "20.A", "title": "Insurance Of New Buildings/Works — By The Contractor", "subclauses": [{"num": "20.A.1", "title": "Contractor's risks - new buildings/works"}, {"num": "20.A.2", "title": "Additional risks to be covered under the insurance"}, {"num": "20.A.3", "title": "Placing of insurance with licensed insurance companies"}, {"num": "20.A.4", "title": "Application of insurance claim proceeds"}], "content": "**20.A Insurance Of New Buildings/Works — By The Contractor Contractor's\n\n20.A.1 Without prejudice to his liability to indemnify the Employer under Clause 18.0, the risks - new Contractor shall, as a condition precedent to the commencement of any work under the, buildings/ works Contract, take out and maintain in the joint names of the Employer, Contractor, sub- contractors and all interested parties a CAR Insurance policy for a value not less than the Contract Sum, plus the sum to cover professional fees for reinstatement and the sum to 3 cover the removal of debris all as stated in the Appendix. Unless covered by the standard | CAR Insurance policy, the insurance shall have endorsements to cover against loss and/or damage by fire, lightning, explosion, earthquake, volcanism, tsunami, storm, cyclone, fe flood, inundation, landslide, theft, ground subsidence, existing underground cables and/or ji pipes or other underground facilities, bursting or overflowing of water tanks, apparatus or : pipes, aircraft and other aerial devices or articles dropped therefrom, strike, riot and civil commotion, malicious damage, trespass, cessation of work whether total or partial, vibration and weakening of support. Unless otherwise insured by the Contractor, the CAR Insurance policy will exclude cover for construction plant, tools and equipment owned or hired by the Contractor or any sub-contractors. The Contractor shall keep such Works so insured notwithstanding an
