y arrangement for Sectional Completion under Clause 21.0 or Partial Possession under Clause 16.0. The insurance policy shall be valid up to the | Completion Date and the extended maintenance cover shall be for the Defects Liability Period plus a further three (3) Months. If the Contractor is unable to complete by the q Completion Date or complete making good the Defects within the insured period, he shall , ensure that the insurance is accordingly extended for the same period of delay. The Contractor shall effect the said extension of the insurance cover not less than one (1) Month before the expiry of the insurance currently in force. Where deductibles are specified in the | Appendix or in the insurance policy, the Contractor shall bear the amount of all deductibles. , The insurance policy shall also include the endorsement under Clauses 19.1(a) to (d). Additional risks\n\n20.A.2 Any additional risks or endorsements in addition to those stated in Clause 20.A.1 which to be covered may be required to be covered under the CAR Insurance policy shall be specified in the under the Contract Bills. If the Contractor having regard to his indemnity to the Employer under insurance Clause 18.0, desires to have any additional endorsements to the insurance in addition to the risks specified, he shall do so at his own cost. | Placing of 20.4.3 The insurance referred to in Clause 20.A shall be placed with licensed insurance companies | insurance with approved by the Employer, and the Contractor shall deposit with the Employer the policy i, licensed and the receipt of premiums paid. If the Contractor makes default in insuring or continuing ; insurance to insure as aforesaid, the Employer may insure against any risks in respect of which the companies default has occurred and the amount of premiums and any other cost incurred or paid by the Employer shall be set-off by the Employer under Clause 30.4. Application of\n\n20.A.4 Upon the occurrence of any loss and/or damage to the Works or unfixed materials and insurance claim goods prior to Practical Completion of the Works from any cause whatsoever, and proceeds notwithstanding that settlement of any insurance claim has not been completed, the Contractor shall with due diligence restore, replace or repair the same, remove and dispose . of any debris and proceed with the carrying out and completion of the Works. All money if and when received from the insurance under this clause shall be paid in the first place to the Employer. The Employer shall retain the amount paid by the insurance companies in respect of professional fees for reinstatement and pay the balance to the Contractor and/or , Nominated Sub-Contractors by installments under separate certificates to be issued by the Architect. The Contractor shall not be entitled to any additional payments in respect of the restoration of the damaged work and replacement or repair of any unfixed materials and goods and the removal and disposal of debris other than the monies received under the aforesaid insurance. ** Strike out Clause 20.A, 20.B or 20.C as appropriate"}, {"id": "clause-20.B", "kind": "clause", "num": "20.B", "title": "Insurance Of New Buildings/Works — By The Employer", "subclauses": [{"num": "20.B.1", "title": "Insurance by Employer"}, {"num": "20.B.2", "title": "Additional risks required by the Contractor"}, {"num": "20.B.3", "title": "Maintenance of policy"}, {"num": "20.B.4", "title": "Failure of Employer to insure"}, {"num": "20.B.5", "title": "Application of insurance claim proceeds"}], "content": "**20.B Insurance Of New Buildings/Works - By The Employer Insurance by\n\n20.B.1 Without prejudice to the Contractor’s liability to indemnify the Employer under Clause Employer 18.0, the Employer shall, as a condition precedent to the commencement of any work under the Contract, take out and maintain in the joint names of the Employer, Contractor, sub- contractors and all interested parties a CAR Insurance policy for a value not less than the Contract Sum, plus the sum to cover professional fees for reinstatement and the sum to cover the removal of debris all as stated in the Appendix. Unless covered by the standard CAR Insurance policy, the insurance shall have endorsements to cover against loss and/or damage by fire, lightning, explosion, earthquake, volcanism, tsunami, storm, cyclone, | flood, inundation, landslide, ground subsidence, existing underground cables and/or pipes or other underground facilities, bursting or overflowing of water tanks, apparatus or pipes, | aircraft and other aerial devices or articles dropped therefrom, strike, riot and civil - commotion, malicious damage, trespass, cessation of work whether total or partial, vibration and weakening of support. Unless separately required by the Contractor at his own cost, the CAR Insurance policy will exclude cover for construction plant, tools and equipment owned or hired by the Contractor or any sub-contractor, The Employer shall keep such Works so insured notwithstanding any arrangement for Sectional Completion under Clause 21.0 or Partial Possession under Clause 16.0. The insurance policy shall be valid up to the Completion Date and the extended maintenance cover shall be for the Defects Liability Period plus a further three (3) Months. If the Contractor is unable to complete by the Completion Date or complete making good the Defects within the insured period, the Employer shall ensure that the insurance is accordingly extended for the same period of delay. The Employer shall effect the said extension of the insurance cover not less than one (1) Month before the expiry of the insurance currently in force. Where deductibles are specified in the Appendix or in the insurance policy, the Contractor shall bear the amount of all deductibles. The insurance policy shall also include the endorsement under Clauses 19.1(a) to (d). Additional risks\n\n20.B.2 Any additional risks or endorsements which vary from those stated in Clause 20.B.1 shall | required by the be specified in the Contract Bills, and the Employer shall ensure that the risks specified in Contractor the Contract Bills are covered by the CAR Insurance policy. If the Contractor having regard to his indemnity to the Employer under Clause 18.0, desires to have further additional endorsements to the insurance in addition to the risks specified, he shall do so at his own . cost, Maintenance of\n\n20.B.3 The Employer shall maintain a proper insurance policy against the aforesaid risks and such policy policy and receipt for the last premium paid for its renewal shall, upon the request of the Contractor, be produced for his inspection. Failure of\n\n20.B.4 If the Employer at any time upon the request of the Contractor fails to produce any receipt Employer to showing such a policy as aforesaid to be effective, then the Contractor may take out and insure maintain in the joint names of the Employer, Contractor, sub-contractors and all interested parties, the CAR Insurance policy as required under Clauses 20.B.1 and 20.B.2. The Contractor upon production of the receipt of any premium paid by him shall be entitled to have the amount added to the Contract Sum. Application of\n\n20.B.5 Upon the occurrence of any loss and/or damage to the Works or unfixed materials and insurance claim goods prior to Practical Completion of the Works from any cause whatsoever proceeds notwithstanding that settlement of any insurance claim has not been completed, the Contractor shall with due diligence restore, replace or repair the same, remove and dispose of any debris and proceed with the carrying out and completion of the Works. All money if and when received from the insurance under this clause shall be paid in the first place to the | Employer. The Employer shall retain the amount paid by the insurance companies in : respect of professional fees for reinstatement and pay the balance to the Contractor and/or | Nominated Sub-Contractors by installments under separate certificates issued by the Architect, The Contractor shall not be entitled to any additional payments in respect of the restoration of the damaged work and replacement or repair of any unfixed materials and | goods and the removal and disposal of debris other than the monies received under the aforesaid insurance. ’ ** Strike out Clause 20.4, 20.B or 20.C as appropriate"}, {"id": "clause-20.C", "kind": "clause", "num": "20.C", "title": "Insurance Of Existing Building Or Extension — By The Employer", "subclauses": [{"num": "20.C.1", "title": "Employer's risks - existing building or extension"}, {"num": "20.C.2", "title": "Additional risks required by the Contractor"}, {"num": "20.C.3", "title": "Maintenance of insurance by Employer"}, {"num": "20.C.4", "title": "Failure of Employer to insure"}, {"num": "20.C.5", "title": "Application of insurance claim proceeds"}], "content": "**20.C Insurance Of Existing Building Or Extension - By The Employer Employer's risks\n\n20.C.1 Without prejudice to the Contractor’s liability to indemnify the Employer under Clause - existing 18.0, the Employer shall, as a condition precedent to the commencement of any work under building or the Contract, take out and maintain in the joint names of the Employer, Contractor, sub- extension contractors and all interested parties a CAR Insurance policy for a value not less than the Contract Sum, plus the value of the existing structure together with all the contents owned by the Employer or for which he is responsible, the sum to cover professional fees for reinstatement and the sum to cover the removal of debris all as stated in the Appendix. Unless covered by the standard CAR Insurance policy, the insurance shall have endorsements to cover against loss and/or damage by fire, lightning, explosion, earthquake, volcanism, tsunami, storm, cyclone, flood, inundation, landslide, ground subsidence, existing underground cables and/or pipes or other underground facilities, bursting or overflowing of water tanks, apparatus or pipes, aircraft and other aerial devices or articles , dropped therefrom, strike, riot and civil commotion, malicious damage, trespass, cessation of work whether total or partial, vibration and weakening of support. Unless separately required by the Contractor at his own cost, the CAR Insurance policy will exclude cover for construction plant, tools and equipment owned or hired by the Contractor or any sub- contractor. The Employer shall keep such Works so insured notwithstanding any arrangement for Sectional Completion under Clause 21.0 or Partial Possession under Clause 16.0. The insurance policy shall be valid up to the Completion Date and the extended maintenance cover shall be for the Defects Liability Period plus a further three (3) Months. If the Contractor is unable to complete by the Completion Date or complete making good the Defects within the insured period, the Employer shall ensure that the insurance is accordingly extended for the same period of delay. The Employer shall effect the said extension of the insurance cover not less than one (1) Month before the expiry of the insurance currently in force. Where deductibles are specified in the Appendix or in the insurance policy, the Contractor shall bear the amount of all deductibles. The insurance policy shall also include the endorsement under Clauses 19.1(a) to (a). Additional risks\n\n20.C.2 Any additional risks or endorsements which vary from those stated in Clause 20.C.1 shall required by be specified in the Contract Bills, and the Employer shall ensure that the risks specified in Contractor the Contract Bills are covered by the CAR Insurance policy. If the Contractor having regard to his indemnity to the Employer under Clause 18.0, desires to have further additional endorsements to the insurance in addition to the risk specified, he shall do so at his own cost. - Maintenance of\n\n20.C.3 The Employer shall maintain a proper insurance policy against the aforesaid risks and such : insurance by policy and receipt for the last premium paid for its renewal shall, upon the request of the Employer Contractor, be produced for his inspection. Failure of\n\n20.C.4 If the Employer at any time upon the request of the Contractor fails to produce any receipt Employer to showing as aforesaid to be effective, then the Contractor may take out and maintain in the insure joint names of the Employer, Contractor, sub-contractors and all interested parties, the CAR Insurance policy as required under Clauses 20.C.1 and 20.C.2. The Contractor upon production of the receipt of any premium paid by him shall be entitled to have the amount added to the Contract Sum. Application of\n\n20.C.5 Upon the occurrence of any loss and/or damage to the Works or unfixed materials and insurance claim goods prior to Practical Completion of the Works from any cause whatsoever proceeds notwithstanding that settlement of any insurance claim has not been completed, the Contractor shall with due diligence restore, replace or repair the same, remove and dispose of any debris and proceed with the carrying out and completion of the Works including the reinstatement of the existing structure, All money if and when received from the insurance under this clause shall be paid in the first place to the Employer. The Employer shall retain the amount paid by the insurance companies in respect of professional fees for reinstatement and pay the balance to the Contractor and/or Nominated Sub-Contractors by installments under separate certificates issued by the Architect. The Contractor shall not be entitled to any additional payments in respect of the restoration of the damaged work and replacement or repair of any unfixed materials and goods and the removal and disposal of debris other than the monies received under the aforesaid insurance. ** Strike out Clause 20.A, 20.B or 20.C as appropriate"}, {"id": "clause-21.0", "kind": "clause", "num": "21.0", "title": "Date Of Commencement, Postponement And Date For Completion", "subclauses": [{"num": "21.1", "title": "Commencement and Completion"}, {"num": "21.2", "title": "Sectional Commencement Dates"}, {"num": "21.3", "title": "Sectional Completion Dates"}, {"num": "21.4", "title": "Postponement or suspension of the Works"}], "content": "21.0 Date Of Commencement, Postponement And Completion Date Commencement\n\n21.1 On the Date of Commencement, possession of the Site shall be given to the Contractor who and Completion shall commence the execution of the Works and regularly and diligently proceed with and | complete the same on or before the Completion Date. In the event there is a delay by the Employer in giving possession of the Site to the Contractor, the Architect shall grant an extension of time under Clause 23.8(g). Provided always that the delay in giving possession of the Site does not exceed the Period of Delay stated in the Appendix, the Contractor shall not be entitled to determine his own employment under the Contract. | Sectional\n\n21.2 Where there are different Dates of Commencement for sections of the Works, these shall be Commencement stated in the Appendix. | Dates ° Sectional\n\n21.3 Where there are different Completion Dates for sections of the Works stated in the Contract | Completion Documents, the Architect shall issue a Certificate of Sectional Completion when the Dates sections of the Works are Practically Completed. Only the provisions in the Contract in | regard to Practical Completion and the Defects Liability Period under Clause 15.0, t extension of time under Clause 23.0, Liquidated Damages under Clause 22.0 and release of Retention Fund under Clause 30.6 shall apply with necessary changes as if each such section was a separate and distinct contract, Postponement or\n\n21.4 The Architect may issue an AI in regard to the postponement or suspension ofall or any | suspension of the part of the Works to be executed under the Contract for a continuous period not exceeding i Works the Period of Delay stated in the Appendix. If the insurance is covered by the Contractor under Clauses 19.0 and 20.A, the Contractor shall ensure full insurance coverage for the whole period of postponement or suspension or if the insurance is covered by the Employer under Clause 20.B or 20.C, the Employer shall ensure similar insurance coverage. ;"}, {"id": "clause-22.0", "kind": "clause", "num": "22.0", "title": "Damages For Non-Completion", "subclauses": [{"num": "22.1", "title": "Liquidated Damages and Certificate of Non-Completion"}, {"num": "22.2", "title": "Agreed Liquidated Damages amount"}, {"num": "22.3", "title": "Certificate of Non-Completion revoked by subsequent Certificate of Extension of Time"}], "content": "22.0 Damages For Non-Completion Liquidated\n\n22.1 If the Contractor fails to complete the Works by the Completion Date, and the Architect is \" Damages and of the opinion that the same ought reasonably so to have been completed, the Architect Certificate of shall issue a Certificate of Non-Completion. Upon the issuance of the Certificate of Non- | Non-Completion Completion, the Contractor shall pay or allow to the Employer a sum calculated at the rate i stated in the Appendix as Liquidated Damages for the period from the Completion Date to the date of Practical Completion. The Employer may recover such sum as a debt or may deduct such sum from any monies due or to become due to the Contractor under the | Contract or the Employer may recover such sum from the Performance Bond. The | Employer shall inform the Contractor in writing of such deduction or such debt due from | the Contractor. The imposition of Liquidated Damages by the Employer shall not be taken Hi into account by the Architect in the issuance of payment certificates and Final Certificate, ' and is not subject to the set-off procedures under Clause 30.4 and adjudication. Agreed\n\n22.2 The Liquidated Damages stated in the Appendix is a genuine pre-estimate of the loss and/or | Liquidated damage which the Employer will suffer in the event that the Contractor is in breach of ! Damages amount Clauses 21.0 and 22.0. The parties agree that by entering into the Contract, the Contractor shail pay to the Employer the said amount, if the same becomes due without the need for | the Employer to prove his loss and/or damage unless the contrary is proven by the Contractor. | | i Certificate of\n\n22.3 In the event the Architect issues a Certificate of Extension of Time under Clauses 23.4, iil Non-Completion 23.9 and 23.10 which has the effect of fixing a Completion Date which is later than the date revoked by stated in a Certificate of Non-Completion previously issued, such certificate shall have the HN subsequent effect of revoking the Certificate of Non-Completion earlier issued. The Employer shall | Certificate of then revise the amount of Liquidated Damages he is entitled to retain. In the event the Extension of amount of Liquidated Damages retained exceeds the amount the Employer is entitled to Time retain, he shall repay the surplus amount to the Contractor within the Period of Honouring Certificates from the date of the latest Certificate of Extension of Time. If the Works is not completed by the Completion Date stated in such Certificate of Extension of Time, the Architect shall issue a further Certificate of Non-Completion."}, {"id": "clause-23.0", "kind": "clause", "num": "23.0", "title": "Extension Of Time", "subclauses": [{"num": "23.1", "title": "Submission of notice and particulars for extension of time"}, {"num": "23.2", "title": "Delay by Nominated Sub-Contractor"}, {"num": "23.3", "title": "Insufficient information"}, {"num": "23.4", "title": "Certificate of Extension of Time"}, {"num": "23.5", "title": "Other consideration for giving extension of time"}, {"num": "23.6", "title": "Contractor to prevent delay"}, {"num": "23.7", "title": "Notification to Nominated Sub-Contractors"}, {"num": "23.8", "title": "Relevant Events"}, {"num": "23.9", "title": "Extension of time after the issuance of Certificate of Non-Completion"}, {"num": "23.10", "title": "Architect's review of extension of time after Practical Completion"}], "content": "23.0 Extension Of Time Submission of\n\n23.1 If the Contractor is of the opinion that the completion of the Works is or will be delayed notice and beyond the Completion Date by any of the Relevant Events stated in Clause 23.8, he may particulars for apply for an extension of time provided always that: extension of time {i\n\n23.1(a) the Contractor shall give written notice to the Architect his intention to claim for such extension of time together with an initial estimate of the extension of time he may require supported with all particulars of the cause of delay. Such notice must be given within twenty eight (28) Days from the date of the Al, CAI or the commencement of the Relevant Event, whichever is earlier. The giving of such written notice shall be a condition precedent to an entitlement of extension of time; and\n\n23.1(b) within twenty eight (28) Days of the end of the cause of delay, the Contractor shall send to the Architect his final claim for extension of time duly supported with all particulars to enable the Architect to assess any extension of time to be granted. If the Contractor fails to submit such particulars within the stated time (or within such longer period as may be agreed in writing by the Architect), it shall be deemed that the Contractor has assessed that such Relevant Event will” not delay the completion of the Works beyond the Completion Date. Delay by\n\n23.2 Where the particulars of the written notice given under Clause 23.1 include references to Nominated Sub- Nominated Sub-Contractors, the Contractor shall forthwith send a copy of such written Contractor notice and particulars to the Nominated Sub-Contractor concermed. Insufficient\n\n23.3 If the Architect is of the opinion that the particulars submitted by the Contractor are information insufficient to enable him to decide on the application for extension of time, the Architect shall within twenty eight (28) Days from receipt of the Contractor’s particulars under Clause 23.1(b), inform him of any deficiency in his submission and may require the Contractor to provide such further particulars within a further twenty eight (28) Days or within such period of time as may be stated by the Architect in writing. Certificate of\n\n23.4 When the Contractor has submitted sufficient particulars for the Architect’s consideration, Extension of the Architect shall subject to Clauses 23.5,\n\n23.6 and 23.8, consider the Contractor’s Time submission and shall either reject the Contractor’s application with reasons or issue a Certificate of Extension of Time with details within six (6) Weeks from the receipt of sufficient particulars. The Architect may issue the written notice of rejection or the Certificate of Extension of Time before or after the Completion Date. Other\n\n23.5 In assessing the extension of time, the Architect may take into account the following: : consideration for extension of time\n\n23.5(a) the effect or extent of any work omitted under the Contract, provided always that the Architect shall not fix a Completion Date earlier than the Completion Date stated in the Appendix; and\n\n23.5(b) any other Relevant Events which in the Architect’s opinion will have an effect on the Contractor’s entitlement to an extension of time. Contractor to 23.6 The Contractor shall constantly use his best endeavour to prevent or reduce delay in the prevent delay progress of the Works, and to do all that may reasonably be required to prevent and reduce delay or further delay in the completion of the Works beyond the Completion Date. Notification to\n\n23.7 The Architect shall notify every Nominated Sub-Contractor in writing of each decision of Nominated Sub- the Architect when fixing a later Completion Date. Contractors Relevant Events\n\n23.8 The following are the Relevant Events referred to in Clause 23.0:\n\n23.8(a) Force Majeure;\n\n23.8(b) exceptionally inclement weather;\n\n23.8(c) loss and/or damage occasioned by one or more of the contingencies referred to in Clause 20.A, 20.B or 20.C as the case may be, provided always that the same is not due to any negligence, omission, default and/or breach of contract by the Contractor and/or Nominated Sub-Contractors;\n\n23.8(d) civil commotion, strike or lockout affecting any of the trades employed upon the Works or any of the trades engaged in the preparation, manufacture or transportation of any materials and goods required for the Works; the Contractor not having received in due time the necessary documents under Clauses 3.3(a) and 3.3(b); 23.8 the Contractor not having received in due time the necessary AI (including il those for or in regard to the expenditure of P.C. Sums and Provisional Sums, ] further drawings, details, levels and any other information) for which he had | specifically applied in writing to the Architect. The Contractor’s application | must be submitted to the Architect in sufficient time before the commencement of construction of the affected works, to enable the Architect | to issue the necessary AI within a period which would not materially affect the Hl progress of the affected works, having regard to the Completion Date. | Provided always that the AI was not required as a result of any negligence, omission, default and/or breach of contract by the Contractor and/or Nominated Sub-Contractors;\n\n23.8(g) delay by the Employer in giving possession of the Site or any section of the Site in accordance with Clauses 21.1 and 21.2;\n\n23.8(h) compliance with AI issued by the Architect under Clausesel:45)11.2,and/21.4; : 23.80) delay on the part of Nominated Sub-Contractors for the reasons set out in i Clauses 21.4(a) to\n\n21.4(x) of the PAM Sub-Contract 2018;\n\n23.8(j) re-nomination of Nominated Sub-Contractors as set out in Clause 27.11;\n\n23.8(k) delay on the part of craftsmen, tradesmen or other contractors employed or | engaged by the Employer in executing work not forming part of the Contract or the failure to execute such work; rs 23.80) delay or failure in the supply of materials and goods which the Employer had | agreed to supply for the Works; |\n\n23.8(m) the opening up for inspection of any work covered up, testing any materials, goods or executed work in accordance with Clause 6.3, unless the inspection | or test: | 23.8(m)(i) is provided for in the Contract Bills; , 23.8(m)(ii) shows that the works, materials and goods were not in : accordance with the Contract; or | 23.8(m)(iii) is required by the Architect in consequence of some prior | negligence, omission, default and/or breach of contract by the | Contractor; |\n\n23.8(n) any act of prevention or breach of contract by the Employer;\n\n23.8(0) war damage under Clause 32.1;\n\n23.8(p) compliance with AI issued in connection with the discovery of antiquities under Clause 33.1;\n\n23.8(q) compliance with anyschanges»to-anyJaw, regulations, by-law or terms and onditions of any Appropriate Authority and Service Provider,\n\n23.8(r) delay caused by any Appropriate Authority and Service Provider in carrying out, or failure to carry out their work which affects the Contractor’s work | progress, provided always that such delay is not due to any negligence, omission, default and/or breach of contract by the Contractor and/or | Nominated Sub-Contractors; |\n\n23.8(s) appointment of a replacement Person under Articles 3, 4, 5 and 6;\n\n23.8(t) compliance with AI issued in connection with disputes with neighbouring property owners provided always that such dispute is not caused by negligence, omission, default and/or breach of contract by the Contractor and/or Nominated Sub-Contractors;\n\n23.8(u) delay as a result of the execution of work for which a Provisional Quantity is included in the Contract Bills which in the opinion of the Architect is not a reasonably accurate forecast of the quantity,of work required,\n\n23.8(v) failure of the Employer to give in due time entry to or exit from the Site or any part through or over any land, by way of passage adjoining or connected to the Site and in possession or control of the Employer;\n\n23.8(w) suspension by the Contractor of his obligations under Clauses 30.7 and 30.8;\n\n23.8(x) suspension of the whole or part of the Works by order of an Appropriate Authority provided the same is not due to any negligence, omission, default and/or breach of contract by the Contractor and/or Nominated Sub- Contractors; and 23.8{y) any other ground for extension of time expressly stated in the Contract. Extension of time\n\n23.9 Where a Relevant Event occurs after the issuance of the Certificate of Non-Completion, the * after the issuance Architect shall, subject to Clauses 23.1 to 23.7, grant an extension of time. The extension of of Certificate of time granted shall be added to the Completion Date of the Works or any section of the Non-Completion Works. Architect’s\n\n23.10 The Architect may within twelve (12) Weeks after the date of Practical Completion review | review of and fix a Completion Date later than that previously fixed, if in his opinion the fixing of | extension of time such later Completion Date is fair and reasonable having regard to any of the Relevant after Practical Events, whether upon reviewing a previous decision or otherwise and whether or not a Completion Relevant Event has been specifically notified by the Contractor under Clause 23.1. No such final review of extension of time shall result in a decrease in any extension of time already granted by the Architect. In the event the fixing of such later Completion Date affects the amount of Liquidated Damages the Employer is entitled to retain, he shall repay any surplus amount to the Contractor within the Period of Honouring Certificates."}, {"id": "clause-24.0", "kind": "clause", "num": "24.0", "title": "Loss And/Or Expense Caused By Matters Affecting The Regular Progress Of The Works", "subclauses": [{"num": "24.1", "title": "Loss and/or expense caused by matters affecting the regular progress of the Works"}, {"num": "24.2", "title": "Access to Contractor's books and documents"}, {"num": "24.3", "title": "Matters materially affecting the regular progress of the Works"}, {"num": "24.4", "title": "Loss and/or expense to be included in certificate"}], "content": "24.0 Loss And/Or Expense Caused By Matters Affecting The Regular Progress Of The Works Loss and/or\n\n24.1 Where the regular progress of the Works or any section of the Works has been or is likely expense caused to be materially affected by any of the matters expressly referred to in Clause 24.3, and the by matters Contractor has incurred or is likely to incur loss and/or expense which could not be affecting the reimbursed by a payment made under any other provision in the Contract, the Contractor . regular progress may make a claim for such loss and/or expense provided always that: of the Works\n\n24.1(a) the Contractor shall give written notice to the Architect of his intention to claim for such loss and/or expense together with an initial estimate of his claim duly supported with all necessary calculations. Such notice must be given within twenty eight (28) Days from the date of the AI, CAI or the start of the occurrence of the matters referred to in Clause 24.3, whichever is the earlier. The giving of such written notice shall be a condition precedent to any entitlement to loss and/or expense that the Contractor may have under the Contract and/or Common Law; and 24.1{b) within twenty eight (28) Days after the matters referred to in Clause 24.3 have ended, the Contractor shall send to the Architect and Quantity Surveyor, complete particulars of his claim for loss and/or expense together with all necessary calculations to substantiate his claims. If the Contractor fails to submit the required particulars within the stated time (or within such longer period as may be agreed in writing by the Architect), it shall be deemed that the Contractor has waived his rights for loss and/or expense. Access to\n\n24.2 The Contractor shall keep contemporaneous records of all his claims for loss and/or Contractor’s expense and shall submit all particulars to the Architect. The Architect and Quantity books and Surveyor shall have access to all books, documents, reports, papers or records in the documents possession, custody or control of the Contractor that are material to the claim and the Contractor shall provide free of charge, a copy each to the Architect and Quantity Surveyor when requested. All such documents shal! remain available in accordance with this clause until all claims have been resolved. The Contractor shall use his best endeavour to ensure that all such documents in the possession, custody or control of sub-contractors and/or suppliers that are material to the claim are similarly available. Loss & Expenses Matters\n\n24.3 The following are the matters referred to in Clause 24-T: materially regular progress 24,3(a) the Contractor not having received in due time the necessary documents under of the Works Clauses 3.3(a) and 3.3(b);\n\n24.3(b) the Contractor not having received in due time the necessary Al (including | those for or in regard to the expenditure of P.C. Sums and Provisional Sums, further drawings, details, levels and any other information) for which he had | specifically applied in writing to the Architect. The Contractor’s application must be submitted to the Architect in sufficient time before the | commencement of construction of the affected works, to enable the Architect ; to issue the necessary AI within a period which would not materially affect the progress of the affected works, having regard to the Completion Date. . Provided always that the AI was not required as a result of any negligence, omission, default and/or breach of contract by the Contractor and/or Nominated Sub-Contractors;\n\n24.3(c) delay by the Employer in giving possession of the Site or any section of the Site in accordance with Clauses 21.1 and 21.2;\n\n24.3(d) compliance with a written instruction issued by the Architect in regard to the postponement or suspension of all or any part of the Works to be executed | under Clause 21.4;\n\n24.3(e) delay on the part of craftsmen, tradesmen or other contractors employed or engaged by the Employer in executing work not forming part of the Contract or the failure to execute such work; 24.3() delay or failure in the supply of materials and goods which the Employer had agreed to supply for the Works;\n\n24.3(g) the opening up for inspection of any work covered up, testing any materials and goods or executed work in accordance with Clause 6.3, unless the inspection or test showed that the works, materials and goods were not in ; accordance with the Contract or was in the opinion of the Architect required in consequence of some prior negligence, omission, default and/or breach of contract by the Contractor;\n\n24.3(h) any act of prevention or breach of contract by the Employer; 24.3{i) delay as a result of a compliance with AI issued in connection with the discovery of antiquities under Clause 33.1; 24.3Q) appointment ofa replacement Person under Articles 3, 4, 5 and 6;\n\n24.3(k) compliance with a written instruction issued by the Architect in connection with disputes with neighbouring property owners provided always that the same is not caused by negligence, omission, default and/or breach of contract by the Contractor and/or Nominated Sub-Contractors;\n\n24.3(1) by reason of the execution of work for which a Provisional Quantity is included in the Contract Bills which in the opinion of the Architect is not a reasonably accurate forecast of the quantity of work required;\n\n24.3(m) failure of the Employer to give in due time entry to or exit from the Site or any part through or over any land, by way of passage adjoining or connected to the Site and in the possession or control of the Employer;\n\n24.3(n) suspension by the Contractor of his obligations under Clauses 30.7 and 30.8; and\n\n24.3(0) suspension of the whole or part of the Works by order of an Appropriate Authority provided always that the same is due to negligence or omission on the part of the Employer, Architect or Consultant. Loss and/or\n\n24.4 Subject to the Contractor complying with Clause 24.1, the Architect or Quantity Surveyor expense to be shall ascertain the amount of such loss and/or expense. Any amount so ascertained from included in time to time for such loss and/or expense shall be added to the Contract Sum, and if an certificate Interim Certificate is issued after the date of ascertainment, such amount shall be included in the certificate. :"}, {"id": "clause-25.0", "kind": "clause", "num": "25.0", "title": "Determination Of Contractor's Employment By Employer", "subclauses": [{"num": "25.1", "title": "Defaults by Contractor"}, {"num": "25.2", "title": "Procedure for determination"}, {"num": "25.3", "title": "Contractor's insolvency"}, {"num": "25.4", "title": "Rights and duties of Employer and Contractor"}, {"num": "25.5", "title": "Records of Works"}, {"num": "25.6", "title": "Final Account upon determination"}, {"num": "25.7", "title": "Remedy limited to damages only"}, {"num": "25.8", "title": "Employer's rights and remedies not prejudiced"}], "content": "25.0 Determination Of Contractor’s Employment By Employer Defaults by\n\n25.1 The Employer may determine the employment of the Contractor if the Contractor defaults Contractor in any of the following:\n\n25.1(a) if without reasonable cause, he fails to commence the Works in accordance with the Contract;\n\n25.1(b) if without reasonable cause, he wholly or substantially suspends the carrying . out of the Works before completion; 25.1{c) ifhe fails to proceed regularly and/or diligently with the Works;\n\n25.1(d) ifhe persistently refuses or neglects to comply with an AJ;\n\n25.1(e) if he fails to comply with the provisions in Clause 17.0; or 25.18 if he has abandoned the Works. Procedure for\n\n25.2 Upon the occurrence of any default under Clause 25.1, and if the Employer decides to determination determine the Contractor’s employment, the Employer or Architect on his behalf shall give to the Contractor a written notice delivered by hand or by registered post specifying the default. If the Contractor shall continue with such default for fourteen (14) Days from the receipt of such written notice, then the Employer may, within ten (10) Days from the expiry of the said fourteen (14) Days, by a further written notice delivered by hand or by registered post, forthwith determine the employment of the Contractor under the Contract. Provided always that such notice shall not be given unreasonably or vexatiously. Contractor’s\n\n25.3 In the event of the Contractor becoming insolvent or making a composition or arrangement insolvency with his creditors, or have a winding up order made, or (except for purposes of reconstruction or amalgamation) a resolution for voluntary winding up, or having a ; liquidator or receiver or manager of his business or undertaking duly appointed, or having possession taken by or on behalf of the holders of any debentures secured by a floating charge, or of any property comprised in or subject to the floating charge, the employment of the Contractor shall be forthwith automatically determined. Rights and duties\n\n25.4 In the event that the employment of the Contractor is determined under Clause 25.1 or 25.3, of Employer and the following shall be the respective rights and duties of the Employer and Contractor: Contractor\n\n25.4(a) the Contractor shall vacate the Site and retum possession of the Site to the Employer who may employ and pay other Person to carry out and complete the Works and to make good any defects. Such Person may enter upon the Works and use all temporary buildings, construction plant, tools, materials and j goods intended for, delivered to and placed on or adjacent to the Site (except those construction plant that is on hire by the Contractor) and may purchase all materials and goods necessary for the carrying out and the completion of the Works. The Contractor if so required by the Employer or by the Architect on behalf of the Employer shall within twenty one (21) Days of the date of determination, assign to the Employer the benefit of any agreement for the continuation of the hire of construction plant and equipment already on the Site;\n\n25.4(b) the Contractor if so required by the Employer or Architect, shall within twenty one (21) Days of the date of determination, assign to the Employer without payment the benefit of any agreement for the supply of materials, goods and/or for the execution of any work for the purposes of the Contract to the extent that the same is assignable,\n\n25.4(c) the Contractor when instructed in writing by the Architect shall remove from the Works any temporary buildings, construction plant, tools, equipment, materials and goods belonging to or hired by him. If within a reasonable time after any such instruction has been issued to the Contractor, and he has not complied therewith, then the Employer may without liability remove and sell any such property belonging to the Contractor except those that are on hire and hold the proceeds less all costs incurred to the credit of the Contractor; and\n\n25.4(d) the Contractor shall allow or pay to the Employer all cost incurred to complete the Works including all loss and/or expense suffered by the Employer. Until | after the completion of the Works under Clause 25.4(a), the Employer shall . not be bound by any provision in the Contract to make any further payment to the Contractor, including payments which have been certified but not yet due but excluding payments which have been certified and are due but remain unpaid when the employment of the Contractor was determined. Upon completion of the Works, an account taking into consideration the value of works carried out by the Contractor and all cost incurred by the Employer to complete the Works including loss and/or expense suffered by the Employer shall be incorporated in a final account prepared in accordance with Clause 25.6. Records of\n\n25.5 The Architect or Quantity Surveyor shall within twenty eight (28) Days of the Works determination of the Contractor’s employment, give a written notice to the Contractor of the date of inspection on Site to jointly record the extent of the Works executed and the materials and goods delivered to the Site. The Contractor shall provide all necessary assistance to the Architect and Quantity Surveyor to perform their task. Upon completion of the record by the Architect or Quantity Surveyor, a copy shall be sent to the Contractor and such records shall form the basis for the evaluation of the value of the works executed and materials and goods delivered to the Site by the Contractor up to the date of determination. Final Account\n\n25.6 The Architect or Quantity Surveyor shall within three (3) Months on the availability of the upon final cost incurred to complete the Works, submit to the Employer and Contractor for their determination agreement, a final account for ail cost incurred to complete the Works including the sums previously certifted to the Contractor before the date of determination, Liquidated Damages, set-off and all other loss and/or expense suffered. .\n\n25.6(a) If nothing in the said final account is disputed by the Employer or Contractor within three (3) Months from the date of receipt of the final account from the Architect or Quantity Surveyor, the final account shall be conclusive and deemed agreed by the parties. If the amount in the final account exceeds the total amount which would have been payable on completion in accordance with the Contract, the difference shall be a debt payable to the Employer by the Contractor or where applicable, the Employer may recover such sum from the Performance Bond. If the said amount is less than the said total amount, the difference shall be a debt payable to the Contractor by the Employer.\n\n25.6(b) If either party has any dispute on the final account, the party disputing the final account shall by written notice to the other party (with copies to the Architect and Quantity Surveyor) set out any disagreement complete with particulars within three (3) Months of the date of receipt of the final account from the Architect or Quantity Surveyor. The Architect or Quantity Surveyor within three (3) Months from the date of receipt of the grounds of dispute shall either amend or not amend the final account. Any party disagreeing with the amended final account or decision not to amend the final account shall refer the dispute to arbitration under Clause 37.0 within three (3) Months from the date of receipt of the amended final account or decision not to amend the final account. Failure to refer the dispute to arbitration within the stipulated time, the final account or amended final account shall deem to be conclusive and agreed by the parties.\n\n25.6(c) Any dispute on Liquidated Damages, set-off and interest which the Employer is entitled to make under the Contract shall be referred to arbitration. Remedy limited\n\n25.7 Upon receipt of a written notice by the Contractor from the Employer to determine the to damages only employment of the Contractor, the Contractor shall yield possession of the Site within fourteen (14) Days from the receipt of the said written notice and shall remove his personnel and labour force (but not construction plant, tools and equipment unless so instructed by the Architect) from the Site. Irrespective of the validity of the said written notice the Contractor’s remedy shall be limited to compensation for damages only. Employer’s\n\n25.8 The provisions of Clause 25.0 are without prejudice to any other rights and/or remedies rights and which the Employer may possess. remedies not prejudiced"}, {"id": "clause-26.0", "kind": "clause", "num": "26.0", "title": "Determination Of Own Employment By Contractor", "subclauses": [{"num": "26.1", "title": "Defaults by Employer"}, {"num": "26.2", "title": "Procedure for determination"}, {"num": "26.3", "title": "Employer's insolvency"}, {"num": "26.4", "title": "Rights and duties of Contractor and Employer"}, {"num": "26.5", "title": "Records of Works"}, {"num": "26.6", "title": "Settlement of accounts"}, {"num": "26.7", "title": "Contractor's rights and remedies not prejudiced"}], "content": "26.0 Determination Of Own Employment By Contractor - Defaults by\n\n26.1 The Contractor may determine his own employment if the Employer defaults in any of the Employer following:\n\n26.1(a) if the Employer fails or neglects to pay the Contractor the amount due on any certificate (less any Liquidated Damages and set-off which the Employer is expressly entitled to make under the Contract) within the Period for Honouring Certificates; .\n\n26.1(b) if the Employer interferes with or obstructs the issue of any certificate by the Architect;\n\n26.1(c) if the Employer fails to nominate a succeeding Architect or Consultant in accordance with Articles 3, 4, 5 and 6; or\n\n26.1(d) if before the date of Practical Completion, the carrying out of the whole or substantially the whole of the uncompleted Works is suspended for a continuous period of time exceeding that stated in the Period of Delay stated in the Appendix by reason of: . 26.1(d)(i) Al issued by the Architect under Clause 1.4, 21.1 or 21.4 unless the instruction is issued to rectify any negligence, omission, default and/or breach of contract by the Contractor or Nominated Sub-Contractors; 26.1(d)(ii) the Contractor not having received in due time the necessary Al (including those for or in regard to the expenditure of P.C. Sums and Provisional Sums, further drawings, details, levels and any other information) for which he had specifically applied in . writing to the Architect. The Contractor’s application must be submitted to the Architect in sufficient time before the commencement of construction of the affected works, to enable the Architect to issue the necessary AJ within a period which would not materially affect the progress of the affected works, having regard to the Completion Date. Provided always that the AI was not required as a result of any negligence, omission, default and/or breach of contract by the Contractor and/or Nominated Sub-Contractors; 26.1(d)(ii) delay on the part of craftsmen, tradesmen or other contractors employed or engaged by the Employer in executing work not forming part of the Contract or the failure to execute such work; or 26.1(d)(iv) the opening up for inspection of any work covered up or to arrange for or carry out any testing of any work, materials and goods in accordance with Clause 6.3 unless the inspection or test showed that the work, materials and goods were not in accordance with the Contract, or the inspection and/or test was in the opinion of the Architect required in consequence of some prior negligence, omission, default and/or breach of contract by the Contractor. Procedure for\n\n26.2 Upon the occurrence of any default under Clause 26.1, and if the Contractor decides to determination determine his own employment then, the Contractor shall give to the Employer a written notice delivered by hand or by registered post specifying the default. If the Employer shall continue with such default for fourteen (14) Days from the receipt of such written notice then, the Contractor may within ten (10) Days from the expiry of the said fourteen (14) Days, by a further written notice delivered by hand or by registered post forthwith determine his own employment under the Contract. Provided always that such notice shall not be given unreasonably or vexatiously. Employer’s\n\n26.3 In the event of the Employer becoming insolvent or making a composition or arrangement insolvency with his creditors, or have a winding up order made, or (except for the purposes of reconstruction or amalgamation) a resolution for voluntary winding up, or having a liquidator or receiver or manager of his business or undertaking duly appointed, or having possession taken by or on behalf of the holders of any debentures secured by a floating charge, or of any property comprised in or subject to the floating charge, the employment of the Contractor shall be forthwith automatically determined. Rights and duties\n\n26.4 In the event that the employment of the Contractor is determined under Clause 26.1 or 26.3, of Contractor the following shall be the respective rights and duties of the Contractor and Employer: and Employer\n\n26.4(a) the Contractor shall within fourteen (14) Days or within such longer period as may be agreed in writing by the Architect, remove from the Site all his . temporary buildings, construction plant, tools, materials and goods and shall give facilities for his Nominated Sub-Contractors to do the same; and\n\n26.4(b) the Employer shall allow or pay to the Contractor the total value of work . properly executed and the value of materials and goods supplied including any loss and/or expense suffered by the Contractor caused by such determination. Records of\n\n26.5 The Contractor shall within twenty eight (28) Days of the determination of his own | Works employment, give a written notice to the Architect and Quantity Surveyor of the date of inspection on Site to jointly record the extent of the Works executed and the materials and goods delivered to the Site. Upon completion of the record by the Contractor, a copy shall be sent to the Employer, Architect and Quantity Surveyor and such records shall form the basis for the evaluation of the value of the works executed and materials and goods delivered to the Site by the Contractor up to the date of determination. Settlement of\n\n26.6 The Contractor shall within six (6) Months after determination of his own employment, accounts submit to the Employer, Architect and Quantity Surveyor for the Employer’s agreement, a final account for the total value of work properly executed, the value of materials and goods supplied and loss and/or expense suffered by the Contractor caused by such determination.\n\n26.6(a) If nothing in the said final account is disputed by the Employer within three : (3) Months from the date of receipt of the final account from the Contractor, the final account shall be conclusive and deemed agreed by the parties. If the amount in the final account exceeds the sums previously paid to the Contractor under the Contract (less any Liquidated Damages and set-off which the Employer is expressly entitled under the Contract), the balance shall be a debt payable to the Contractor by the Employer within the Period of Honouring Certificates, If the said amount is less than the said sum, the difference shall be a debt payable to the Employer by the Contractor or where applicable, the Employer may recover such difference from the Performance Bond.\n\n26.6(b) If the Employer disputes the final account, the Employer shall give written notice to the Contractor setting out any disagreement complete with particulars within three (3) Months of the date of receipt of the final account from the Contractor. The Contractor shall within three (3) Months from the date of receipt of the grounds of dispute, either make such amendment to the final account as in his opinion may be appropriate, or decide not to amend the final account. In the event the Employer disagrees with the amended final account or the decision not to amend the final account, the Employer shall refer the dispute to arbitration under Clause 37.0 within three (3) Months from the date of receipt of the amended final account or decision not to amend the final account. Failure to refer the dispute to arbitration within the stipulated time, the final account or amended final account shall deem to be conclusive and agreed by the parties. Contractor’s\n\n26.7 The provisions of Clause 26.0 are without prejudice to any other rights and/or remedies rights and which the Contractor may possess. remedies not prejudiced"}, {"id": "clause-27.0", "kind": "clause", "num": "27.0", "title": "Nominated Sub-Contractors", "subclauses": [{"num": "27.1", "title": "P.C. Sums and Provisional Sums — Nominated Sub-Contractors"}, {"num": "27.2", "title": "Nomination of sub-contractor"}, {"num": "27.3", "title": "Objection to nomination of sub-contractor"}, {"num": "27.4", "title": "Action following objection of Nominated Sub-Contractor"}, {"num": "27.5", "title": "Payment by Contractor to Nominated Sub-Contractors"}, {"num": "27.6", "title": "Failure of Contractor to pay Nominated Sub-Contractors"}, {"num": "27.7", "title": "Final payment to Nominated Sub-Contractors"}, {"num": "27.8", "title": "Determination of the Nominated Sub-Contractor's employment"}, {"num": "27.9", "title": "Contractor's responsibility for Nominated Sub-Contractors"}, {"num": "27.10", "title": "Employer no privity of Contract with Nominated Sub-Contractors"}, {"num": "27.11", "title": "Re-nomination of sub-contractor due to determination by the Contractor"}, {"num": "27.12", "title": "Re-nomination of sub-contractor due to determination by the Nominated Sub-Contractor"}, {"num": "27.13", "title": "Contractor to recover additional expenses from Nominated Sub-Contractor"}, {"num": "27.14", "title": "Contractor permitted to tender for P.C. Sums"}], "content": "27.0 Nominated Sub-Contractors P.C. Sums and\n\n27.1 The following provisions shall apply where P.C. Sums are included in the Contract Bills or Provisional Sums arise as a result of an AI given in regard to the expenditure of Provisional Sums in respect - Nominated Sub- of a Person to be nominated by the Architect to supply and fix materials and goods or to Contractors execute works, Such sums shall be expended in favour of such Person as the Architect shall instruct, and such Person who is nominated by the Architect is hereby referred to as “Nominated Sub-Contractor” employed by the Contractor. If the Nominated Sub- Contractor proposes any alternative design to the sub-contract drawings or if the sub- contract leaves any matter of design, specification or choice of materials, goods and workmanship to the Nominated Sub-Contractor, the Nominated Sub-Contractor and not the Contractor shall be responsible to ensure that such sub-contract works are fit for its purpose. . Nomination of\n\n27.2 The Architect shall not nominate any Person as Nominated Sub-Contractor against whom sub-contractor the Contractor makes reasonable objection in accordance with Clause 27.3. The Contractor shall make such reasonable objection in writing not later than fourteen (14) Days from | receipt of the nomination instruction from the Architect. The Architect shall not nominate (except where the Architect and Contractor otherwise agree) any Person who will not enter into a contract with the Contractor based upon the terms and conditions of the PAM Sub- Contract 2018 which provides inter alia:\n\n27.2(a) that the Nominated Sub-Contractor carry out and complete the sub-contract works in every respect to the reasonable satisfaction of the Contractor and Architect and in conformity with all reasonable directions and requirements of the Contractor;\n\n27.2(b) that the Nominated Sub-Contractor observe, perform and comply with all the provisions of the Contract which the Contractor is obliged to perform and comply with so far as they relate and apply to the sub-contract works;\n\n27.2(c) that the Nominated Sub-Contractor indemnify the Contractor against the same liabilities in respect of the sub-contract works as those for which the Contractor is liable to indemnify the Employer under the Contract, ;\n\n27.2(d) that the Nominated Sub-Contractor indemnify the Contractor against claims in respect of any negligence, omission or default of his sub-contractors, his servants or agents or any misuse by him or them of any construction plant, access, scaffolding, temporary works, appliances or other property belonging to or provided by the Contractor;\n\n27.2(e) that the sub-contract works be completed within the period or periods specified and the Contractor shall not without the written recommendation of the Architect grant any extension of time for the completion of the sub- contract works caused by any of the Relevant Event stated in Clause 21.4 of the PAM Sub-Contract 2018. Where the delays are caused by any negligence, omission, default and/or breach of the sub-contract by the Contractor, the Contractor is solely responsible under Clause 21.6 of the PAM Sub-Contract 2018 to assess and grant an extension of time to the Nominated Sub- Contractor; 27.28) that when the Contractor and Nominated Sub-Contractor consider that the sub- contract works have been practically completed, they shall request the Architect to issue a certificate to the effect, and if the Architect is of the opinion that the sub-contract works have been completed in accordance with the provisions of Clause 17.1 of the PAM Sub-Contract 2018, the Architect shall forthwith issue a certificate to the effect;\n\n27.2(g) that if the Nominated Sub-Contractor fails to complete the sub-contract works within the sub-contract completion date or within any extended time granted by the Contractor, and the Contractor after having given a written notification to the Nominated Sub-Contractor that the sub-contract works ought reasonably so to have been completed, the Nominated Sub-Contractor shall pay or allow to the Contractor loss and/or expense suffered by the Contractor or an agreed Liquidated Damages;\n\n27.2(h) that payment to Nominated Sub-Contractor shall be made within seven (7) Days after the Period of Honouring Certificates and shall be subject to the retention and deductions expressly provided under the PAM Sub-Contract 2018; and\n\n27.2(i) that the Architect, Consultants and their authorised representatives shall have the right of access to the workshops and other places of the Nominated Sub- Contractor in accordance with the provisions of Clause 11.2 of the PAM Sub- Contract 2018. Objection to\n\n27.3 Subject to Clause 27.4, the Contractor shall not be required to enter into a sub-contract with nomination of any Nominated Sub-Contractor against whom the Contractor has made a reasonable sub-contractor objection based on available known facts and documented evidence that the financial . standing or solvency or technical competence of the Nominated Sub-Contractor is such that a prudent contractor, having regard to the scope of sub-contract works would be justified in rejecting the nomination. Action following\n\n27.4 Where the Architect is of the opinion that the Contractor has made a reasonable objection, objection of the Architect may either issue further written instructions to remove the objection so that Nominated Sub- the Contractor can enter into the sub-contract, or cancel such nomination instruction and Contractor issue an instruction omitting the work which was the subject of the nomination instruction or re-nominate another sub-contractor for the sub-contract works. Payment by\n\n27.5 The Architect shall direct the Contractor as to the total value of work properly execited and Contractor to include the percentage of the value of the materials and goods stated in the Appendix in the ; Nominated Sub- calculation of the amount stated to be due in any certificate issued under Clause 30.0, and Contractors shall at the same time when the certificate is issued, inform the Nominated Sub-Contractor in writing of the amount of the said total value. The sum representing such total value (less | any retention and deductions expressly provided under PAM Sub-Contract 2018) shall be paid by the Contractor to the Nominated Sub-Contractor within seven (7) Days after the Period of Honouring Certificates. Failure of\n\n27.6 The Architect may at any time before the issuance of any Interim and Penultimate | Contractor to Certificate, request the Contractor to furnish to him reasonable proof that all amounts stated il pay Nominated as due and included in the previous certificates have been discharged. The Contractor shall | Sub-Contractors provide such proof within fourteen (14) Days of the Architect’s request. If the Contractor | has any reasons for withholding any Nominated Sub-Contractor’s payments under Clauses 16.1 and 26.13 of the PAM Sub-Contract 2018, he shall provide the Architect written | details of his compliance. If the Contractor fails to comply with the Architect’s request | within fourteen (14) Days, the Architect may (but not obliged to) issue a certificate stating the amount in respect of which the Contractor has failed to provide such proof. Where the : Architect has so certified, the Employer may (but not obliged to) pay such amounts directly to the Nominated Sub-Contractor and deduct the same from any sums due or to become due to the Contractor. The Architect may issue the aforesaid certificate irrespective of whether or not an Interim Certificate under Clause 30.0 is due for issuance. Final payment to\n\n27.7 If the Architect wishes to make final payment to any Nominated Sub-Contractor before Nominated Sub- final payment is due to the Contractor, and if the Nominated Sub-Contractor has Contractors indemnified the Contractor against all of his liabilities under the Nominated Sub-Contract, the Architect shall issue a certificate to the Contractor and the Contractor shall pay to such Nominated Sub-Contractor the amount so certified less any retention and deductions expressly provided under PAM Sub-Contract 2018. Upon such final payment, the Retention Fund shall be reduced by the sum of the retention released to the Nominated Sub- Contractor. Determination of\n\n27.8 The Contractor shall not determine the employment of any Nominated Sub-Contractor | the Nominated without the written consent of the Architect. If the Contractor intends to determine the Sub-Contractor’s employment of the Nominated Sub-Contractor, the Contractor shall send to the Architect a employment written report stating the Nominated Sub-Contractor’s default with a copy to the Nominated Sub-Contractor. The Architect may request that the Nominated Sub-Contractor respond to the Contractor’s report before he decides whether or not to give his written consent. Contractor’s\n\n27.9 The Contractor shall be fully responsible to ensure that all Nominated Sub-Contractors responsibility for carry out the sub-contract works in accordance with the Nominated Sub-Contract and in Nominated Sub- compliance therewith provide designs (if any), materials, goods and standards of Contractors workmanship of the quality and standard specified therein to the reasonable satisfaction of the Architect. Employer no\n\n27.10 Neither the existence of or the exercise of the foregoing provisions nor anything else privity of contained in the Contract shall create a privity of contract between the Employer and any of Contract with the Nominated Sub-Contractors. Nominated Sub- Contractors Re-nomination of\n\n27.11 If the employment of a Nominated Sub-Contractor is determined by the Contractor with the sub-contractor written consent of the Architect, the Architect shall re-nominate another Nominated Sub- due to Contractor. In the event, the Contractor shall be entitled to be paid such difference (if any) determination by between the sum payable to the Contractor and the new Nominated Sub-Contractor and the the Contractor sum payable to the previous Nominated Sub-Contractor after taking into consideration of any sum that will be recoverable from the defaulting Nominated Sub-Contractor under Clause 27.13. An extension of time under Clause 23.8(j) may be granted to the Contractor but the Contractor shall not be entitled to any damages, loss and/or expense. Re-nomination of\n\n27.12 If a Nominated Sub-Contractor determines his own employment under the Nominated Sub- sub-contractor Contract due to negligence, omission, default or breach of the Contractor, the Architect due to shall re-nominate another Nominated Sub-Contractor. In the event, the Contractor shall be determination by paid the same sum as would have been payable to the previous Nominated Sub-Contractor. the Nominated The Contractor will be liable to pay the new Nominated Sub-Contractor any additional cost Sub-Contractor to complete the Sub-Contract Works and to pay the Employer for all additional costs incurred in re-nomination and loss and/or expense suffered by the Employer by such determination. The Contractor shall not be entitled to any extension of time unless and until the Contractor has established that the determination by the Nominated Sub-Contractor of his own employment is invalid. In the event the determination by the Nominated Sub- Contractor of his own employment has been established to be invalid by arbitration or litigation, Clause 27.11 will apply. Contractor to\n\n27.13 In the event the Architect consents to determine the employment of the Nominated Sub- recover Contractor under Clause 27.11, the Contractor shall recover all additional expenses additional (including any additional expenses incurred by the Employer) from the Nominated Sub- expenses from Contractor as a debt or from any monies due or to become due to the Nominated Sub- Nominated Sub- Contractor and failing which, the Contractor may recover such sum from the Nominated Contractor Sub-Contractor’s Performance Bond. : Contractor\n\n27.14 Where the Contractor carries out works for which P.C. Sums and Provisional Sums are | permitted to included in the Contract Bills, the Contractor shall be permitted to tender for the same. If F tender for P.C. the tender of the Contractor for such work is accepted, it shall be considered as a Variation | Sums and the Contractor shall not be entitled to profit and attendance charges as priced under the i relevant P.C. Sum, notwithstanding the provision of Clause 30.11(c). The Architect may omit any P.C, Sums, which are included in the Contract Bills, provided prior consent of the Contractor has been obtained. The Employer shall only be permitted to award the works related to such P.C. Sums to any other contractors with the consent of the Contractor."}, {"id": "clause-28.0", "kind": "clause", "num": "28.0", "title": "Nominated Suppliers", "subclauses": [{"num": "28.1", "title": "P.C. Sums and Provisional Sums — Nominated Suppliers"}, {"num": "28.2", "title": "Nominated Suppliers and their obligations"}, {"num": "28.3", "title": "Objection to nomination of suppliers"}, {"num": "28.4", "title": "Action following objection of suppliers"}, {"num": "28.5", "title": "Value of materials and goods supplied by Nominated Suppliers"}, {"num": "28.6", "title": "Payment to Nominated Suppliers"}, {"num": "28.7", "title": "Contractor's liability for Nominated Suppliers"}, {"num": "28.8", "title": "Employer no privity of Contract with Nominated Suppliers"}], "content": "| 28.0 Nominated Suppliers P.C. Sums and\n\n28.1 The following provisions of this clause shall apply where P.C. Sums are included in the Provisional Sums Contract Bills or arise as a result of an AI given in regard to the expenditure of Provisional - Nominated Sums in respect of Person to be nominated by the Architect to supply any materials and Suppliers goods to be fixed by the Contractor. Such Person as the Architect shall instruct is referred to as “Nominated Supplier”. Nominated\n\n28.2 The Architect shall not nominate any Person as a Nominated Supplier against whom the Suppliers and Contractor makes a reasonable objection in accordance with Clause 28.3. The Contractor their obligations shall make such reasonable objection in writing not later than fourteen (14) Days from receipt of the nomination instruction from the Architect. The Architect shall not nominate (except where the Architect and Contractor otherwise agree) any Person who will not enter into a contract of sale which provides inter alia:\n\n28.2(a) that the materials and goods to be supplied shall be of the quality and standard specified, provided always that where approval of the quality and standard of material is a matter of opinion of the Architect, such quality and standard shall be to the reasonable satisfaction of the Architect; ll\n\n28.2(b) that the Nominated Supplier shall make good by replacement or otherwise any defects in the materials and goods supplied which appear within the Defects Liability Period and shall bear any expenses reasonably incurred by the Contractor as a direct consequence of such defects provided always that: 28.2(b)(i) where the materials and goods have been used or fixed, such defects are not such that examination by the Contractor ought to have revealed them before using or fixing; or 28.2(b)(ii) such defects are due solely to defective workmanship, materials and goods supplied and not caused by misuse, improper storage or any act or neglect by the Contractor;\n\n28.2(c) that the delivery of the materials and goods supplied shall commence andbe ; completed in accordance with a delivery programme to be agreed between the Contractor and Nominated Supplier, or at such times as the Contractor may reasonably direct;\n\n28.2(d) that the ownership of materials and goods shall pass to the Contractor upon delivery by the Nominated Supplier, whether or not payment has been made in full; and\n\n28.2(e) that payment to Nominated Supplier shall be made within seven (7) Days after the Period of Honouring Certificates and shall be subject to the retention by the Contractor under Clause 28.5. * Objection to\n\n28.3 Subject to Clause 28.4, the Contractor shall not be required to enter into a supply contract nomination of with any Nominated Supplier against whom the Contractor has made a reasonable suppliers objection based on the available known facts and documented evidence that the financial standing or solvency or technical competence of the Nominated Supplier is such that a prudent contractor, having regard to the scope of the supply contract would be justified in rejecting the nomination. Action following\n\n28.4 Where such reasonable objection is made, the Architect may either issue further objection of instructions to remove the objection so that the Contractor can enter into the supply contract . suppliers or cancel such nomination or instruction and issue an instruction omitting the materials and goods which was the subject of the nomination instruction or re-nominate another Nominated Supplier. Value of\n\n28.5 The Architect shall direct the Contractor as to the total value of materials and goods materials and supplied by a Nominated Supplier which has been included in any certificate issued under goods supplied Clause 30.0, and shall at the same time when the certificates are issued, inform the by Nominated Nominated Supplier in writing of the amount of the said total. The Contractor shall retain Suppliers from the sums included for the value of materials and goods the percentage of such value stated in the Appendix as Percentage of Certified Value Retained up to an amount not exceeding five (5) percent of the Nominated Supplier’s sum. The Contractor’s interest in any sums so retained shail be fiduciary as trustee for the Nominated Supplier (but without obligation to invest); and the Contractor’s beneficial interest in such sums shall be subject only to the right of the Contractor to have recourse from time to time for payment of any amount which he is entitled under the nominated supply contract to deduct from any sum due or to become due to the Nominated Supplier. Upon the Architect having certified the release of the Retention Fund under Clause 30.6, such sums shall be released to the Nominated Supplier within seven (7) Days after the Period of Honouring Certificate and that if and when such sums are released to the Nominated Supplier, they shalt be paid in full. Payment to\n\n28.6 All payments in respect of the value of materials and goods supplied by a Nominated Nominated Supplier shail be made within seven (7) Days after the Period of Honouring Certificates and Suppliers shall be subject to the retention by the Contractor under Clause 28.5. Contractor’s\n\n28.7 The Contractor shall be fully responsible for any negligence, omission, default and/or liability for breach of contract by the Nominated Supplier and the Employer shall in no circumstances | Nominated be liable to the Contractor. t Suppliers i Employer no.\n\n28.8 Neither the existence of or the exercise of the foregoing provisions nor anything else t privity of contained in the Contract shall create a privity of contract between the Employer and any of i Contract with the Nominated Suppliers. i Nominated : Suppliers"}, {"id": "clause-29.0", "kind": "clause", "num": "29.0", "title": "Works By Craftsmen, Tradesmen Or Other Contractors Employed Or Engaged By Employer", "subclauses": [{"num": "29.1", "title": "Works by Employer's craftsmen"}], "content": "29.0 Works By Craftsmen, Tradesmen Or Other Contractors Employed Or Engaged By Employer Works by\n\n29.1 The Contractor shall permit the execution of work not forming part of the Contract on the Employer’s Works by craftsmen, tradesmen or other contractors engaged by the Employer. Such craftsmen craftsmen, tradesmen or other contractors engaged by the Employer shall be deemed to be a Person for whom the Employer is responsible and not to be a sub-contractor of the Contractor."}, {"id": "clause-30.0", "kind": "clause", "num": "30.0", "title": "Certificates And Payment", "subclauses": [{"num": "30.1", "title": "Payment application and issue of Architect's certificate"}, {"num": "30.2", "title": "Amount due in Architect's certificate"}, {"num": "30.3", "title": "Errors in payment certificate"}, {"num": "30.4", "title": "Set-off by Employer"}, {"num": "30.5", "title": "Retention Fund"}, {"num": "30.6", "title": "Rules regarding Retention Fund"}, {"num": "30.7", "title": "Suspension of Works for non-payment"}, {"num": "30.8", "title": "Compulsory suspension of Works"}, {"num": "30.9", "title": "Cessation insurance resulting from suspension of the Works"}, {"num": "30.10", "title": "Final Account"}, {"num": "30.11", "title": "Items in Final Account"}, {"num": "30.12", "title": "Conclusiveness of the Final Account"}, {"num": "30.13", "title": "Issuance of Penultimate Certificate"}, {"num": "30.14", "title": "Issue of Final Certificate"}, {"num": "30.15", "title": "Final Certificate"}, {"num": "30.16", "title": "Final Certificate not conclusive"}, {"num": "30.17", "title": "Interest"}], "content": "30.0 Certificates And Payment Payment\n\n30.1 The Contractor shall submit a payment application at the Interim Claim Interval stated in application and the Appendix with complete details and particulars as required by the Architect and , issuance of Quantity Surveyor, to enable them to consider and ascertain the amount to be included in an Architect’s Interim Certificate. Upon receipt of the Contractor's details and particulars, the Architect certificate after having received the payment valuation from the Quantity Surveyor shall, within twenty one (21) Days from the date of receipt of the Contractor’s application, issue an Interim Certificate to the Employer with a copy to the Contractor, and the Employer shall thereafter pay the amount certified to the Contractor within the Period of Honouring Certificates. Any failure by the Contractor to submit a payment application shall be deemed to be a waiver of his contractual entitlement for that Interim Certificate, and the Architect may or may not issue an Interim Certificate under the circumstances. After the issuance of the Certificate of Practical Completion, Interim Certificates shall be issued as and when further amounts are ascertained by the Architect and Quantity Surveyor as payable to the Contractor by the Employer. Amount due in\n\n30.2 The amount stated as due in an Interim Certificate shall, subject to any agreement between Architect’s the parties as to stage payments, be the total value of the work properly executed and certificate include the percentage of the value of materials and goods stated in the Appendix up to the date of the Contractor’s payment application less any amount which may be retained by the Employer under Clauses 30.5 and\n\n30.6 and, less the amounts previously certified under Clause 30.1. The materials and goods must be for incorporation into the permanent works and have been delivered to and properly stored at the Site and be protected against loss, damage or deterioration, and be in accordance with the Contract. The certificate shall only ; include the value of materials and goods which are reasonably, properly and not prematurely brought to the Site. ; Errors in\n\n30.3 Save for clerical, computational or typographical error or errors of a similar nature, the payment Architect shall not be entitled to revise or correct any payment certificate issued by him certificate under the Contract. Provided always that the Architect may, by a later certificate, make correction or modification in respect of any valuation errors in any earlier certificate. Set-off by\n\n30.4 The Employer shall be entitled to set-off all cost incurred and loss and expense where it is Employer expressly provided under Clauses 2.4, 4.4, 5.1, 6.5(e), 6.7, 14.4,\n\n15.3(b) 15.3(c), 15.4, 15.5, 19.5 and 20.A.3. No set-off under this clause may be made unless: 30.4(a)} the Architect or Quantity Surveyor (on behalf of the Employer) has submitted to the Contractor complete details of their assessment of such set-off; and\n\n30.4(b) the Employer or the Architect on his behalf has given the Contractor a written notice delivered by hand or by registered post, specifying his intention to set- off the amount and the grounds on which such s
