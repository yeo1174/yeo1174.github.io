 <meta property="og:type" content="website">
 <meta property="og:title" content="Khao Sok 2025 — Travel Photos">
 <meta property="og:description" content="Cheow Lan Lake — limestone karsts, floating bungalows, long-tail sunsets. Photo album from the Yeo family travels.">
 <meta property="og:image" content="https://yeo1174.github.io/travel-photos/photo/Khao%20Sok%202025/sunset%20ban%20chiao%20lan.png">
 <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
 <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
 <style>
  :root{--paper:#FAF7F2;--sand:#EDE3D2;--sage-deep:#77856F;--terra:#C67C5B;--terra-deep:#A9613F;--ink:#3A3630;--ink-soft:#6F675C;--line:#E4DBCB;}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Karla', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  .header { max-width: 1200px; margin: 0 auto; padding: 36px 32px 20px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; font-size: 9pt; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sage-deep); }
  .crumbs a { transition: color .25s; }
  .crumbs a:hover { color: var(--terra-deep); }
  .crumbs .sep { color: rgba(58,54,48,.25); }
  .crumbs .here { color: var(--ink); }

  .intro { max-width: 1200px; margin: 0 auto; padding: 60px 32px 30px; }
  .intro h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 28pt; color: var(--ink); margin-bottom: 8px; }
  .intro p { font-size: 10pt; color: var(--sage-deep); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }

  .gallery { max-width: 1200px; margin: 0 auto; padding: 0 32px 80px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .gallery .photo { display: block; border-radius: 2px; overflow: hidden; position: relative; cursor: pointer; aspect-ratio: 4/3; background: var(--sand); }
  .gallery .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .4s; }
  .gallery .photo:hover img { opacity: 0.88; }
  .gallery .photo .caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px 16px 14px; background: linear-gradient(to top, rgba(38,32,24,.55), transparent); font-size: 9pt; color: rgba(250,247,242,.85); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .gallery .photo:hover .caption { opacity: 1; }

  footer { max-width: 1200px; margin: 0 auto; padding: 10px 32px 40px; font-size: 8pt; color: rgba(58,54,48,.4); text-align: center; }

  @media (max-width: 800px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) {
   .header { padding: 28px 20px 16px; }
   .intro { padding: 40px 20px 20px; }
   .intro h1 { font-size: 22pt; }
   .gallery { grid-template-columns: 1fr; padding: 0 20px 60px; }
   .gallery .photo .caption { opacity: 1; }
  }
 </style>
</head>

</div>
